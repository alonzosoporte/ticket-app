<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistema Ticket</title>

<style>
* {
  -webkit-tap-highlight-color: transparent;
}

body {
  margin: 0;
  font-family: Arial;
  background: #f1f3f6;
}

/* HEADER */
.header {
  background: #0d6efd;
  color: white;
  padding: 15px;
  text-align: center;
  font-weight: bold;
  font-size: 18px;
}

/* CONTENEDOR */
.container {
  padding: 15px;
}

/* CARD */
.card {
  background: white;
  border-radius: 12px;
  padding: 15px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

/* INPUTS */
input, textarea {
  width: 100%;
  padding: 12px;
  margin-top: 10px;
  border-radius: 8px;
  border: 1px solid #ccc;
  font-size: 16px;
}

/* BOTÓN */
button {
  width: 100%;
  margin-top: 15px;
  padding: 14px;
  border: none;
  border-radius: 10px;
  background: #28a745;
  color: white;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

/* 💻 PC */
@media (min-width: 768px) {
  .container {
    max-width: 500px;
    margin: auto;
  }

  .header {
    font-size: 22px;
  }
}
</style>
</head>

<body>

<div class="header">🛠 Crear Ticket</div>

<div class="container">
  <div class="card">

    <input id="nombre" placeholder="Nombre">
    <input id="telefono" placeholder="Teléfono">
    <textarea id="problema" placeholder="Describe el problema y/o tarea para realizar"></textarea>

    <button onclick="crearTicket()">Enviar solicitud</button>

  </div>
</div>

<script>
async function crearTicket() {

  const nombre = document.getElementById("nombre").value
  const telefono = document.getElementById("telefono").value
  const problema = document.getElementById("problema").value

  if (!nombre || !telefono || !problema) {
    alert("Completar todos los campos")
    return
  }

  const res = await fetch('/ticket', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ nombre, telefono, problema })
  })

  const data = await res.json()

  // 📲 WhatsApp automático
  let tel = telefono.replace(/\D/g, '')
  if (!tel.startsWith("598")) tel = "598" + tel

  const mensaje = `Hola ${nombre}, su solicitud ha sido procesada.
Ticket: ${data.numero}
El técnico se comunicará a la brevedad.`

  window.location.href =
    "https://wa.me/" + tel + "?text=" + encodeURIComponent(mensaje)
}
</script>

</body>
</html>
