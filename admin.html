<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Tickets</title>

<style>
* { -webkit-tap-highlight-color: transparent; }

body {
  margin: 0;
  font-family: Arial;
  background: #f1f3f6;
}

.header {
  position: sticky;
  top: 0;
  background: #0d6efd;
  color: white;
  padding: 15px;
  text-align: center;
  font-weight: bold;
}

.filtros {
  display: flex;
  gap: 10px;
  padding: 10px;
  background: white;
  position: sticky;
  top: 50px;
}

.filtros button {
  flex: 1;
  padding: 10px;
  border-radius: 8px;
  border: none;
  background: #ddd;
  font-weight: bold;
}

.filtros .activo {
  background: #0d6efd;
  color: white;
}

.container {
  padding: 10px;
}

.card {
  background: white;
  border-radius: 12px;
  padding: 12px;
  margin-bottom: 12px;
  box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}

.pendiente { border-left: 5px solid orange; }
.proceso { border-left: 5px solid blue; }
.reparado { border-left: 5px solid green; }

input, select {
  width: 100%;
  padding: 8px;
  margin-top: 5px;
  border-radius: 8px;
  border: 1px solid #ccc;
}

.acciones {
  display: flex;
  gap: 5px;
  margin-top: 10px;
}

.acciones button {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 8px;
  color: white;
}

.btn-verde { background: #28a745; }
.btn-rojo { background: #dc3545; }
.btn-azul { background: #007bff; }

@media (min-width: 768px) {
  .container {
    max-width: 900px;
    margin: auto;
  }
}
</style>
</head>

<body>

<div class="header">📋 Panel de Tickets</div>

<div class="filtros">
  <button id="btnPendientes">Pendientes</button>
  <button id="btnTodos">Todos</button>
</div>

<div class="container" id="lista"></div>

<script src="/socket.io/socket.io.js"></script>
<script src="admin.js"></script>

</body>
</html>
