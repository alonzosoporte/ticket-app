<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin PRO</title>

<style>
body { 
  font-family: Arial; 
  background:#f4f6f9; 
  margin:0; 
}

header {
  background: linear-gradient(135deg,#1e3c72,#2a5298);
  color:white;
  padding:20px;
  text-align:center;
}

.menu button {
  margin:5px;
  padding:10px 15px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  background:white;
  font-weight:bold;
}

.container {
  max-width:900px;
  margin:auto;
  padding:15px;
}

.ticket {
  background:#fff;
  padding:15px;
  margin-bottom:12px;
  border-radius:12px;
  box-shadow:0 3px 8px rgba(0,0,0,0.1);
}

.botones button {
  margin:3px;
  padding:6px 10px;
  border:none;
  border-radius:6px;
  color:white;
  cursor:pointer;
}

.btn-guardar { background:#007bff; }
.btn-reparado { background:#28a745; }
.btn-wsp { background:#25d366; }
.btn-entregado { background:#6c757d; }
.btn-borrar { background:#dc3545; }

input, textarea {
  width:100%;
  padding:8px;
  margin-top:5px;
  border-radius:6px;
  border:1px solid #ccc;
}
</style>
</head>

<body>

<header>
  <h2>📊 Panel Admin</h2>

  <div class="menu">
    <button onclick="verSeccion('tickets')">📋 Tickets</button>
    <button onclick="irCotizaciones()">💰 Cotizaciones</button>
  </div>
</header>

<div class="container">

<div id="seccionTickets">

  <h3>➕ Nuevo Ticket</h3>

  <input id="nombre" placeholder="Nombre">
  <input id="telefono" placeholder="Teléfono">
  <textarea id="problema" placeholder="Problema"></textarea>

  <button onclick="crear()">Crear Ticket</button>

  <hr>

  <h3>📋 Lista</h3>
  <div id="lista"></div>

</div>

</div>

<script>

// IR A COTIZACIONES
function irCotizaciones(){
  window.location.href = "/cotizaciones.html"
}

// CREAR TICKET
async function crear(){

  const nombre = document.getElementById("nombre").value
  const telefono = document.getElementById("telefono").value
  const problema = document.getElementById("problema").value

  if(!nombre || !telefono){
    alert("Nombre y teléfono obligatorios")
    return
  }

  await fetch("/ticket", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ nombre, telefono, problema })
  })

  limpiar()
  cargar()
}

// LIMPIAR
function limpiar(){
  document.getElementById("nombre").value = ""
  document.getElementById("telefono").value = ""
  document.getElementById("problema").value = ""
}

// CARGAR TICKETS
async function cargar(){

  const res = await fetch("/tickets")
  const data = await res.json()

  const div = document.getElementById("lista")
  div.innerHTML = ""

  data.forEach(t => {

    div.innerHTML += `
      <div class="ticket">

        <b>${t.numero}</b><br>
        ${t.nombre} - ${t.telefono}<br>
        ${t.problema || ""}<br>

        <input id="precio-${t.numero}" placeholder="Precio" value="${t.precio||""}">
        <input id="ganancia-${t.numero}" placeholder="Ganancia" value="${t.ganancia||""}">
        <input id="estado-${t.numero}" placeholder="Estado" value="${t.estado||""}">
        <textarea id="detalle-${t.numero}" placeholder="Detalle">${t.detalle||""}</textarea>

        <div class="botones">
          <button class="btn-guardar" onclick="guardar('${t.numero}')">💾 Guardar</button>
          <button class="btn-reparado" onclick="reparado('${t.numero}','${t.telefono}','${t.nombre}')">🔧 Reparado</button>
          <button class="btn-wsp" onclick="wsp('${t.numero}','${t.telefono}','${t.nombre}')">💬 WhatsApp</button>
          <button class="btn-entregado" onclick="entregado('${t.numero}')">📦 Entregado</button>
          <button class="btn-borrar" onclick="borrar('${t.numero}')">🗑</button>
        </div>

      </div>
    `
  })
}

// GUARDAR
async function guardar(numero){

  const precio = document.getElementById("precio-"+numero).value
  const ganancia = document.getElementById("ganancia-"+numero).value
  const estado = document.getElementById("estado-"+numero).value
  const detalle = document.getElementById("detalle-"+numero).value

  await fetch("/ticket/"+numero,{
    method:"PUT",
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({precio,ganancia,estado,detalle})
  })

  alert("Guardado")
}

// REPARADO
async function reparado(numero,tel,nombre){

  await fetch("/ticket/"+numero,{
    method:"PUT",
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({estado:"reparado"})
  })

  wsp(numero,tel,nombre)
}

// WHATSAPP
function wsp(numero,tel,nombre){

  const precio = document.getElementById("precio-"+numero).value
  const detalle = document.getElementById("detalle-"+numero).value

  const telefono = tel.replace(/\D/g,"")

  const msg = `Hola ${nombre}, su equipo está reparado.
Ticket: ${numero}
Detalle: ${detalle}
Precio: $${precio}`

  window.open("https://wa.me/598"+telefono+"?text="+encodeURIComponent(msg))
}

// ENTREGADO
async function entregado(numero){

  await fetch("/ticket/"+numero,{
    method:"PUT",
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({entregado:"si"})
  })

  cargar()
}

// BORRAR
async function borrar(numero){

  if(!confirm("¿Borrar ticket?")) return

  await fetch("/ticket/"+numero,{method:"DELETE"})

  cargar()
}

// SECCIÓN
function verSeccion(sec){
  document.getElementById("seccionTickets").style.display = "block"
}

// INICIO
cargar()

</script>

</body>
</html>
