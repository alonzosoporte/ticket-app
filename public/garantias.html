const API='https://ticket-pro-xmhs.onrender.com'

// ===== FETCH AUTH =====
function fetchAuth(url,options={}){

  return fetch(API+url,{

    ...options,

    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer '+TOKEN,
      ...(options.headers || {})
    }
  })
}

// ===== MODAL =====
function abrirModal(src){

  document.getElementById('modal')
  .style.display='flex'

  document.getElementById('imgGrande')
  .src=src
}

function cerrarModal(){

  document.getElementById('modal')
  .style.display='none'
}

// ===== FOTO GARANTIA =====
async function subirFoto(id,files){

  if(!files || files.length === 0){
    return
  }

  try{

    const res =
    await fetchAuth('/garantias')

    const garantias =
    await res.json()

    const garantia =
    garantias.find(g => g._id === id)

    let fotosActuales = []

if(
garantia.fotosGarantia &&
Array.isArray(garantia.fotosGarantia)
){
  fotosActuales = garantia.fotosGarantia
}

else if(garantia.fotoGarantia){

  fotosActuales = [garantia.fotoGarantia]
}

    for(let i = 0; i < files.length; i++){

      const file = files[i]

      const base64 =
      await new Promise(resolve=>{

        const reader =
        new FileReader()

        reader.onload = ()=>{

          resolve(reader.result)
        }

        reader.readAsDataURL(file)
      })

      fotosActuales.push(base64)
    }

    await fetchAuth('/garantia/'+id,{

      method:'PUT',

      body:JSON.stringify({

        fotoGarantia:fotosActuales[0],
fotosGarantia:[...fotosActuales]
      })
    })

    cargar()

  }catch(err){

    console.log(err)

    alert('Error subiendo fotos')
  }
}
// ===== GUARDAR FECHA =====
async function guardarFecha(id,valor){

  if(!valor){

    alert('⚠️ Seleccioná una fecha')

    return
  }

  try{

    const res =
    await fetchAuth('/garantia/'+id,{

      method:'PUT',

      body:JSON.stringify({
        garantiaHasta:valor
      })
    })

    if(!res.ok){
      throw new Error()
    }

    alert('✅ Garantía actualizada')

    cargar()

  }catch(err){

    console.error(err)

    alert('❌ Error guardando fecha')
  }
}

// ===== GUARDAR NUMERO SERIE =====
async function guardarNumeroSerie(id,valor){

  try{

    const res =
    await fetchAuth('/garantia/'+id,{

      method:'PUT',

      body:JSON.stringify({
        numeroSerie:valor
      })
    })

    if(!res.ok){
      throw new Error()
    }

  }catch(err){

    console.error(err)

    alert('❌ Error guardando número de serie')
  }
}
// ===== ELIMINAR =====

async function eliminarGarantia(id,nombre,producto){

  const confirmar = confirm(

`¿Eliminar garantía?

Cliente: ${nombre}

Producto: ${producto}`
  )

  if(!confirmar){
    return
  }

  try{

    const res = await fetchAuth('/garantia/'+id,{

      method:'DELETE'
    })

    if(!res.ok){
      throw new Error()
    }

    cargar()

  }catch(err){

    console.error(err)

    alert('❌ Error eliminando garantía')
  }
}
// ===== CARGAR =====
async function cargar(){

  try{

    const res =
    await fetchAuth('/garantias')


  let data =
await res.json()

    const filtroTexto =
    document.getElementById('buscar')
    .value
    .toLowerCase()

    const estado =
    document.getElementById('filtroEstado')
    .value

    const hoy =
    new Date()

    // ===== BUSCADOR =====
    data = data.filter(g=>

      (g.nombre||'')
      .toLowerCase()
      .includes(filtroTexto)

      ||

      (g.celular||'')
      .includes(filtroTexto)

      ||

      (g.producto||'')
      .toLowerCase()
      .includes(filtroTexto)

      ||

      (g.numeroSerie||'')
      .toLowerCase()
      .includes(filtroTexto)
    )

    // ===== FILTRO ESTADO =====
    data = data.filter(g=>{

      if(!g.garantiaHasta){

        return estado !== 'vencidas'
      }

      const f =
      new Date(g.garantiaHasta)

      if(estado==='vigentes'){
        return f >= hoy
      }

      if(estado==='vencidas'){
        return f < hoy
      }

      return true
    })

    const lista =
    document.getElementById('lista')

    lista.innerHTML=''

    data.forEach(g=>{

      console.log(g)
      const fechaGarantia =
      g.garantiaHasta

      const vencida =
      fechaGarantia &&
      new Date(fechaGarantia) < hoy

      const fotos =
      g.fotos ||
      (g.foto ? [g.foto] : [])

      lista.innerHTML += `

      <div class="card">

        📅 ${
          g.fecha
          ? new Date(g.fecha)
          .toLocaleString('es-UY')
          : ''
        }

        <br><br>

        <b>${g.producto || ''}</b>

        <br><br>

        📦 <b>Número de serie:</b>

        <br><br>

        <input
        type="text"

        value="${g.numeroSerie || ''}"

        placeholder="Ingresar número de serie"

        onblur="guardarNumeroSerie('${g._id}',this.value)"

        style="
        width:100%;
        max-width:320px;
        padding:10px;
        border-radius:10px;
        border:2px solid #7688A1;
        margin-bottom:15px;
        ">

        <br>

        🏢 ${g.proveedor || ''}

        <br>

        👤 ${g.nombre || ''}
        (${g.celular || ''})

        <br><br>

        💸 $${g.costoProveedor || 0}

        →

        💰 $${g.precioCliente || 0}

        <br>

        🧾 Ganancia
        $${g.ganancia || ((g.precioCliente||0)-(g.costoProveedor||0))}

        <br><br>

        🛡️ <b>Garantía hasta:</b>

        <br><br>

        <input
        type="date"

        value="${
          g.garantiaHasta
          ? g.garantiaHasta.split('T')[0]
          : ''
        }"

        onchange="guardarFecha('${g._id}',this.value)"

        style="border:2px solid #007bff">

        <span class="${
          vencida
          ? 'vencida'
          : 'vigente'
        }">

          ${
            fechaGarantia
            ? fechaGarantia.split('T')[0]
            : 'Sin fecha'
          }

        </span>

        <br><br>

        ${
          fotos.length

          ?

          `
          <b>📦 Producto:</b>

          <br><br>

          ${fotos.map(f=>`

            <img
            src="${f}"
            class="thumb"
            onclick="abrirModal('${f}')">

          `).join('')}

          <br><br>
          `

          :

          ''
        }

   <b>📸 Garantía:</b>

<br><br>

${
(g.fotosGarantia && g.fotosGarantia.length)

?

`
${g.fotosGarantia.map(f=>`

<img
src="${f}"
class="thumb"
onclick="abrirModal('${f}')">

`).join('')}

<br><br>
`

:

g.fotoGarantia

?

`
<img
src="${g.fotoGarantia}"
class="thumb"
onclick="abrirModal('${g.fotoGarantia}')">

<br><br>
`

:

`
<span style="color:#888">
Sin foto
</span>

<br><br>
`
}

type="file"
multiple
accept="image/*"

</button>

<button
class="btn-danger"
style="
padding:10px 14px;

align-items:center;
gap:6px;
font-size:14px;
"
onclick="eliminarGarantia(
'${g._id}',
'${g.nombre}',
'${g.producto}'
)">
❌ Eliminar

</button>

      </div>
      `
    })

  }catch(err){

    console.error(err)

    alert('❌ Error cargando garantías')
  }
}

// INIT
cargar()

</script>
