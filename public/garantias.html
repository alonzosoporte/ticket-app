<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Garantías</title>

<style>
body { font-family: Arial; background:#eef2f7; padding:20px; }

body {
  font-family: Arial;
  background:#eef2f7;
  padding:20px;
}

/* 🔥 CONTENEDOR SUPERIOR */
.topbar {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:15px;
}

/* 🔍 BUSCADOR PRO */
input {
  padding:8px 10px;
  border-radius:10px;
  border:1px solid #ccc;
  width:250px; /* 🔥 tamaño fijo */
  outline:none;
  transition:0.2s;
}

input:focus {
  border-color:#007bff;
  box-shadow:0 0 0 2px rgba(0,123,255,0.2);
}

/* 🎛️ SELECT */
select {
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
}

/* 🔥 BOTONES */
button {
  padding:10px 14px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  transition:0.2s;
}

/* tipos */
.btn {
  background:#007bff;
  color:white;
}

.btn:hover {
  background:#0056b3;
}

.btn-back {
  background:#6c757d;
  color:white;
}

.btn-back:hover {
  background:#545b62;
}

/* 🧾 CARDS */
.card {
  background:white;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
  transition:0.2s;
}

.card:hover {
  transform:scale(1.01);
}

/* 🛡️ ESTADOS */
.vencida {
  color:red;
  font-weight:bold;
}

.vigente {
  color:green;
  font-weight:bold;
}

</style>
</head>

<body>

<h2>🛡️ Garantías</h2>

<div class="topbar">

  <button class="btn-back" onclick="location.href='admin.html'">⬅ Volver</button>

  <input id="buscar" placeholder="🔍 Buscar por nombre, celular o ticket..." oninput="cargar()">

  <select id="filtro" onchange="cargar()">
    <option value="vigentes">🟢 Vigentes</option>
    <option value="vencidas">🔴 Vencidas</option>
    <option value="todas">📋 Todas</option>
  </select>

</div>

<div id="lista"></div>

<script>

async function cargar() {

  const res = await fetch('/tickets')
  let data = await res.json()

  const texto = (buscar.value || '').toLowerCase()
  const filtro = document.getElementById('filtro').value
  const hoy = new Date()

  // 🔍 FILTRO BUSCADOR
  data = data.filter(t =>
    (t.nombre || '').toLowerCase().includes(texto) ||
    (t.telefono || '').includes(texto) ||
    (t.numero || '').toLowerCase().includes(texto)
  )

  // 🔥 SOLO LOS QUE TIENEN GARANTÍA
  data = data.filter(t => t.garantiaFecha)

  // 🔥 FILTRO ESTADO
  if (filtro === 'vigentes') {
    data = data.filter(t => new Date(t.garantiaFecha) >= hoy)
  }

  if (filtro === 'vencidas') {
    data = data.filter(t => new Date(t.garantiaFecha) < hoy)
  }

  lista.innerHTML = ''

  data.reverse().forEach(t => {

    const g = new Date(t.garantiaFecha)
    const vencida = g < hoy

    lista.innerHTML += `
      <div class="card">

        <b>${t.numero}</b><br>
        ${t.nombre} (${t.telefono})<br>
        ${t.problema}<br>

        📅 ${t.fecha ? new Date(t.fecha).toLocaleDateString() : ''}<br><br>

        🛡️ Garantía:
        <span class="${vencida ? 'vencida' : 'vigente'}">
          ${g.toLocaleDateString()}
          ${vencida ? ' (VENCIDA)' : ''}
        </span>

      </div>
    `
  })
}

cargar()

</script>

</body>
</html>
