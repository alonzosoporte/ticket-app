<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Garantías</title>

<style>
body {
  font-family: Arial;
  background:#eef2f7;
  padding:20px;
}

.topbar {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

input, select {
  padding:8px;
  border-radius:8px;
  border:1px solid #ccc;
}

button {
  padding:8px 12px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  font-weight:bold;
}

.btn { background:#007bff;color:white }
.btn-success { background:#28a745;color:white }
.btn-danger { background:#dc3545;color:white }
.btn-secondary { background:#6c757d;color:white }

.card {
  background:white;
  padding:15px;
  border-radius:12px;
  margin-bottom:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.vencida { color:red; font-weight:bold; }
.vigente { color:green; font-weight:bold; }

.thumb {
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:6px;
  margin:3px;
  cursor:pointer;
}

/* MODAL */
.modal {
  display:none;
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.8);
  justify-content:center;
  align-items:center;
}

.modal img {
  max-width:90%;
  max-height:90%;
}
</style>
</head>

<body>

<h2>🛡️ Garantías</h2>

<div class="topbar">
  <button class="btn-secondary" onclick="location.href='admin.html'">⬅️ Volver</button>

  <input id="buscar" placeholder="🔍 Buscar..." oninput="cargar()">

  <select id="filtroEstado" onchange="cargar()">
    <option value="vigentes">🟢 Vigentes</option>
    <option value="vencidas">🔴 Vencidas</option>
    <option value="todas">📋 Todas</option>
  </select>
</div>

<div id="lista"></div>

<!-- MODAL -->
<div id="modal" class="modal" onclick="cerrarModal()">
  <img id="imgGrande">
</div>

<script>

// ===== MODAL =====
function abrirModal(src){
  modal.style.display='flex'
  imgGrande.src=src
}
function cerrarModal(){
  modal.style.display='none'
}

// ===== FOTO GARANTIA =====
async function subirFoto(id, file){
  if(!file) return

  const r = new FileReader()
  r.onload = async () => {
    await fetch('/garantia/'+id,{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ fotoGarantia: r.result })
    })
    cargar()
  }
  r.readAsDataURL(file)
}

// ===== GUARDAR FECHA =====
async function guardarFecha(id, valor){
  await fetch('/garantia/'+id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ garantiaHasta: valor })
  })
}

// ===== CARGAR =====
async function cargar(){

  const res = await fetch('/garantias')
  let data = await res.json()

  const filtroTexto = buscar.value.toLowerCase()
  const estado = filtroEstado.value
  const hoy = new Date()

  // 🔍 BUSCADOR
  data = data.filter(g =>
    (g.nombre||'').toLowerCase().includes(filtroTexto) ||
    (g.celular||'').includes(filtroTexto) ||
    (g.producto||'').toLowerCase().includes(filtroTexto)
  )

  // 🔽 FILTRO ESTADO
  data = data.filter(g => {

    if(!g.garantiaFecha) return estado !== 'vencidas'

    const f = new Date(g.garantiaFecha)

    if(estado === 'vigentes') return f >= hoy
    if(estado === 'vencidas') return f < hoy

    return true
  })

  lista.innerHTML=''

  data.reverse().forEach(g=>{

    const fechaGarantia = g.garantiaFecha ? new Date(g.garantiaFecha) : null
    const vencida = fechaGarantia && fechaGarantia < hoy

    lista.innerHTML += `
    <div class="card">

      📅 ${g.fecha ? new Date(g.fecha).toLocaleString() : ''}<br>

      <b>${g.producto}</b><br>
      🏢 ${g.proveedor || ''}<br>
      ${g.nombre} (${g.celular})<br><br>

      💸 $${g.costoProveedor || 0} → 💰 $${g.precioCliente || 0}<br>
      🧾 Ganancia $${g.ganancia || (g.precioCliente - g.costoProveedor)}<br><br>

      🛡️ <b>Garantía hasta:</b><br>

      <input type="date"
      value="${g.garantiaFecha ? g.garantiaFecha.split('T')[0] : ''}"
      onchange="guardarFecha('${g._id}', this.value)">

      <span class="${vencida ? 'vencida':'vigente'}">
        ${fechaGarantia ? fechaGarantia.toLocaleDateString() : 'Sin fecha'}
      </span>

      <br><br>

      <!-- 📸 FOTOS PRODUCTO -->
      ${
        g.fotos && g.fotos.length
        ? `
          <b>📦 Producto:</b><br>
          ${g.fotos.map(f => `
            <img src="${f}" class="thumb" onclick="abrirModal('${f}')">
          `).join('')}
          <br><br>
        `
        : ''
      }

      <!-- 📸 FOTO GARANTIA -->
      <b>📸 Garantía:</b><br>

      ${
        g.fotoGarantia
        ? `<img src="${g.fotoGarantia}" class="thumb" onclick="abrirModal('${g.fotoGarantia}')"><br>`
        : '<span style="color:#888">Sin foto</span><br>'
      }

      <input type="file" onchange="subirFoto('${g._id}', this.files[0])">

    </div>
    `
  })
}

// INIT
cargar()

</script>

</body>
</html>
