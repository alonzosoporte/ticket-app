<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cotizaciones PRO</title>

<style>
body {
  font-family: Arial;
  background:#eef2f7;
  padding:20px;
}

.topbar {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:15px;
  align-items:center;
}

input, select, textarea {
  padding:8px 10px;
  border-radius:10px;
  border:1px solid #ccc;
}

button {
  padding:8px 12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.btn { background:#007bff; color:white; }
.btn-success { background:#28a745; color:white; }
.btn-danger { background:#dc3545; color:white; }
.btn-secondary { background:#6c757d; color:white; }

.card {
  background:white;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.input-error {
  border:2px solid #dc3545 !important;
  background:#fff5f5;
}

.fila-precios {
  display:flex;
  gap:10px;
}

.fila-precios div {
  flex:1;
}

.fila-precios input {
  text-align:center;
  font-weight:bold;
}

label {
  font-size:12px;
  color:#666;
}

/* 🔥 MINIATURAS */
.thumb {
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:8px;
  margin:3px;
  cursor:pointer;
}

.thumb:hover{
  transform:scale(1.1);
}

/* ❌ botón borrar */
.borrar-img {
  background:#dc3545;
  color:white;
  font-size:10px;
  border:none;
  border-radius:5px;
  cursor:pointer;
  margin-left:3px;
}

/* 🔥 MODAL */
.modal {
  display:none;
  position:fixed;
  z-index:999;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.8);
  justify-content:center;
  align-items:center;
}

.modal img {
  max-width:90%;
  max-height:90%;
  border-radius:10px;
}
</style>
</head>

<body>

<h2>📊 Cotizaciones</h2>

<div class="topbar">
  <button class="btn-secondary" onclick="location.href='admin.html'">⬅️ Volver</button>

  <input id="buscar" placeholder="🔍 Buscar..." oninput="cargar()">

  <select id="filtroEstado" onchange="cargar()">
    <option value="pendientes">⏳ Pendientes</option>
    <option value="confirmadas">✅ Confirmadas</option>
    <option value="todas">📋 Todas</option>
  </select>

  <button class="btn" onclick="mostrarForm()">➕ Nueva</button>
</div>

<div id="form" style="display:none;background:white;padding:15px;border-radius:12px;margin-bottom:15px">

<input id="nombre" placeholder="Nombre">
<input id="celular" placeholder="Celular">

<hr>

<input id="producto" placeholder="Producto">

<br><br>

<select id="proveedor"></select>
<button type="button" class="btn-danger" onclick="eliminarProveedor()">❌</button>

<input id="nuevoProveedor" placeholder="Nuevo proveedor">
<button type="button" class="btn" onclick="agregarProveedor()">➕</button>

<br><br>

<div class="fila-precios">
  <div>
    <label>Costo</label>
    <input id="costoProveedor">
  </div>

  <div>
    <label>Cliente</label>
    <input id="precioCliente">
  </div>

  <div>
    <label>Ganancia</label>
    <input id="ganancia" readonly>
  </div>
</div>

<br>

<textarea id="descripcion" placeholder="Descripción"></textarea>

<br><br>

📸 <input type="file" id="foto" multiple>

<div id="preview"></div>

<br>

<button class="btn-success" onclick="guardar()">💾 Guardar</button>
<button class="btn-danger" onclick="cancelar()">❌ Cancelar</button>

</div>

<div id="lista"></div>

<!-- MODAL -->
<div id="modal" class="modal" onclick="cerrarModal()">
  <img id="imgGrande">
</div>

<script>

let editando = null
let fotosBase64 = []

// ===== GANANCIA =====
function calcularGanancia() {
  const costo = parseFloat(costoProveedor.value) || 0
  const precio = parseFloat(precioCliente.value) || 0
  ganancia.value = precio - costo
}

costoProveedor.oninput = calcularGanancia
precioCliente.oninput = calcularGanancia

// ===== FOTO MULTIPLE =====
foto.onchange = e => {
  const files = e.target.files

  for(let file of files){
    const r = new FileReader()
    r.onload = () => {
      fotosBase64.push(r.result)
      renderPreview()
    }
    r.readAsDataURL(file)
  }
}

function renderPreview(){
  preview.innerHTML = fotosBase64.map((f,i)=>`
    <div style="display:inline-block">
      <img src="${f}" class="thumb" onclick="abrirModal('${f}')">
      <button class="borrar-img" onclick="borrarFoto(${i})">X</button>
    </div>
  `).join('')
}

function borrarFoto(i){
  fotosBase64.splice(i,1)
  renderPreview()
}

// ===== MODAL =====
function abrirModal(src){
  modal.style.display='flex'
  imgGrande.src=src
}
function cerrarModal(){
  modal.style.display='none'
}

// ===== VALIDACIÓN =====
function validarCampos(){
  let ok = true
  const campos = [nombre,celular,producto,proveedor,costoProveedor,precioCliente,descripcion]

  campos.forEach(c=>{
    if(!c.value.trim()){
      c.classList.add('input-error')
      ok = false
    }
  })

  if(!ok) alert("⚠️ Completá todos los campos")

  return ok
}

// ===== GUARDAR =====
async function guardar() {

  if (!validarCampos()) return

  const data = {
    nombre: nombre.value,
    celular: celular.value,
    producto: producto.value,
    proveedor: proveedor.value,
    costoProveedor: costoProveedor.value,
    precioCliente: precioCliente.value,
    descripcion: descripcion.value,
    fotos: fotosBase64
  }

  if (editando) {
    await fetch('/cotizacion/' + editando,{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(data)
    })
  } else {
    await fetch('/cotizacion',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(data)
    })
  }

  limpiar()
  cargar()
}

// ===== CONFIRMAR =====
async function confirmar(id){
  await fetch('/cotizacion/'+id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ confirmada:'si' })
  })
  cargar()
}

// ===== LISTAR =====
async function cargar() {

  const res = await fetch('/cotizaciones')
  let data = await res.json()

  const estado = filtroEstado.value

  if (estado === 'pendientes') data = data.filter(c => c.confirmada !== 'si')
  if (estado === 'confirmadas') data = data.filter(c => c.confirmada === 'si')

  const filtro = buscar.value.toLowerCase()

  data = data.filter(c =>
    (c.nombre || '').toLowerCase().includes(filtro) ||
    (c.celular || '').includes(filtro)
  )

  lista.innerHTML = ''

  data.reverse().forEach(c => {

    const costo = parseFloat(c.costoProveedor) || 0
    const precio = parseFloat(c.precioCliente) || 0
    const gan = precio - costo

    lista.innerHTML += `
    <div class="card">

      📅 ${c.fecha ? new Date(c.fecha).toLocaleString() : ''}<br>

      <b>${c.producto}</b><br>
      ${c.nombre} (${c.celular})<br>

      💸 $${costo} → 💰 $${precio}<br>
      🧾 Ganancia $${gan}<br><br>

      ${
        c.fotos && c.fotos.length
        ? c.fotos.map(f=>`
          <img src="${f}" class="thumb" onclick="abrirModal('${f}')">
        `).join('')
        : ''
      }

      <br><br>

      ${
        c.confirmada === 'si'
        ? `
          <span style="color:green;font-weight:bold">✔️ Confirmada</span><br><br>
          <button class="btn-danger" onclick="borrar('${c._id}')">❌</button>
        `
        : `
          <span style="color:orange;font-weight:bold">⏳ Pendiente</span><br><br>
          <button class="btn" onclick="editar('${c._id}')">✏️</button>
          <button class="btn-danger" onclick="borrar('${c._id}')">❌</button>
          <button class="btn-success" onclick="confirmar('${c._id}')">✔️ Confirmar</button>
        `
      }

    </div>
    `
  })
}

// ===== RESTO =====
async function editar(id){
  const res = await fetch('/cotizaciones')
  const data = await res.json()
  const c = data.find(x => x._id === id)

  editando = c._id

  nombre.value=c.nombre||''
  celular.value=c.celular||''
  producto.value=c.producto||''
  proveedor.value=c.proveedor||''
  costoProveedor.value=c.costoProveedor||''
  precioCliente.value=c.precioCliente||''
  descripcion.value=c.descripcion||''

  fotosBase64 = c.fotos || []
  renderPreview()

  calcularGanancia()
  form.style.display='block'
}

async function borrar(id){
  if(!confirm('Eliminar?'))return
  await fetch('/cotizacion/'+id,{method:'DELETE'})
  cargar()
}

function mostrarForm(){
  limpiar()
  form.style.display='block'
}

function cancelar(){
  limpiar()
}

function limpiar(){
  editando = null
  fotosBase64 = []
  preview.innerHTML=''

  nombre.value=''
  celular.value=''
  producto.value=''
  costoProveedor.value=''
  precioCliente.value=''
  descripcion.value=''
  ganancia.value=''
  proveedor.value=''
  foto.value=''

  form.style.display='none'
}

// limpiar errores
document.addEventListener('input', (e)=>{
  if(e.target.matches('input, textarea, select')){
    e.target.classList.remove('input-error')
  }
})

// INIT
cargar()
cargarProveedores()

</script>

</body>
</html>
