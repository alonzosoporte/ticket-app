<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cotizaciones PRO</title>

<style>

body {
  font-family: Arial;
  background:#eef2f7;
  padding:20px;
}

.topbar {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:15px;
  align-items:center;
}

input, select, textarea {
  padding:8px 10px;
  border-radius:10px;
  border:1px solid #ccc;
}

button {
  padding:8px 12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.btn { background:#007bff; color:white; }
.btn-success { background:#28a745; color:white; }
.btn-danger { background:#dc3545; color:white; }
.btn-secondary { background:#6c757d; color:white; }

.card {
  background:white;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.fila-precios {
  display:flex;
  gap:12px;
  flex-wrap:wrap;
}

.campo {
  flex:1;
  min-width:150px;
}

.thumb {
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:6px;
  margin:3px;
  cursor:pointer;
}

.vencida {
  color:red;
  font-weight:bold;
}

</style>
</head>

<body>

<h2>📊 Cotizaciones</h2>

<div class="topbar">
  <button class="btn-secondary" onclick="location.href='admin.html'">⬅ Volver</button>
  <input id="buscar" placeholder="🔍 Buscar..." oninput="cargar()">
  <button class="btn" onclick="mostrarForm()">➕ Nueva</button>
</div>

<div id="form" style="display:none;background:white;padding:15px;border-radius:12px;margin-bottom:15px">

<input id="nombre" placeholder="Nombre">
<input id="celular" placeholder="Celular">

<hr>

<input id="producto" placeholder="Producto">

<br><br>

<select id="proveedor">
  <option value="">-- Seleccionar proveedor --</option>
</select>

<input id="nuevoProveedor" placeholder="Nuevo proveedor">
<button class="btn" onclick="agregarProveedor()">➕</button>

<br><br>

<div class="fila-precios">

  <div class="campo">
    <label>Precio costo:</label>
    <input id="costoProveedor">
  </div>

  <div class="campo">
    <label>Precio cliente:</label>
    <input id="precioCliente">
  </div>

  <div class="campo">
    <label>Ganancia:</label>
    <input id="ganancia" readonly>
  </div>

</div>

<br>

<textarea id="descripcion" placeholder="Descripción"></textarea>

<br>

📸 <input type="file" id="foto">
<br>
🛡️ <input type="date" id="garantiaFecha">
📸 <input type="file" id="garantiaFoto">

<br><br>

<button class="btn-success" onclick="guardar()">💾 Guardar</button>
<button class="btn-danger" onclick="cancelar()">❌ Cancelar</button>

</div>

<div id="lista"></div>

<script>

let editando = null
let fotoBase64 = ''
let garantiaBase64 = ''

// ================= GANANCIA =================
function calcularGanancia() {
  const costo = parseFloat(costoProveedor.value) || 0
  const precio = parseFloat(precioCliente.value) || 0
  ganancia.value = precio - costo
}

costoProveedor.oninput = calcularGanancia
precioCliente.oninput = calcularGanancia

// ================= IMÁGENES =================
foto.onchange = e => {
  const r = new FileReader()
  r.onload = () => fotoBase64 = r.result
  r.readAsDataURL(e.target.files[0])
}

garantiaFoto.onchange = e => {
  const r = new FileReader()
  r.onload = () => garantiaBase64 = r.result
  r.readAsDataURL(e.target.files[0])
}

// ================= PROVEEDORES =================
async function cargarProveedores() {
  const res = await fetch('/cotizaciones')
  const text = await res.text()

  console.log("RESPUESTA:", text)

  const data = JSON.parse(text)

  proveedor.innerHTML = `<option value="">-- Seleccionar proveedor --</option>`

  data.forEach(p => {
    proveedor.innerHTML += `<option value="${p.nombre}">${p.nombre}</option>`
  })
}

async function agregarProveedor(){
  const nombre = nuevoProveedor.value.trim()
  if(!nombre) return alert('Escribí proveedor')

  await fetch('/proveedor',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ nombre })
  })

  nuevoProveedor.value=''
  cargarProveedores()
}

// ================= GUARDAR =================
async function guardar() {

  const data = {
    nombre: nombre.value,
    celular: celular.value,
    producto: producto.value,
    proveedor: proveedor.value,
    costoProveedor: costoProveedor.value,
    precioCliente: precioCliente.value,
    descripcion: descripcion.value,
    foto: fotoBase64 || '',
    garantiaFecha: garantiaFecha.value,
    garantiaFoto: garantiaBase64 || ''
  }

  if (editando) {
    await fetch('/cotizacion/' + editando,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
  } else {
    await fetch('/cotizacion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
  }

  limpiar()
  cargar()
}

// ================= CONFIRMAR VENTA =================
async function confirmar(id){

  const res = await fetch('/cotizaciones')
  const data = await res.json()
  const c = data.find(x => x._id === id)

  if (!c) return

  const costo = parseFloat(c.costoProveedor) || 0
  const precio = parseFloat(c.precioCliente) || 0
  const gan = precio - costo

  await fetch('/cotizacion/'+id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      confirmada:'si',
      ganancia: gan
    })
  })

  alert(`✅ Venta confirmada\n💰 Ganancia: $${gan}`)

  cargar()
}

// ================= LISTAR =================
async function cargar() {

  const res = await fetch('/cotizaciones')
  let data = await res.json()

  const filtro = (buscar.value || '').toLowerCase()

  data = data.filter(c =>
    (c.nombre || '').toLowerCase().includes(filtro) ||
    (c.celular || '').includes(filtro)
  )

  lista.innerHTML = ''

  data.reverse().forEach(c => {

    const costo = parseFloat(c.costoProveedor) || 0
    const precio = parseFloat(c.precioCliente) || 0
    const gan = c.ganancia || (precio - costo)

    lista.innerHTML += `
      <div class="card">

        📅 ${c.fecha ? new Date(c.fecha).toLocaleString() : ''}<br>

        <b>${c.producto}</b><br>
        ${c.nombre} (${c.celular})<br>

        💸 Costo $${costo} | 💰 Cliente $${precio}<br>
        🧾 <b>Ganancia $${gan}</b><br><br>

        ${
          c.confirmada === 'si'
          ? `
            <span style="color:green;font-weight:bold">✔ Venta confirmada</span><br><br>
            <button class="btn-danger" onclick="borrar('${c._id}')">❌</button>
          `
          : `
            <button class="btn" onclick="editar('${c._id}')">✏️</button>
            <button class="btn-danger" onclick="borrar('${c._id}')">❌</button>
            <button class="btn-success" onclick="confirmar('${c._id}')">✔ Confirmar venta</button>
          `
        }

      </div>
    `
  })
}

// ================= RESTO =================
async function editar(id){
  const res = await fetch('/cotizaciones')
  const data = await res.json()
  const c = data.find(x => x._id === id)

  editando = c._id

  nombre.value=c.nombre||''
  celular.value=c.celular||''
  producto.value=c.producto||''
  costoProveedor.value=c.costoProveedor||''
  precioCliente.value=c.precioCliente||''
  descripcion.value=c.descripcion||''

  calcularGanancia()
  form.style.display='block'
}

async function borrar(id){
  if(!confirm('Eliminar?'))return
  await fetch('/cotizacion/'+id,{method:'DELETE'})
  cargar()
}

function mostrarForm(){
  limpiar()
  document.getElementById('form').style.display = 'block'
}

function cancelar(){
  limpiar()
}

function limpiar(){
  editando=null
  nombre.value=''
  celular.value=''
  producto.value=''
  costoProveedor.value=''
  precioCliente.value=''
  descripcion.value=''
  ganancia.value=''
  document.getElementById('form').style.display='none'
}

// ================= INIT =================
cargar()
cargarProveedores()

</script>

</body>
</html>
