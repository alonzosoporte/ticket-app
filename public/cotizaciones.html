<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cotizaciones PRO</title>

<style>
body {
  font-family: Arial;
  background:#eef2f7;
  padding:20px;
}

.topbar {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:15px;
  align-items:center;
}

input, select, textarea {
  padding:8px 10px;
  border-radius:10px;
  border:1px solid #ccc;
}

button {
  padding:8px 12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.btn { background:#007bff; color:white; }
.btn-success { background:#28a745; color:white; }
.btn-danger { background:#dc3545; color:white; }
.btn-secondary { background:#6c757d; color:white; }

.card {
  background:white;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.input-error {
  border:2px solid #dc3545 !important;
  background:#fff5f5;
}

.fila-precios {
  display:flex;
  gap:10px;
}

.fila-precios div {
  flex:1;
}

.thumb {
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:8px;
  margin:4px;
  cursor:pointer;
}

.thumb-box{
  position:relative;
  display:inline-block;
}

.btn-remove{
  position:absolute;
  top:-5px;
  right:-5px;
  background:red;
  color:white;
  border-radius:50%;
  font-size:12px;
  width:18px;
  height:18px;
  text-align:center;
  cursor:pointer;
}

/* MODAL */
.modal {
  display:none;
  position:fixed;
  z-index:999;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.8);
  justify-content:center;
  align-items:center;
}

.modal img {
  max-width:90%;
  max-height:90%;
}
</style>
</head>

<body>

<h2>📊 Cotizaciones</h2>

<div class="topbar">
  <button class="btn-secondary" onclick="location.href='admin.html'">⬅️ Volver</button>

  <input id="buscar" placeholder="🔍 Buscar..." oninput="cargar()">

  <select id="filtroEstado" onchange="cargar()">
    <option value="pendientes">⏳ Pendientes</option>
    <option value="confirmadas">✅ Confirmadas</option>
    <option value="todas">📋 Todas</option>
  </select>

  <button class="btn" onclick="mostrarForm()">➕ Nueva</button>
</div>

<div id="form" style="display:none;background:white;padding:15px;border-radius:12px;margin-bottom:15px">

<input id="nombre" placeholder="Nombre">
<input id="celular" placeholder="Celular">

<hr>

<input id="producto" placeholder="Producto">

<br><br>

<select id="proveedor"></select>

<br><br>

<div class="fila-precios">
  <div>
    <label>Costo</label>
    <input id="costoProveedor">
  </div>

  <div>
    <label>Cliente</label>
    <input id="precioCliente">
  </div>

  <div>
    <label>Ganancia</label>
    <input id="ganancia" readonly>
  </div>
</div>

<br>

<textarea id="descripcion" placeholder="Descripción"></textarea>

<br><br>

📸 <input type="file" id="foto" multiple>

<div id="preview"></div>

<br>

<button class="btn-success" onclick="guardar()">💾 Guardar</button>
<button class="btn-danger" onclick="cancelar()">❌ Cancelar</button>

</div>

<div id="lista"></div>

<!-- MODAL -->
<div id="modal" class="modal" onclick="cerrarModal()">
  <img id="imgGrande">
</div>

<script>

let editando = null
let fotosBase64 = []

// ===== GANANCIA =====
function calcularGanancia(){
  const costo = parseFloat(costoProveedor.value) || 0
  const precio = parseFloat(precioCliente.value) || 0
  ganancia.value = precio - costo
}
costoProveedor.oninput = calcularGanancia
precioCliente.oninput = calcularGanancia

// ===== FOTO MULTIPLE =====
foto.onchange = e=>{
  const files = e.target.files

  for(let file of files){
    const r = new FileReader()
    r.onload = ()=>{
      fotosBase64.push(r.result)
      renderPreview()
    }
    r.readAsDataURL(file)
  }
}

function renderPreview(){
  preview.innerHTML=''

  fotosBase64.forEach((f,i)=>{
    preview.innerHTML += `
      <div class="thumb-box">
        <span class="btn-remove" onclick="eliminarFoto(${i})">x</span>
        <img src="${f}" class="thumb" onclick="abrirModal('${f}')">
      </div>
    `
  })
}

function eliminarFoto(i){
  fotosBase64.splice(i,1)
  renderPreview()
}

// ===== MODAL =====
function abrirModal(src){
  modal.style.display='flex'
  imgGrande.src=src
}
function cerrarModal(){
  modal.style.display='none'
}

// ===== VALIDAR =====
function validarCampos(){
  let ok=true
  const campos=[nombre,celular,producto,proveedor,costoProveedor,precioCliente,descripcion]

  campos.forEach(c=>{
    if(!c.value.trim()){
      c.classList.add('input-error')
      ok=false
    }
  })

  if(!ok) alert("⚠️ Completá todos los campos")
  return ok
}

// ===== GUARDAR =====
async function guardar(){
  if(!validarCampos()) return

  const data={
    nombre:nombre.value,
    celular:celular.value,
    producto:producto.value,
    proveedor:proveedor.value,
    costoProveedor:costoProveedor.value,
    precioCliente:precioCliente.value,
    descripcion:descripcion.value,
    fotos:fotosBase64
  }

  if(editando){
    await fetch('/cotizacion/'+editando,{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(data)
    })
  }else{
    await fetch('/cotizacion',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(data)
    })
  }

  limpiar()
  cargar()
}

// ===== CONFIRMAR =====
async function confirmar(id){
  await fetch('/cotizacion/'+id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({confirmada:'si'})
  })
  cargar()
}

// ===== LISTAR =====
async function cargar(){
  const res = await fetch('/cotizaciones')
  let data = await res.json()

  const estado = filtroEstado.value

  if(estado==='pendientes') data=data.filter(c=>c.confirmada!=='si')
  if(estado==='confirmadas') data=data.filter(c=>c.confirmada==='si')

  lista.innerHTML=''

  data.reverse().forEach(c=>{

    const fotos = c.fotos || []

    lista.innerHTML += `
    <div class="card">

      <b>${c.producto}</b><br>
      ${c.nombre}<br><br>

      ${
        fotos.length
        ? fotos.map(f=>`<img src="${f}" class="thumb" onclick="abrirModal('${f}')">`).join('')
        : ''
      }

      <br><br>

      ${
        c.confirmada==='si'
        ? `<span style="color:green">✔️ Confirmada</span>`
        : `<button class="btn-success" onclick="confirmar('${c._id}')">Confirmar</button>`
      }

    </div>
    `
  })
}

// ===== LIMPIAR =====
function limpiar(){
  editando=null
  fotosBase64=[]
  preview.innerHTML=''

  nombre.value=''
  celular.value=''
  producto.value=''
  costoProveedor.value=''
  precioCliente.value=''
  descripcion.value=''
  proveedor.value=''

  form.style.display='none'
}

// INIT
cargar()

</script>

</body>
</html>
