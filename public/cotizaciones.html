<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cotizaciones PRO</title>

<style>
body { font-family: Arial; background:#eef2f7; padding:20px; }

.card {
  background:white;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

input, select, button, textarea {
  padding:6px;
  margin:4px;
  border-radius:6px;
  border:1px solid #ccc;
}

button { cursor:pointer }

.thumb {
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:6px;
  margin:3px;
  cursor:pointer;
  border:2px solid #ddd;
}

.thumb:hover {
  border-color:#007bff;
}

.vencida {
  color:red;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>📊 Cotizaciones</h2>

<button onclick="location.href='admin.html'">⬅ Volver</button>

<br><br>

<input id="buscar" placeholder="Buscar..." oninput="cargar()">
<button onclick="mostrarForm()">➕ Nueva</button>

<div id="form" style="display:none;background:white;padding:10px;border-radius:10px;margin-top:10px">

<input id="nombre" placeholder="Nombre">
<input id="celular" placeholder="Celular">

<hr>

<input id="producto" placeholder="Producto">

<select id="proveedor"></select>
<input id="nuevoProveedor" placeholder="Nuevo proveedor">
<button onclick="agregarProveedor()">➕</button>

<br>

<input id="costoProveedor" placeholder="Costo proveedor">
<input id="precioCliente" placeholder="Precio cliente">
<input id="ganancia" placeholder="Ganancia" readonly>

<br>

<textarea id="descripcion" placeholder="Descripción"></textarea>

<br>

📸 Foto:
<input type="file" id="foto">

<br>

🛡️ Garantía hasta:
<input type="date" id="garantiaFecha">

📸 Foto garantía:
<input type="file" id="garantiaFoto">

<br><br>

<button onclick="guardar()">💾 Guardar</button>
<button onclick="cancelar()">❌ Cancelar</button>

</div>

<div id="lista"></div>

<!-- MODAL IMAGEN -->
<div id="modalImg" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);justify-content:center;align-items:center;z-index:999">
  <img id="imgGrande" style="max-width:90%;max-height:90%;border-radius:10px">
</div>

<script>

let editando = null
let fotoBase64 = ''
let garantiaBase64 = ''

// ================= GANANCIA =================
function calcularGanancia() {
  const costo = parseFloat(costoProveedor.value) || 0
  const precio = parseFloat(precioCliente.value) || 0
  ganancia.value = precio - costo
}

costoProveedor.oninput = calcularGanancia
precioCliente.oninput = calcularGanancia

// ================= FOTO =================
foto.onchange = e => {
  const r = new FileReader()
  r.onload = () => fotoBase64 = r.result
  r.readAsDataURL(e.target.files[0])
}

garantiaFoto.onchange = e => {
  const r = new FileReader()
  r.onload = () => garantiaBase64 = r.result
  r.readAsDataURL(e.target.files[0])
}

// ================= PROVEEDORES =================
async function cargarProveedores() {
  const res = await fetch('/proveedores')
  const data = await res.json()

  proveedor.innerHTML = ''

  data.forEach(p => {
    proveedor.innerHTML += `<option value="${p._id}">${p.nombre}</option>`
  })
}

async function agregarProveedor() {
  if (!nuevoProveedor.value) return alert('Escribí proveedor')

  await fetch('/proveedores', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ nombre: nuevoProveedor.value })
  })

  nuevoProveedor.value = ''
  cargarProveedores()
}

// ================= GUARDAR =================
async function guardar() {

  const data = {
    nombre: nombre.value,
    celular: celular.value,
    producto: producto.value,
    proveedor: proveedor.value,
    costoProveedor: costoProveedor.value,
    precioCliente: precioCliente.value,
    descripcion: descripcion.value,
    foto: fotoBase64 || '',
    garantiaFecha: garantiaFecha.value,
    garantiaFoto: garantiaBase64 || ''
  }

  if (editando) {
    await fetch('/cotizacion/' + editando, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(data)
    })
  } else {
    await fetch('/cotizacion', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(data)
    })
  }

  limpiar()
  cargar()
}

// ================= CARGAR =================
async function cargar() {

  const res = await fetch('/cotizaciones')
  let data = await res.json()

  const filtro = (buscar.value || '').toLowerCase()

  data = data.filter(c =>
    (c.producto || '').toLowerCase().includes(filtro) ||
    (c.nombre || '').toLowerCase().includes(filtro) ||
    (c.celular || '').includes(filtro)
  )

  lista.innerHTML = ''

  data.reverse().forEach(c => {

    const costo = parseFloat(c.costoProveedor) || 0
    const precio = parseFloat(c.precioCliente) || 0
    const gan = c.ganancia || (precio - costo)

    const color = gan >= 0 ? 'green' : 'red'

    // 🔥 GARANTÍA
    let garantiaTexto = ''
    if (c.garantiaFecha) {
      const hoy = new Date()
      const g = new Date(c.garantiaFecha)
      const vencida = g < hoy

      garantiaTexto = `
        <br>🛡️ Garantía:
        <span class="${vencida ? 'vencida' : ''}">
          ${g.toLocaleDateString()}
          ${vencida ? ' (VENCIDA)' : ''}
        </span>
      `
    }

    lista.innerHTML += `
      <div class="card">

        <b>${c.producto}</b><br>
        ${c.nombre || ''} (${c.celular || ''})<br>

        💸 Precio costo $ ${costo}<br>
        💰 Precio cliente $${precio}<br>
        🧾 Ganancia <span style="color:${color};font-weight:bold">$${gan}</span><br>
 
        ${garantiaTexto}

        <br>

        ${c.foto ? `<img class="thumb" src="${c.foto}" onclick="verImg('${c.foto}')">` : ''}
        ${c.garantiaFoto ? `<img class="thumb" src="${c.garantiaFoto}" onclick="verImg('${c.garantiaFoto}')">` : ''}

        <br><br>

        ${
          c.confirmada === 'si'
          ? `
            <span style="color:green;font-weight:bold">✅ Confirmada</span><br><br>
            <button onclick="borrar('${c._id}')">❌</button>
          `
          : `
            <button onclick='editar(${JSON.stringify(c)})'>✏️</button>
            <button onclick="borrar('${c._id}')">❌</button>
            <button onclick="confirmar('${c._id}')">✔ Confirmar</button>
          `
        }

      </div>
    `
  })
}

// ================= IMAGEN =================
function verImg(src) {
  modalImg.style.display = 'flex'
  imgGrande.src = src
}

modalImg.onclick = () => {
  modalImg.style.display = 'none'
}

// ================= EDITAR =================
function editar(c) {
  editando = c._id

  nombre.value = c.nombre || ''
  celular.value = c.celular || ''
  producto.value = c.producto || ''
  costoProveedor.value = c.costoProveedor || ''
  precioCliente.value = c.precioCliente || ''
  descripcion.value = c.descripcion || ''
  garantiaFecha.value = c.garantiaFecha || ''

  fotoBase64 = c.foto || ''
  garantiaBase64 = c.garantiaFoto || ''

  calcularGanancia()
  form.style.display = 'block'
}

// ================= BORRAR =================
async function borrar(id) {
  if (!confirm('Eliminar?')) return
  await fetch('/cotizacion/' + id, { method:'DELETE' })
  cargar()
}

// ================= CONFIRMAR =================
async function confirmar(id) {
  const res = await fetch('/cotizaciones')
  const data = await res.json()

  const c = data.find(x => x._id === id)

  await fetch('/cotizacion/' + id, {
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      confirmada: 'si',
      costoProveedor: c.costoProveedor,
      precioCliente: c.precioCliente
    })
  })

  cargar()
}

// ================= UI =================
function mostrarForm() {
  limpiar()
  form.style.display = 'block'
}

function cancelar() {
  limpiar()
}

function limpiar() {

  editando = null

  // 🔥 limpiar memoria
  fotoBase64 = ''
  garantiaBase64 = ''

  // 🔥 limpiar inputs
  nombre.value = ''
  celular.value = ''
  producto.value = ''
  costoProveedor.value = ''
  precioCliente.value = ''
  descripcion.value = ''
  ganancia.value = ''
  garantiaFecha.value = ''

  // 🔥 limpiar file inputs (CLAVE)
  document.getElementById('foto').value = ''
  document.getElementById('garantiaFoto').value = ''

  // 🔥 ocultar form
  form.style.display = 'none'
}

// INIT
cargar()
cargarProveedores()

</script>

</body>
</html>
