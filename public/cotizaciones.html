<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cotizaciones</title>

<style>
body {
  font-family: Arial;
  background: #eef2f7;
  padding: 20px;
}

.top {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.card {
  background: white;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

input, textarea, select, button {
  padding:6px;
  border-radius:6px;
  border:1px solid #ccc;
}

button { cursor:pointer; }

img {
  max-width:120px;
  margin-top:5px;
  border-radius:6px;
}

#sugerencias {
  background:white;
  border:1px solid #ccc;
  position:absolute;
  z-index:10;
}

.sug { padding:5px; cursor:pointer; }
.sug:hover { background:#eee; }

.resumen {
  background:#fff;
  padding:15px;
  border-radius:10px;
  margin-bottom:15px;
}
</style>
</head>

<body>

<h2>📊 Cotizaciones</h2>

<div class="top">
  <input id="buscar" placeholder="Buscar por nombre, celular o producto" oninput="cargar()">
  <button onclick="mostrarForm()">➕ Nueva cotización</button>

  <select id="filtroMes" onchange="cargar()">
    <option value="todos">Todos los meses</option>
  </select>
</div>

<div id="resumen"></div>

<div id="form" style="display:none;background:white;padding:10px;border-radius:10px;margin-bottom:15px">

  <input id="nombre" placeholder="Nombre" oninput="buscarCliente()"><br><br>
  <input id="celular" placeholder="Celular" oninput="buscarCliente()"><br>
  <div id="sugerencias"></div>

  <br>

  <input id="producto" placeholder="Producto"><br><br>

  <input id="proveedor" placeholder="Proveedor"><br><br>

  <input id="costoProveedor" placeholder="Costo proveedor" oninput="calcularGanancia()"><br><br>

  <input id="precioCliente" placeholder="Precio cliente" oninput="calcularGanancia()"><br><br>

  <input id="ganancia" placeholder="Ganancia automática" readonly><br><br>

  <textarea id="descripcion" placeholder="Descripción"></textarea><br><br>

  <input type="file" id="foto"><br><br>

  <button onclick="guardar()">💾 Guardar</button>
  <button onclick="cancelar()">❌ Cancelar</button>

</div>

<div id="lista"></div>

<script>

let editando = null
let fotoBase64 = ''

// ================== GANANCIA AUTOMÁTICA ==================
function calcularGanancia() {
  const costo = parseFloat(document.getElementById('costoProveedor').value) || 0
  const precio = parseFloat(document.getElementById('precioCliente').value) || 0

  document.getElementById('ganancia').value = precio - costo
}

// ================== CARGAR ==================
async function cargar() {

  const resC = await fetch('/cotizaciones')
  let cotizaciones = await resC.json()

  const resT = await fetch('/tickets')
  let tickets = await resT.json()

  const filtro = document.getElementById('buscar').value.toLowerCase()

  cotizaciones = cotizaciones.filter(c =>
    (c.producto || '').toLowerCase().includes(filtro) ||
    (c.nombre || '').toLowerCase().includes(filtro) ||
    (c.celular || '').includes(filtro)
  )

  // ===== MESES =====
  let listaMeses = {}

  ;[...cotizaciones, ...tickets].forEach(x => {
    if (!x.fecha) return
    const f = new Date(x.fecha)
    const key = f.getFullYear() + '-' + (f.getMonth()+1)
    listaMeses[key] = f.toLocaleString('es-UY',{month:'long',year:'numeric'})
  })

  const select = document.getElementById('filtroMes')

  if (select.options.length <= 1) {
    Object.entries(listaMeses).reverse().forEach(([k,v])=>{
      const o=document.createElement('option')
      o.value=k
      o.textContent=v
      select.appendChild(o)
    })
  }

  const hoy = new Date()
  const mesActual = hoy.getFullYear() + '-' + (hoy.getMonth()+1)

  if (select.value === 'todos') select.value = mesActual

  const mesSel = select.value

  function filtrarMes(arr){
    if(mesSel==='todos') return arr
    return arr.filter(x=>{
      const f=new Date(x.fecha)
      const key=f.getFullYear()+'-'+(f.getMonth()+1)
      return key===mesSel
    })
  }

  cotizaciones = filtrarMes(cotizaciones)
  tickets = filtrarMes(tickets)

  // ===== GANANCIAS =====
  let ganCot = 0
  let ganTick = 0

  cotizaciones.forEach(c=>{
    ganCot += Number(c.ganancia) || 0
  })

  tickets.forEach(t=>{
    if(t.entregado==='si'){
      ganTick += Number(t.ganancia) || 0
    }
  })

  const total = ganCot + ganTick

  document.getElementById('resumen').innerHTML = `
  <div class="resumen">
    <b>💰 Resumen del negocio</b><br><br>
    📊 Cotizaciones: $${ganCot}<br>
    🧾 Tickets: $${ganTick}<br>
    <hr>
    <b>🧮 TOTAL: $${total}</b>
  </div>
  `

  // ===== LISTA =====
  const lista = document.getElementById('lista')
  lista.innerHTML=''

  cotizaciones.reverse().forEach(c=>{
    lista.innerHTML+=`
    <div class="card">
      <b>${c.producto}</b><br>
      👤 ${c.nombre||''} (${c.celular||''})<br>
      🏭 ${c.proveedor||''}<br>
      💸 ${c.costoProveedor||''}<br>
      💰 ${c.precioCliente||''}<br>
      🧾 Ganancia: ${c.ganancia||0}<br>
      📅 ${new Date(c.fecha).toLocaleString('es-UY')}<br>
      ${c.foto?`<img src="${c.foto}">`:''}

      <br><br>

      <button onclick="editar('${c._id}')">✏️</button>
      <button onclick="borrar('${c._id}')">❌</button>
    </div>
    `
  })
}

// ================== AUTOCOMPLETE ==================
async function buscarCliente(){
  const q = document.getElementById('nombre').value || document.getElementById('celular').value
  if(q.length<2) return

  const res = await fetch('/clientes?q='+q)
  const data = await res.json()

  const s = document.getElementById('sugerencias')
  s.innerHTML=''

  data.forEach(c=>{
    s.innerHTML+=`<div class="sug" onclick="sel('${c.nombre}','${c.celular}')">${c.nombre} - ${c.celular}</div>`
  })
}

function sel(n,c){
  document.getElementById('nombre').value=n
  document.getElementById('celular').value=c
  document.getElementById('sugerencias').innerHTML=''
}

// ================== FOTO ==================
document.getElementById('foto').onchange=e=>{
  const r=new FileReader()
  r.onload=()=>fotoBase64=r.result
  r.readAsDataURL(e.target.files[0])
}

// ================== GUARDAR ==================
async function guardar(){

  const data={
    nombre: nombre.value,
    celular: celular.value,
    producto: producto.value,
    proveedor: proveedor.value,
    costoProveedor: costoProveedor.value,
    precioCliente: precioCliente.value,
    descripcion: descripcion.value,
    foto: fotoBase64
  }

  if(editando){
    await fetch('/cotizacion/'+editando,{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(data)
    })
  }else{
    await fetch('/cotizacion',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(data)
    })
  }

  limpiar()
  cargar()
}

// ================== EDITAR ==================
async function editar(id){
  const res=await fetch('/cotizaciones')
  const data=await res.json()
  const c=data.find(x=>x._id===id)

  nombre.value=c.nombre||''
  celular.value=c.celular||''
  producto.value=c.producto||''
  proveedor.value=c.proveedor||''
  costoProveedor.value=c.costoProveedor||''
  precioCliente.value=c.precioCliente||''
  descripcion.value=c.descripcion||''

  fotoBase64=c.foto||''
  editando=id

  calcularGanancia()
  mostrarForm()
}

// ================== BORRAR ==================
async function borrar(id){
  if(!confirm("¿Eliminar cotización?")) return
  await fetch('/cotizacion/'+id,{method:'DELETE'})
  limpiar()
  cargar()
}

// ================== UI ==================
function mostrarForm(){ form.style.display='block' }
function cancelar(){ limpiar() }

function limpiar(){
  editando=null
  fotoBase64=''
  document.getElementById('form').reset()
  document.getElementById('form').style.display='none'
}

cargar()

</script>

</body>
</html>
