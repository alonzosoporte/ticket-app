<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cotizaciones</title>

<style>
body {
  font-family: Arial;
  background: #eef2f7;
  padding: 20px;
}

.top {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.card {
  background: white;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

input, textarea, button {
  padding:6px;
  border-radius:6px;
  border:1px solid #ccc;
}

button { cursor:pointer; }

img {
  max-width:120px;
  margin-top:5px;
  border-radius:6px;
}

#sugerencias {
  background:white;
  border:1px solid #ccc;
  max-width:300px;
  position:absolute;
  z-index:10;
}

.sug {
  padding:5px;
  cursor:pointer;
}

.sug:hover {
  background:#eee;
}

.historial {
  background:#fff;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<h2>📊 Cotizaciones</h2>

<div class="top">
  <input id="buscar" placeholder="Buscar producto / cliente..." oninput="cargar()">
  <button onclick="mostrarForm()">➕ Nueva</button>
</div>

<div id="form" style="display:none;position:relative;background:white;padding:10px;border-radius:10px;margin-bottom:15px">

  <input id="nombre" placeholder="Nombre" oninput="buscarCliente()"><br><br>
  <input id="celular" placeholder="Celular" oninput="buscarCliente()"><br>

  <div id="sugerencias"></div>

  <br>
  <input id="producto" placeholder="Producto"><br><br>
  <input id="precio" placeholder="Precio"><br><br>
  <textarea id="descripcion" placeholder="Descripción"></textarea><br><br>
  <input type="file" id="foto"><br><br>

  <button onclick="guardar()">💾 Guardar</button>
  <button onclick="cancelar()">❌ Cancelar</button>

</div>

<div id="historial"></div>
<div id="lista"></div>

<script>

let editando = null
let fotoBase64 = ''

// 📥 cargar
async function cargar() {
  const res = await fetch('/cotizaciones')
  let data = await res.json()

  const filtro = document.getElementById('buscar').value.toLowerCase()

  data = data.filter(c =>
    (c.producto || '').toLowerCase().includes(filtro) ||
    (c.nombre || '').toLowerCase().includes(filtro) ||
    (c.celular || '').includes(filtro)
  )

  const lista = document.getElementById('lista')
  lista.innerHTML = ''

  data.reverse().forEach(c => {
    lista.innerHTML += `
      <div class="card">
        <b>${c.producto}</b><br>
        👤 ${c.nombre || ''} (${c.celular || ''})<br>
        💲 ${c.precio}<br>
        ${c.descripcion || ''}<br>
        ${c.foto ? `<img src="${c.foto}">` : ''}

        <br><br>

        <button onclick="editar('${c._id}')">✏️</button>
        <button onclick="borrar('${c._id}')">❌</button>
      </div>
    `
  })
}

// 🔎 AUTOCOMPLETE
async function buscarCliente() {
  const nombre = document.getElementById('nombre').value
  const celular = document.getElementById('celular').value

  const q = nombre || celular
  if (q.length < 2) return

  const res = await fetch('/clientes?q=' + q)
  const data = await res.json()

  const sug = document.getElementById('sugerencias')
  sug.innerHTML = ''

  data.forEach(c => {
    sug.innerHTML += `
      <div class="sug" onclick="seleccionar('${c.nombre}','${c.celular}')">
        ${c.nombre} - ${c.celular}
      </div>
    `
  })
}

// ✅ seleccionar cliente
function seleccionar(nombre, celular) {
  document.getElementById('nombre').value = nombre
  document.getElementById('celular').value = celular
  document.getElementById('sugerencias').innerHTML = ''

  mostrarHistorial(celular)
}

// 📜 historial
async function mostrarHistorial(cel) {
  const res = await fetch('/cotizaciones')
  const data = await res.json()

  const hist = data.filter(c => c.celular === cel)

  const div = document.getElementById('historial')
  div.innerHTML = '<div class="historial"><b>Historial cliente:</b><br>'

  hist.forEach(h => {
    div.innerHTML += `• ${h.producto} - $${h.precio}<br>`
  })

  div.innerHTML += '</div>'
}

// 📸 imagen
document.getElementById('foto').onchange = e => {
  const file = e.target.files[0]
  const reader = new FileReader()

  reader.onload = () => fotoBase64 = reader.result
  reader.readAsDataURL(file)
}

// 💾 guardar
async function guardar() {

  const nombre = document.getElementById('nombre').value
  const celular = document.getElementById('celular').value
  const producto = document.getElementById('producto').value
  const precio = document.getElementById('precio').value
  const descripcion = document.getElementById('descripcion').value

  if (!producto) return alert("Falta producto")

  const data = { nombre, celular, producto, precio, descripcion, foto: fotoBase64 }

  if (editando) {
    await fetch('/cotizacion/' + editando, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(data)
    })
  } else {
    await fetch('/cotizacion', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(data)
    })
  }

  limpiarForm()
  cargar()
}

// ✏️ editar
async function editar(id) {
  const res = await fetch('/cotizaciones')
  const data = await res.json()

  const c = data.find(x => x._id === id)

  document.getElementById('nombre').value = c.nombre || ''
  document.getElementById('celular').value = c.celular || ''
  document.getElementById('producto').value = c.producto
  document.getElementById('precio').value = c.precio
  document.getElementById('descripcion').value = c.descripcion || ''

  fotoBase64 = c.foto || ''
  editando = id

  mostrarForm()
}

// ❌ borrar
async function borrar(id) {
  if (!confirm("¿Eliminar cotización?")) return
  await fetch('/cotizacion/' + id, { method:'DELETE' })
  limpiarForm()
  cargar()
}

// 🧼 limpiar
function limpiarForm() {
  editando = null
  fotoBase64 = ''

  document.getElementById('nombre').value = ''
  document.getElementById('celular').value = ''
  document.getElementById('producto').value = ''
  document.getElementById('precio').value = ''
  document.getElementById('descripcion').value = ''

  document.getElementById('form').style.display = 'none'
  document.getElementById('historial').innerHTML = ''
}

// mostrar form
function mostrarForm() {
  document.getElementById('form').style.display = 'block'
}

// cancelar
function cancelar() {
  limpiarForm()
}

cargar()

</script>

</body>
</html>
