<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cotizaciones</title>

<style>
body {
  font-family: Arial;
  background: #eef2f7;
  padding: 20px;
}

.top {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.card {
  background: white;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

img {
  max-width: 120px;
  margin-top:8px;
  border-radius:6px;
}

input, textarea, button {
  padding:6px;
  border-radius:6px;
  border:1px solid #ccc;
}

button {
  cursor:pointer;
}
</style>
</head>

<body>

<h2>📊 Cotizaciones</h2>

<div class="top">
  <input id="buscar" placeholder="Buscar producto..." oninput="cargar()">
  <button onclick="mostrarForm()">➕ Nueva</button>
</div>

<!-- FORM -->
<div id="form" style="display:none;background:white;padding:10px;border-radius:10px;margin-bottom:15px">

  <input id="producto" placeholder="Producto"><br><br>
  <input id="precio" placeholder="Precio"><br><br>
  <textarea id="descripcion" placeholder="Descripción"></textarea><br><br>
  <input type="file" id="foto"><br><br>

  <button onclick="guardar()">💾 Guardar</button>
  <button onclick="cancelar()">❌ Cancelar</button>

</div>

<div id="lista"></div>

<script>

let editando = null
let fotoBase64 = ''

// 📥 cargar
async function cargar() {
  const res = await fetch('/cotizaciones')
  let data = await res.json()

  const filtro = document.getElementById('buscar').value.toLowerCase()

  data = data.filter(c =>
    c.producto.toLowerCase().includes(filtro)
  )

  const lista = document.getElementById('lista')
  lista.innerHTML = ''

  data.reverse().forEach(c => {
    lista.innerHTML += `
      <div class="card">
        <b>${c.producto}</b><br>
        💲 ${c.precio}<br>
        ${c.descripcion || ''}<br>
        ${c.foto ? `<img src="${c.foto}">` : ''}

        <br><br>

        <button onclick="editar('${c._id}')">✏️</button>
        <button onclick="borrar('${c._id}')">❌</button>
      </div>
    `
  })
}

// ➕ mostrar form
function mostrarForm() {
  document.getElementById('form').style.display = 'block'
}

// ❌ cancelar
function cancelar() {
  editando = null
  fotoBase64 = ''
  document.getElementById('form').style.display = 'none'
}

// 📸 convertir imagen
document.getElementById('foto').onchange = e => {
  const file = e.target.files[0]
  const reader = new FileReader()

  reader.onload = () => {
    fotoBase64 = reader.result
  }

  reader.readAsDataURL(file)
}

// 💾 guardar
async function guardar() {

  const producto = document.getElementById('producto').value
  const precio = document.getElementById('precio').value
  const descripcion = document.getElementById('descripcion').value

  if (!producto) return alert("Falta producto")

  if (editando) {
    await fetch('/cotizacion/' + editando, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ producto, precio, descripcion, foto: fotoBase64 })
    })
  } else {
    await fetch('/cotizacion', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ producto, precio, descripcion, foto: fotoBase64 })
    })
  }

  cancelar()
  cargar()
}

// ✏️ editar
async function editar(id) {
  const res = await fetch('/cotizaciones')
  const data = await res.json()

  const c = data.find(x => x._id === id)

  document.getElementById('producto').value = c.producto
  document.getElementById('precio').value = c.precio
  document.getElementById('descripcion').value = c.descripcion || ''
  fotoBase64 = c.foto || ''

  editando = id
  mostrarForm()
}

// ❌ borrar
async function borrar(id) {
  if (!confirm("¿Eliminar cotización?")) return
  await fetch('/cotizacion/' + id, { method:'DELETE' })
  cargar()
}

cargar()

</script>

</body>
</html>
