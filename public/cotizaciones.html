<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cotizaciones PRO</title>

<style>
body {
  font-family: Arial;
  background:#eef2f7;
  padding:20px;
}

/* 🔥 TOPBAR */
.topbar {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:15px;
  align-items:center;
}

/* 🔍 BUSCADOR */
input, select {
  padding:8px 10px;
  border-radius:10px;
  border:1px solid #ccc;
  outline:none;
}

input {
  width:100%;
  max-width:240px;
}

/* 🔥 BOTONES */
button {
  padding:8px 12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  transition:0.2s;
}

.btn { background:#007bff; color:white; }
.btn:hover { background:#0056b3; }

.btn-success { background:#28a745; color:white; }
.btn-success:hover { background:#1e7e34; }

.btn-danger { background:#dc3545; color:white; }
.btn-danger:hover { background:#b02a37; }

.btn-secondary { background:#6c757d; color:white; }
.btn-secondary:hover { background:#545b62; }

/* 🧾 CARDS */
.card {
  background:white;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
  transition:0.2s;
}

.card:hover {
  transform:scale(1.01);
}

/* 🖼️ THUMB */
.thumb {
  width:60px;
  height:60px;
  object-fit:cover;
  border-radius:6px;
  margin:3px;
  cursor:pointer;
  border:2px solid #ddd;
}

.thumb:hover {
  border-color:#007bff;
}

/* 🛡️ */
.vencida {
  color:red;
  font-weight:bold;
}
</style>
</head>

<body>

<h2>📊 Cotizaciones</h2>

<div class="topbar">

  <button class="btn-secondary" onclick="location.href='admin.html'">⬅ Volver</button>

  <input id="buscar" placeholder="🔍 Buscar nombre, celular o ticket..." oninput="cargar()">

  <button class="btn" onclick="mostrarForm()">➕ Nueva</button>

</div>

<div id="form" style="display:none;background:white;padding:15px;border-radius:12px;margin-bottom:15px">

<input id="nombre" placeholder="Nombre">
<input id="celular" placeholder="Celular">

<hr>

<input id="producto" placeholder="Producto">

<select id="proveedor"></select>
<input id="nuevoProveedor" placeholder="Nuevo proveedor">
<button class="btn" onclick="agregarProveedor()">➕</button>

<br>

<input id="costoProveedor" placeholder="Costo proveedor">
<input id="precioCliente" placeholder="Precio cliente">
<input id="ganancia" placeholder="Ganancia" readonly>

<br>

<textarea id="descripcion" placeholder="Descripción"></textarea>

<br>

📸 <input type="file" id="foto">
<br>
🛡️ <input type="date" id="garantiaFecha">
📸 <input type="file" id="garantiaFoto">

<br><br>

<button class="btn-success" onclick="guardar()">💾 Guardar</button>
<button class="btn-danger" onclick="cancelar()">❌ Cancelar</button>

</div>

<div id="lista"></div>

<!-- MODAL -->
<div id="modalImg" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);justify-content:center;align-items:center">
  <img id="imgGrande" style="max-width:90%;max-height:90%">
</div>

<script>

let editando = null
let fotoBase64 = ''
let garantiaBase64 = ''

function calcularGanancia() {
  const costo = parseFloat(costoProveedor.value) || 0
  const precio = parseFloat(precioCliente.value) || 0
  ganancia.value = precio - costo
}

costoProveedor.oninput = calcularGanancia
precioCliente.oninput = calcularGanancia

foto.onchange = e => {
  const r = new FileReader()
  r.onload = () => fotoBase64 = r.result
  r.readAsDataURL(e.target.files[0])
}

garantiaFoto.onchange = e => {
  const r = new FileReader()
  r.onload = () => garantiaBase64 = r.result
  r.readAsDataURL(e.target.files[0])
}

async function cargarProveedores() {
  const res = await fetch('/proveedores')
  const data = await res.json()
  proveedor.innerHTML = ''
  data.forEach(p => proveedor.innerHTML += `<option value="${p._id}">${p.nombre}</option>)`
}

async function guardar() {

  const data = {
    nombre: nombre.value,
    celular: celular.value,
    producto: producto.value,
    proveedor: proveedor.value,
    costoProveedor: costoProveedor.value,
    precioCliente: precioCliente.value,
    descripcion: descripcion.value,
    foto: fotoBase64 || '',
    garantiaFecha: garantiaFecha.value,
    garantiaFoto: garantiaBase64 || ''
  }

  if (editando) {
    await fetch('/cotizacion/' + editando,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
  } else {
    await fetch('/cotizacion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)})
  }

  limpiar()
  cargar()
}

async function cargar() {

  const res = await fetch('/cotizaciones')
  let data = await res.json()

  const filtro = (buscar.value || '').toLowerCase()

  data = data.filter(c =>
    (c.nombre || '').toLowerCase().includes(filtro) ||
    (c.celular || '').includes(filtro) ||
    (c.numero || '').toLowerCase().includes(filtro)
  )

  lista.innerHTML = ''

  data.reverse().forEach(c => {

    const costo = parseFloat(c.costoProveedor) || 0
    const precio = parseFloat(c.precioCliente) || 0
    const gan = c.ganancia || (precio - costo)

    const g = new Date(c.garantiaFecha)
    const vencida = c.garantiaFecha && g < new Date()

    lista.innerHTML += `
      <div class="card">

        📅 ${c.fecha ? new Date(c.fecha).toLocaleString() : ''}<br>
        🧾 ${c.numero || 'Sin número'}<br><br>

        <b>${c.producto}</b><br>
        ${c.nombre} (${c.celular})<br>

        💸 $${costo} | 💰 $${precio}<br>
        🧾 <b>$${gan}</b><br>

        ${c.garantiaFecha ? `
        🛡️ <span class="${vencida ? 'vencida':''}">
        ${g.toLocaleDateString()} ${vencida ? '(VENCIDA)':''}
        </span><br>` : ''}

        <br>

        ${c.foto ? `<img class="thumb" src="${c.foto}" onclick="verImg('${c.foto}')">` : ''}
        ${c.garantiaFoto ? `<img class="thumb" src="${c.garantiaFoto}" onclick="verImg('${c.garantiaFoto}')">` : ''}

        <br><br>

        ${
          ${c.confirmada === 'si'
  ? `
    <button class="btn-danger" onclick="borrar('${c._id}')">❌</button>
  `
  : `
    <button class="btn" onclick="editar('${c._id}')">✏️</button>
    <button class="btn-danger" onclick="borrar('${c._id}')">❌</button>
    <button class="btn-success" onclick="confirmar('${c._id}')">✔ Confirmar</button>
  `
}
          `
        }

      </div>
    `
  })
}

function verImg(src){
  modalImg.style.display='flex'
  imgGrande.src=src
}

modalImg.onclick=()=>modalImg.style.display='none'

async function editar(id){

  const res = await fetch('/cotizaciones')
  const data = await res.json()

  const c = data.find(x => x._id === id)

  if (!c) return alert('Error al cargar')

  editando = c._id

  nombre.value = c.nombre || ''
  celular.value = c.celular || ''
  producto.value = c.producto || ''
  costoProveedor.value = c.costoProveedor || ''
  precioCliente.value = c.precioCliente || ''
  descripcion.value = c.descripcion || ''
  garantiaFecha.value = c.garantiaFecha || ''

  fotoBase64 = c.foto || ''
  garantiaBase64 = c.garantiaFoto || ''

  calcularGanancia()
  form.style.display = 'block'
}

async function borrar(id){
  if(!confirm('Eliminar?'))return
  await fetch('/cotizacion/'+id,{method:'DELETE'})
  cargar()
}

async function confirmar(id){
  const res=await fetch('/cotizaciones')
  const data=await res.json()
  const c=data.find(x=>x._id===id)

  await fetch('/cotizacion/'+id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({
      confirmada:'si',
      costoProveedor:c.costoProveedor,
      precioCliente:c.precioCliente
    })
  })

  cargar()
}

function mostrarForm(){
  limpiar()
  form.style.display='block'
}

function cancelar(){
  limpiar()
}

function limpiar(){
  editando=null
  fotoBase64=''
  garantiaBase64=''
  nombre.value=''
  celular.value=''
  producto.value=''
  costoProveedor.value=''
  precioCliente.value=''
  descripcion.value=''
  ganancia.value=''
  garantiaFecha.value=''
  document.getElementById('foto').value=''
  document.getElementById('garantiaFoto').value=''
  form.style.display='none'
}

cargar()
cargarProveedores()

</script>

</body>
</html>
