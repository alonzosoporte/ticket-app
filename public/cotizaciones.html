<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cotizaciones PRO</title>

<script src="https://ticket-pro-xmhs.onrender.com/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body{
  font-family:Arial;
  background:#eef2f7;
  padding:20px;
}

.topbar{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:15px;
  align-items:center;
}

input,select,textarea{
  padding:8px 10px;
  border-radius:10px;
  border:1px solid #ccc;
}

button{
  padding:8px 12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.btn{
  background:#003366;
  color:white;
}

.btn-success{
  background:#28a745;
  color:white;
}

.btn-danger{
  background:#dc3545;
  color:white;
}

.btn-secondary{
  background:#6c757d;
  color:white;
}

.card{
  background:white;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.thumb{
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:8px;
  margin:4px;
  cursor:pointer;
  transition:0.2s;
}

.thumb:hover{
  transform:scale(1.08);
}

.modal{
  display:none;
  position:fixed;
  z-index:999;
  left:0;
  top:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.85);
  justify-content:center;
  align-items:center;
}

.modal img{
  max-width:90%;
  max-height:90%;
  border-radius:10px;
}
</style>
</head>

<body>

<h2>📊 Cotizaciones</h2>

<div class="topbar">

  <button class="btn-secondary"
  onclick="location.href='admin.html'">
  ⬅️ Volver
  </button>

  <input id="buscar"
  placeholder="🔍 Buscar..."
  oninput="cargar()">

  <select id="filtroEstado" onchange="cargar()">

    <option value="pendientes">
      ⏳ Pendientes
    </option>

    <option value="confirmadas">
      ✔️ Confirmadas
    </option>

    <option value="todas">
      📋 Todas
    </option>

  </select>

  <button class="btn"
  onclick="mostrarForm()">
  ➕ Nueva
  </button>

</div>

<!-- FORM -->
<div id="form"
style="display:none;background:white;padding:15px;border-radius:12px;margin-bottom:15px">

<input id="nombre" placeholder="Nombre">

<input
id="celular"
type="number"
inputmode="numeric"
placeholder="Celular">

<hr>

<input id="producto" placeholder="Producto">

<br><br>

<select id="proveedor"></select>

<button class="btn-danger"
onclick="eliminarProveedor()">
❌
</button>

<input id="nuevoProveedor"
placeholder="Nuevo proveedor">

<button class="btn"
onclick="agregarProveedor()">
➕
</button>

<br><br>

<input
id="costoProveedor"
type="number"
inputmode="decimal"
placeholder="Costo">

<input
id="precioCliente"
type="number"
inputmode="decimal"
placeholder="Precio cliente">

<input
id="ganancia"
type="number"
readonly
placeholder="Ganancia">

<br><br>

<textarea id="descripcion"
placeholder="Descripción"></textarea>

<br><br>

<b>📸 Fotos producto</b><br><br>

<input type="file"
id="fotos"
multiple>

<br><br>

<button class="btn-success"
onclick="guardar()">
💾 Guardar
</button>

<button class="btn-danger"
onclick="cancelar()">
❌ Cancelar
</button>

</div>

<!-- LISTA -->
<div id="lista"></div>

<!-- MODAL -->
<div id="modal"
class="modal"
onclick="cerrarModal()">

  <img id="imgGrande">

</div>

<script>

const API =
'https://ticket-pro-xmhs.onrender.com'

const TOKEN =
localStorage.getItem('token')

// LOGIN
if(!TOKEN){
  location.href='login.html'
}

// SOCKET
const socket = io(API)

socket.on('actualizar',()=>{

  cargar()
})

// ===== PDF =====
// ===== PDF =====
async function generarPDF(c){

  const { jsPDF } = window.jspdf

  const doc = new jsPDF('p','mm','a4')

  // FONDO
  doc.setFillColor(245,247,250)
  doc.rect(0,0,210,297,'F')

  // HEADER
  doc.setFillColor(0,51,102)
  doc.rect(0,0,210,18,'F')

  doc.setTextColor(255,255,255)

  doc.setFontSize(17)

  doc.setFont('helvetica','bold')

  doc.text(
    'COTIZACIÓN',
    105,
    11,
    { align:'center' }
  )

  // ===== LOGO =====
  const logo = new Image()

  logo.src = 'logo.png'

  logo.onload = () => {

    // LOGO
    doc.addImage(
      logo,
      'PNG',
      55,
      22,
      100,
      45
    )

    // TITULO
    doc.setTextColor(15,25,45)

    doc.setFontSize(26)

    doc.setFont(
      'helvetica',
      'bold'
    )


    // LINEA
    doc.setDrawColor(118,136,161)

    doc.line(15,98,195,98)

    // CAJA
    doc.setFillColor(255,255,255)

    doc.roundedRect(
      20,
      108,
      170,
      82,
      5,
      5,
      'F'
    )

    doc.setDrawColor(220,220,220)

    doc.roundedRect(
      20,
      108,
      170,
      82,
      5,
      5
    )

    // LINEAS INTERNAS
    doc.setDrawColor(230,230,230)

    doc.line(30,128,180,128)
    doc.line(30,146,180,146)
    doc.line(30,164,180,164)

    // LABELS
    doc.setTextColor(40,40,40)

    doc.setFontSize(11)

    doc.setFont('helvetica','bold')

    doc.text('CLIENTE',38,121)
    doc.text('PRODUCTO',38,139)
    doc.text('PRECIO',38,157)
    doc.text('DESCRIPCIÓN',38,175)

    // DATOS
    doc.setTextColor(15,25,45)

    doc.setFont('helvetica','normal')

    doc.setFontSize(15)

    doc.text(
      String(c.nombre || ''),
      92,
      121
    )

    doc.text(
      String(c.producto || ''),
      92,
      139
    )

    doc.text(
      `$${c.precioCliente || 0}`,
      92,
      157
    )

    // DESCRIPCION
    doc.setFontSize(11)

    const descripcion =
    doc.splitTextToSize(
      c.descripcion || '',
      80
    )

    doc.text(
      descripcion,
      92,
      175
    )

    // TEXTO VALIDEZ
    doc.setTextColor(220,53,69)

    doc.setFontSize(11)

    doc.setFont(
      'helvetica',
      'bold'
    )

    doc.text(
      'Las cotizaciones son válidas por un período de 30 días.',
      20,
      205
    )

    // TRANSFERENCIA
    doc.setFillColor(40,167,69)

    doc.roundedRect(
      20,
      218,
      170,
      28,
      4,
      4,
      'F'
    )

    doc.setTextColor(255,255,255)

    doc.setFontSize(13)

    doc.text(
      'Transferencia bancaria BROU:',
      30,
      231
    )

    doc.text(
      'CA 001120656-00002',
      30,
      240
    )

    // FOOTER
    doc.setFillColor(0,51,102)

    doc.rect(0,285,210,12,'F')

    doc.setTextColor(255,255,255)

    doc.setFontSize(13)

    doc.text(
      'Gracias por confiar en nuestro servicio.',
      105,
      293,
      { align:'center' }
    )

    // DESCARGAR
    doc.save(
      `Cotizacion-${c.nombre || 'cliente'}.pdf`
    )
  }
}

// FETCH AUTH
function fetchAuth(url,options={}){

  return fetch(API+url,{

    ...options,

    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer '+TOKEN,
      ...(options.headers || {})
    }
  })
}

// MODAL
function abrirModal(src){

  document.getElementById('modal')
  .style.display='flex'

  document.getElementById('imgGrande')
  .src=src
}

function cerrarModal(){

  document.getElementById('modal')
  .style.display='none'
}

// LEER FOTOS
function leerFotos(input){

  return new Promise(resolve=>{

    const files=[...input.files]

    if(!files.length){
      resolve([])
      return
    }

    let fotos=[]
    let cargadas=0

    files.forEach(file=>{

      const r=new FileReader()

      r.onload=()=>{

        fotos.push(r.result)

        cargadas++

        if(cargadas===files.length){
          resolve(fotos)
        }
      }

      r.readAsDataURL(file)
    })
  })
}

// PROVEEDORES
async function cargarProveedores(){

  const res =
  await fetchAuth('/proveedores')

  const data = await res.json()

  proveedor.innerHTML=
  `<option value="">-- Seleccionar proveedor --</option>`

  data.forEach(p=>{

    proveedor.innerHTML += `
    <option value="${p.nombre}">
    ${p.nombre}
    </option>`
  })
}

async function agregarProveedor(){

  const nombre =
  nuevoProveedor.value.trim()

  if(!nombre){
    return alert('Escribí proveedor')
  }

  await fetchAuth('/proveedores',{

    method:'POST',

    body:JSON.stringify({ nombre })
  })

  nuevoProveedor.value=''

  await cargarProveedores()

  proveedor.value=nombre
}

async function eliminarProveedor(){

  const nombre = proveedor.value

  if(!nombre){
    return alert('Seleccioná proveedor')
  }

  if(!confirm('Eliminar proveedor?')) return

  await fetchAuth(
  '/proveedores/'+encodeURIComponent(nombre),{

    method:'DELETE'
  })

  cargarProveedores()
}

// GANANCIA
function calcularGanancia(){

  const c =
  parseFloat(costoProveedor.value)||0

  const p =
  parseFloat(precioCliente.value)||0

  ganancia.value = p - c
}

costoProveedor.oninput =
calcularGanancia

precioCliente.oninput =
calcularGanancia

// GUARDAR
async function guardar(){

  const fotos =
  await leerFotos(
    document.getElementById('fotos')
  )

  const data = {

    nombre:nombre.value,
    celular:celular.value,
    producto:producto.value,
    proveedor:proveedor.value,
    costoProveedor:costoProveedor.value,
    precioCliente:precioCliente.value,
    descripcion:descripcion.value
  }

  if(fotos.length){
    data.fotos = fotos
  }

  if(window.editandoId){

    await fetchAuth(
    '/cotizacion/'+window.editandoId,{

      method:'PUT',

      body:JSON.stringify(data)
    })

    window.editandoId = null
  }

  else{

    await fetchAuth('/cotizacion',{

      method:'POST',

      body:JSON.stringify(data)
    })
  }

  cancelar()

  cargar()
}

// CONFIRMAR
async function confirmar(id){

  await fetchAuth('/cotizacion/'+id,{

  method:'PUT',

  body:JSON.stringify({
    confirmada:'si'
  })
})

// REDIRECCIONAR A GARANTIAS
window.location.href = 'garantias.html'
}

// EDITAR
async function editar(id){

  const res =
  await fetchAuth('/cotizaciones')

  const data = await res.json()

  const c =
  data.find(x => x._id === id)

  if(!c) return

  mostrarForm()

  nombre.value = c.nombre || ''
  celular.value = c.celular || ''
  producto.value = c.producto || ''
  proveedor.value = c.proveedor || ''
  costoProveedor.value = c.costoProveedor || ''
  precioCliente.value = c.precioCliente || ''
  descripcion.value = c.descripcion || ''

  calcularGanancia()

  window.editandoId = id
}

// BORRAR
async function borrar(id,nombre,producto){

  const confirmar = confirm(

`¿Eliminar cotización?

Cliente: ${nombre}

Producto: ${producto}`
  )

  if(!confirmar){
    return
  }

  await fetchAuth('/cotizacion/'+id,{

  method:'PUT',

  body:JSON.stringify({
    confirmada:'si'
  })
})

// ESPERAR UN POCO
setTimeout(()=>{

  window.location.href='garantias.html'

},500)

// CARGAR
async function cargar(){

  const res =
  await fetchAuth('/cotizaciones')

  const data = await res.json()

  lista.innerHTML=''

  const filtro =
  buscar.value.toLowerCase()

  const estado =
  document.getElementById('filtroEstado').value

  let filtradas = data

  if(estado === 'pendientes'){

    filtradas = data.filter(c=>
      c.confirmada !== 'si'
    )
  }

  if(estado === 'confirmadas'){

    filtradas = data.filter(c=>
      c.confirmada === 'si'
    )
  }

  filtradas
  .filter(c=>

    (c.nombre||'')
    .toLowerCase()
    .includes(filtro)

    ||

    (c.producto||'')
    .toLowerCase()
    .includes(filtro)
  )

  .reverse()

  .forEach(c=>{

    const confirmado =
    c.confirmada === 'si'

    const precio =
    parseFloat(c.precioCliente)||0

    const gan =
    parseFloat(c.ganancia)||0

    lista.innerHTML += `

    <div class="card">

      📅 ${
        c.fecha
        ? new Date(c.fecha)
        .toLocaleString('es-UY')
        : ''
      }

      <br><br>

      <b>${c.producto || ''}</b><br>

      🏢 ${
        c.proveedor ||
        'Sin proveedor'
      }

      <br>

      👤 ${c.nombre || ''}

      (${c.celular || ''})

      <br><br>

      💰 <b>
      Precio cliente $${precio}
      </b>

      <br>

      🧾 <b>
      Ganancia $${gan}
      </b>

      <br><br>

      📝 ${
        c.descripcion || ''
      }

      <br><br>

      ${
        (c.fotos||[]).length

        ?

        `
        <b>📸 Fotos:</b><br><br>

        ${(c.fotos||[]).map(f=>`

          <img
          src="${f}"
          class="thumb"
          onclick="abrirModal('${f}')">

        `).join('')}
        `

        :

        ''
      }

      <br><br>

      ${
        confirmado

        ?

        `<span style="color:green;font-weight:bold">
          ✔️ Confirmada
         </span>`

        :

        `<span style="color:orange;font-weight:bold">
          ⏳ Pendiente
         </span>`
      }

      <br><br>

      <button class="btn-secondary"
onclick="editar('${c._id}')">
✏️ Editar
</button>

<button
class="btn-danger"
style="
display:inline-flex;
align-items:center;
gap:6px;
padding:10px 14px;
font-size:14px;
"
onclick="borrar(
'${c._id}',
'${c.nombre}',
'${c.producto}'
)">
❌ Eliminar
</button>

${
  !confirmado

  ?

  `<button class="btn-success"
  onclick="confirmar('${c._id}')">
  ✔️ Confirmar
  </button>`

  :

  ''
}

<button
class="btn"
onclick='generarPDF(${JSON.stringify(c)})'>

📄 PDF
</button>

    </div>
    `
  })
}

// UI
function mostrarForm(){

  form.style.display='block'
}

function cancelar(){

  form.style.display='none'

  window.editandoId = null

  nombre.value=''
  celular.value=''
  producto.value=''
  proveedor.value=''
  costoProveedor.value=''
  precioCliente.value=''
  ganancia.value=''
  descripcion.value=''
  fotos.value=''
}

// INIT
cargar()
cargarProveedores()

</script>

</body>
</html>
