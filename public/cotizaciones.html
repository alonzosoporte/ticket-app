<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cotizaciones PRO</title>

<style>
body { font-family: Arial; background:#eef2f7; padding:20px; }

.card {
  background:white;
  padding:12px;
  margin:10px 0;
  border-radius:10px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
  cursor:pointer;
}

input, select, button, textarea {
  padding:6px;
  margin:4px;
  border-radius:6px;
  border:1px solid #ccc;
}

button { cursor:pointer }
img { max-width:120px; border-radius:6px }
</style>
</head>

<body>

<h2>📊 Cotizaciones</h2>

<button onclick="irAdmin()">⬅ Volver a Admin</button>

<br><br>

<input id="buscar" placeholder="Buscar..." oninput="cargar()">
<button onclick="mostrarForm()">➕ Nueva</button>

<div id="form" style="display:none;background:white;padding:10px;border-radius:10px;margin-top:10px">

<input id="nombre" placeholder="Nombre">
<input id="celular" placeholder="Celular">

<hr>

<input id="producto" placeholder="Producto">

<select id="proveedor"></select>
<input id="nuevoProveedor" placeholder="Nuevo proveedor">
<button onclick="agregarProveedor()">➕</button>

<br>

<input id="costoProveedor" placeholder="Costo proveedor">
<input id="precioCliente" placeholder="Precio cliente">
<input id="ganancia" placeholder="Ganancia" readonly>

<br>

<textarea id="descripcion" placeholder="Descripción"></textarea>

<br>

<input type="file" id="foto">

<hr>

<label>📅 Garantía hasta:</label><br>
<input type="date" id="garantiaFecha">

<br>

<label>📷 Foto garantía:</label><br>
<input type="file" id="garantiaFoto">

<br><br>

<button onclick="guardar()">💾 Guardar</button>
<button onclick="cancelar()">❌ Cancelar</button>

</div>

<div id="lista"></div>

<script>

let editando = null
let fotoBase64 = ''
let garantiaBase64 = ''

// NAV
function irAdmin() {
  window.location.href = '/admin.html'
}

// GANANCIA
function calcularGanancia() {
  const costo = parseFloat(costoProveedor.value) || 0
  const precio = parseFloat(precioCliente.value) || 0
  ganancia.value = precio - costo
}

costoProveedor.oninput = calcularGanancia
precioCliente.oninput = calcularGanancia

// FOTO PRODUCTO
foto.onchange = e => {
  const r = new FileReader()
  r.onload = () => fotoBase64 = r.result
  r.readAsDataURL(e.target.files[0])
}

// FOTO GARANTÍA
garantiaFoto.onchange = e => {
  const r = new FileReader()
  r.onload = () => garantiaBase64 = r.result
  r.readAsDataURL(e.target.files[0])
}

// PROVEEDORES
async function cargarProveedores() {
  const res = await fetch('/proveedores')
  const data = await res.json()

  proveedor.innerHTML = ''
  data.forEach(p => {
    proveedor.innerHTML += `<option value="${p._id}">${p.nombre}</option>`
  })
}

async function agregarProveedor() {
  if (!nuevoProveedor.value) return alert('Escribí proveedor')

  await fetch('/proveedores', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ nombre: nuevoProveedor.value })
  })

  nuevoProveedor.value = ''
  cargarProveedores()
}

// GUARDAR
async function guardar() {

  if (!producto.value) return alert('Falta producto')

  const data = {
    nombre: nombre.value,
    celular: celular.value,
    producto: producto.value,
    proveedor: proveedor.value,
    costoProveedor: costoProveedor.value,
    precioCliente: precioCliente.value,
    descripcion: descripcion.value,
    foto: fotoBase64,
    garantiaFecha: garantiaFecha.value,
    garantiaFoto: garantiaBase64
  }

  if (editando) {
    await fetch('/cotizacion/' + editando, {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(data)
    })
  } else {
    await fetch('/cotizacion', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(data)
    })
  }

  limpiar()
  setTimeout(cargar, 100)
}

// CARGAR
async function cargar() {

  const res = await fetch('/cotizaciones')
  let data = await res.json()

  const filtro = buscar.value.toLowerCase()

  data = data.filter(c =>
    (c.producto || '').toLowerCase().includes(filtro) ||
    (c.nombre || '').toLowerCase().includes(filtro) ||
    (c.celular || '').includes(filtro)
  )

  lista.innerHTML = ''

  data.reverse().forEach(c => {

    const costo = parseFloat(c.costoProveedor) || 0
    const precio = parseFloat(c.precioCliente) || 0
    const gan = precio - costo
    const color = gan >= 0 ? '#0a8f3c' : '#d00000'

    lista.innerHTML += `
      <div class="card" onclick='verDetalle(${JSON.stringify(c)})'>

        <b>${c.producto}</b><br>
        ${c.nombre || ''} (${c.celular || ''})<br>

        💸 Costo proveedor: $${costo}<br>
        💰 Precio cliente: $${precio}<br>
        🧾 Ganancia: <span style="color:${color};font-weight:bold">$${gan}</span><br>

        ${c.foto ? `<img src="${c.foto}">` : ''}

        ${c.garantiaFecha ? `
          <br>🛡️ Garantía: ${new Date(c.garantiaFecha).toLocaleDateString()}
          ${c.garantiaFoto ? `<br><img src="${c.garantiaFoto}"> : ''}`
        ` : ''}

        <br><br>

        ${
          c.confirmada === 'si'
          ? '<span style="color:green;font-weight:bold">✅ Confirmada</span>'
          : `
            <button onclick='event.stopPropagation(); editar(${JSON.stringify(c)})'>✏️</button>
            <button onclick="event.stopPropagation(); borrar('${c._id}')">❌</button>
            <button onclick="event.stopPropagation(); confirmar('${c._id}')">✔ Confirmar</button>
          `
        }

      </div>
    `
  })
}

// EDITAR
function editar(c) {

  if (c.confirmada === 'si') {
    alert('No editable')
    return
  }

  nombre.value = c.nombre || ''
  celular.value = c.celular || ''
  producto.value = c.producto || ''
  costoProveedor.value = c.costoProveedor || ''
  precioCliente.value = c.precioCliente || ''
  descripcion.value = c.descripcion || ''

  garantiaFecha.value = c.garantiaFecha ? c.garantiaFecha.split('T')[0] : ''

  fotoBase64 = c.foto || ''
  garantiaBase64 = c.garantiaFoto || ''

  editando = c._id

  calcularGanancia()
  form.style.display = 'block'
}

// BORRAR
async function borrar(id) {
  if (!confirm('Eliminar?')) return
  await fetch('/cotizacion/' + id, { method:'DELETE' })
  setTimeout(cargar, 100)
}

// CONFIRMAR
async function confirmar(id) {
  if (!confirm('Confirmar venta?')) return

  const res = await fetch('/cotizacion/confirmar/' + id, { method:'PUT' })

  if (!res.ok) {
    const err = await res.json()
    alert(err.msg || 'Error')
    return
  }

  setTimeout(cargar, 100)
}

// DETALLE
function verDetalle(c) {
  alert(`
Producto: ${c.producto}

Cliente: ${c.nombre || ''}
Celular: ${c.celular || ''}

Precio: $${c.precioCliente || 0}
Costo: $${c.costoProveedor || 0}
Ganancia: $${c.ganancia || 0}

Garantía: ${c.garantiaFecha ? new Date(c.garantiaFecha).toLocaleDateString() : 'Sin garantía'}
`)
}

// UI
function mostrarForm() {
  limpiar()
  form.style.display = 'block'
}

function cancelar() {
  limpiar()
}

function limpiar() {
  editando = null
  fotoBase64 = ''
  garantiaBase64 = ''

  nombre.value = ''
  celular.value = ''
  producto.value = ''
  costoProveedor.value = ''
  precioCliente.value = ''
  descripcion.value = ''
  ganancia.value = ''
  garantiaFecha.value = ''
  nuevoProveedor.value = ''
  foto.value = ''
  garantiaFoto.value = ''

  form.style.display = 'none'
}

// INIT
cargar()
cargarProveedores()

</script>

</body>
</html>
