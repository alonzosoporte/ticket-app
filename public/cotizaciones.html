<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cotizaciones PRO</title>

<style>
body {
  font-family: Arial;
  background:#eef2f7;
  padding:20px;
}

.topbar {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:15px;
  align-items:center;
}

input, select, textarea {
  padding:8px 10px;
  border-radius:10px;
  border:1px solid #ccc;
}

button {
  padding:8px 12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.btn { background:#007bff; color:white; }
.btn-success { background:#28a745; color:white; }
.btn-danger { background:#dc3545; color:white; }
.btn-secondary { background:#6c757d; color:white; }

.card {
  background:white;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.input-error {
  border:2px solid #dc3545 !important;
  background:#fff5f5;
}

.fila-precios {
  display:flex;
  gap:10px;
}

.fila-precios div {
  flex:1;
}

.fila-precios input {
  text-align:center;
  font-weight:bold;
}

.preview {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
  margin-top:10px;
}

.thumb {
  width:70px;
  height:70px;
  object-fit:cover;
  border-radius:8px;
  cursor:pointer;
  border:2px solid #ddd;
}

.thumb-wrap {
  position:relative;
}

.btn-x {
  position:absolute;
  top:-6px;
  right:-6px;
  background:red;
  color:white;
  border-radius:50%;
  width:18px;
  height:18px;
  font-size:12px;
  text-align:center;
  cursor:pointer;
}

.modal {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.8);
  display:none;
  align-items:center;
  justify-content:center;
}

.modal img {
  max-width:90%;
  max-height:90%;
  border-radius:10px;
}
</style>
</head>

<body>

<h2>📊 Cotizaciones</h2>

<div class="topbar">
  <button class="btn-secondary" onclick="location.href='admin.html'">⬅️ Volver</button>

  <input id="buscar" placeholder="🔍 Buscar..." oninput="cargar()">

  <select id="filtroEstado" onchange="cargar()">
    <option value="pendientes">⏳ Pendientes</option>
    <option value="confirmadas">✅ Confirmadas</option>
    <option value="todas">📋 Todas</option>
  </select>

  <button class="btn" onclick="mostrarForm()">➕ Nueva</button>
</div>

<div id="form" style="display:none;background:white;padding:15px;border-radius:12px;margin-bottom:15px">

<input id="nombre" placeholder="Nombre">
<input id="celular" placeholder="Celular">

<hr>

<input id="producto" placeholder="Producto">

<br><br>

<select id="proveedor"></select>
<button type="button" class="btn-danger" onclick="eliminarProveedor()">❌</button>

<input id="nuevoProveedor" placeholder="Nuevo proveedor">
<button type="button" class="btn" onclick="agregarProveedor()">➕</button>

<br><br>

<div class="fila-precios">
  <div>
    <label>Costo</label>
    <input id="costoProveedor">
  </div>

  <div>
    <label>Cliente</label>
    <input id="precioCliente">
  </div>

  <div>
    <label>Ganancia</label>
    <input id="ganancia" readonly>
  </div>
</div>

<br>

<textarea id="descripcion" placeholder="Descripción"></textarea>

<br><br>

📸 <input type="file" id="foto" multiple>
<div class="preview" id="preview"></div>

<br><br>

<button class="btn-success" onclick="guardar()">💾 Guardar</button>
<button class="btn-danger" onclick="cancelar()">❌ Cancelar</button>

</div>

<div id="lista"></div>

<div class="modal" id="modal" onclick="this.style.display='none'">
  <img id="modalImg">
</div>

<script>

let editando = null
let fotos = []

function calcularGanancia() {
  const costo = parseFloat(costoProveedor.value) || 0
  const precio = parseFloat(precioCliente.value) || 0
  ganancia.value = precio - costo
}

costoProveedor.oninput = calcularGanancia
precioCliente.oninput = calcularGanancia

foto.onchange = e => {
  const files = e.target.files
  for(let f of files){
    const r = new FileReader()
    r.onload = () => {
      fotos.push(r.result)
      renderPreview()
    }
    r.readAsDataURL(f)
  }
}

function renderPreview(){
  preview.innerHTML = ''
  fotos.forEach((img,i)=>{
    preview.innerHTML += `
      <div class="thumb-wrap">
        <img src="${img}" class="thumb" onclick="verImagen('${img}')">
        <div class="btn-x" onclick="borrarFoto(${i})">x</div>
      </div>
    `
  })
}

function borrarFoto(i){
  fotos.splice(i,1)
  renderPreview()
}

function verImagen(src){
  modal.style.display='flex'
  modalImg.src = src
}

async function cargarProveedores() {
  const res = await fetch('/proveedores')
  const data = await res.json()

  proveedor.innerHTML = `<option value="">-- Seleccionar proveedor --</option>`

  data.forEach(p => {
    proveedor.innerHTML += `<option value="${p.nombre}">${p.nombre}</option>`
  })
}

async function agregarProveedor(){
  const nombre = nuevoProveedor.value.trim()
  if(!nombre) return alert('Escribí proveedor')

  await fetch('/proveedores',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ nombre })
  })

  nuevoProveedor.value=''
  await cargarProveedores()
  proveedor.value = nombre
}

async function eliminarProveedor(){
  const nombre = proveedor.value
  if(!nombre) return alert('Seleccioná proveedor')

  if(!confirm('Eliminar proveedor "'+nombre+'"?')) return

  await fetch('/proveedores/'+encodeURIComponent(nombre), {
    method:'DELETE'
  })

  cargarProveedores()
}

function validarCampos(){
  let ok = true
  const campos = [nombre,celular,producto,proveedor,costoProveedor,precioCliente,descripcion]

  campos.forEach(c=>{
    if(!c.value.trim()){
      c.classList.add('input-error')
      ok = false
    }
  })

  if(!ok) alert("⚠️ Completá todos los campos")
  return ok
}

async function guardar() {

  if (!validarCampos()) return

  const data = {
    nombre: nombre.value,
    celular: celular.value,
    producto: producto.value,
    proveedor: proveedor.value,
    costoProveedor: costoProveedor.value,
    precioCliente: precioCliente.value,
    descripcion: descripcion.value,
    fotos: fotos
  }

  if (editando) {
    await fetch('/cotizacion/' + editando,{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(data)
    })
  } else {
    await fetch('/cotizacion',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(data)
    })
  }

  limpiar()
  cargar()
}

async function confirmar(id){
  await fetch('/cotizacion/'+id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ confirmada:'si' })
  })
  cargar()
}

async function cargar() {

  const res = await fetch('/cotizaciones')
  let data = await res.json()

  const estado = filtroEstado.value

  if (estado === 'pendientes') data = data.filter(c => c.confirmada !== 'si')
  if (estado === 'confirmadas') data = data.filter(c => c.confirmada === 'si')

  lista.innerHTML = ''

  data.reverse().forEach(c => {

    const costo = parseFloat(c.costoProveedor) || 0
    const precio = parseFloat(c.precioCliente) || 0
    const gan = precio - costo

    lista.innerHTML += `
    <div class="card">

      📅 ${c.fecha ? new Date(c.fecha).toLocaleString() : ''}<br>

      <b>${c.producto}</b><br>
      🏢 ${c.proveedor || 'Sin proveedor'}<br>
      ${c.nombre} (${c.celular})<br>

      💸 $${costo} → 💰 $${precio}<br>
      🧾 <b>Ganancia $${gan}</b><br><br>

      <div class="preview">
        ${(c.fotos || []).map(img=>`
          <img src="${img}" class="thumb" onclick="verImagen('${img}')">
        `).join('')}
      </div>

      <br>

      ${
        c.confirmada === 'si'
        ? `<span style="color:green;font-weight:bold">✔️ Confirmada</span><br><br>
           <button class="btn-danger" onclick="borrar('${c._id}')">❌</button>`
        : `<span style="color:orange;font-weight:bold">⏳ Pendiente</span><br><br>
           <button class="btn" onclick="editar('${c._id}')">✏️</button>
           <button class="btn-danger" onclick="borrar('${c._id}')">❌</button>
           <button class="btn-success" onclick="confirmar('${c._id}')">✔️ Confirmar</button>`
      }

    </div>
    `
  })
}

async function editar(id){
  const res = await fetch('/cotizaciones')
  const data = await res.json()
  const c = data.find(x => x._id === id)

  editando = c._id

  nombre.value=c.nombre||''
  celular.value=c.celular||''
  producto.value=c.producto||''
  proveedor.value=c.proveedor||''
  costoProveedor.value=c.costoProveedor||''
  precioCliente.value=c.precioCliente||''
  descripcion.value=c.descripcion||''
  fotos = c.fotos || []

  renderPreview()
  calcularGanancia()
  form.style.display='block'
}

async function borrar(id){
  if(!confirm('Eliminar?'))return
  await fetch('/cotizacion/'+id,{method:'DELETE'})
  cargar()
}

function mostrarForm(){
  limpiar()
  form.style.display = 'block'
}

function cancelar(){
  limpiar()
}

function limpiar(){
  editando = null
  fotos = []

  nombre.value = ''
  celular.value = ''
  producto.value = ''
  costoProveedor.value = ''
  precioCliente.value = ''
  descripcion.value = ''
  ganancia.value = ''
  proveedor.value = ''

  foto.value = ''
  preview.innerHTML = ''
  form.style.display = 'none'
}

document.addEventListener('input', (e)=>{
  if(e.target.matches('input, textarea, select')){
    e.target.classList.remove('input-error')
  }
})

cargar()
cargarProveedores()

</script>

</body>
</html>
