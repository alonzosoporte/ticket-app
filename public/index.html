<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sistema Tickets</title>

<script src="https://ticket-pro-xmhs.onrender.com/socket.io/socket.io.js"></script>

<style>

body{
  font-family:Arial;
  background:#eef2f7;
  padding:5px 20px;
  margin:0;
}

.container{
  max-width:700px;
  margin:50px auto;
  padding:20px;
}

.box{
  background:white;
  padding:35px;
  border-radius:18px;
  box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

h2{
  text-align:center;
  margin-bottom:30px;
  color:#003366;
}

/* NAV */
.nav-admin{
  text-align:right;
  margin-bottom:15px;
}

.nav-admin a{
  text-decoration:none;
  background:#003366;
  color:white;
  padding:10px 14px;
  border-radius:10px;
  font-size:14px;
  font-weight:bold;
}

/* FORM */
.form-pro{
  display:flex;
  flex-direction:column;
  gap:18px;
}

.form-group{
  display:flex;
  flex-direction:column;
}

.form-group label{
  margin-bottom:8px;
  font-weight:bold;
  color:#003366;
}

.form-group input,
.form-group textarea{
  padding:14px;
  border-radius:12px;
  border:1px solid #ccc;
  font-size:15px;
  box-sizing:border-box;
}

.form-group textarea{
  min-height:140px;
  resize:vertical;
}

.btn-enviar{
  width:100%;
  padding:15px;
  border:none;
  border-radius:12px;
  background:#22c55e;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

.btn-enviar:hover{
  background:#16a34a;
}

/* CELULAR */
@media(max-width:600px){

  .container{
    margin:20px auto;
    padding:15px;
  }

  .box{
    padding:22px;
  }
}
.titulo-app{
  text-align:center;
  margin-bottom:5px;
}

.logo-app{
  width:90px;
  margin-bottom:2px;
}

.titulo-app h1{
  margin:0;
}
.titulo-app{
  text-align:center;
  margin-bottom:6px;
  line-height:1.1;
}
.logo-top{
  text-align:center;
  margin-bottom:10px;
}
h1{
  margin-top:0;
  margin-bottom:8px;
}
.logo-top img{
  width:120px;
  max-width:92%;
  object-fit:contain;

  background:white;
  padding:12px;
  border-radius:18px;

  box-shadow:
  0 8px 25px rgba(0,0,0,0.12);
}

</style>
</head>

<body>

<div class="container">


  <div class="box">

    <div class="titulo-app">

  <img
  src="logo.png"
  class="logo-app">

  <h1>Ticket Reparaciones PRO</h1>

</div>

    <div class="form-pro">

      <div class="form-group">

        <label>
        Nombre y Apellido y/o Empresa
        </label>

        <input
        id="nombre"
        placeholder="Ingrese nombre o empresa">

      </div>

      <div class="form-group">

        <label>
        Cel
        </label>

        <input
        id="telefono"
        placeholder="Ej: 098123456"
        maxlength="15"

        onkeypress="
        if(event.charCode < 48 || event.charCode > 57){
        event.preventDefault()
        }
        "

        oninput="
        this.value=this.value.replace(/\D/g,'')
        "
        >

      </div>

      <div class="form-group">

        <label>
        Describa el problema o tarea a realizar
        </label>

        <textarea
        id="problema"
        placeholder="Explique el problema del equipo o el trabajo a realizar"></textarea>

      </div>

      <button
      class="btn-enviar"
      onclick="crear()">

      📩 Enviar Ticket

      </button>

    </div>

  </div>

</div>

<script>

const socket =
io('https://ticket-pro-xmhs.onrender.com')

async function crear(){

  const n =
  document.getElementById('nombre').value

  const t =
  document.getElementById('telefono').value

  const p =
  document.getElementById('problema').value

  if(!n || !t || !p){

    alert("Completa todo")

    return
  }

  try{

    const res =
    await fetch(
    'https://ticket-pro-xmhs.onrender.com/ticket-publico',{

      method:'POST',

      headers:{
        'Content-Type':'application/json'
      },

      body:JSON.stringify({

        nombre:n,
        telefono:t,
        problema:p
      })
    })

    const data =
    await res.json()

    if(data.error){

      alert(data.error)

      return
    }

    // REFRESCAR ADMIN
    socket.emit('actualizar')

    // TELEFONO
    let tel =
    t.replace(/\D/g,'')

    if(tel.startsWith('0')){
      tel='598'+tel.substring(1)
    }

    if(!tel.startsWith('598')){
      tel='598'+tel
    }

    // FECHA
    const fecha =
    new Date(data.fecha)
    .toLocaleString('es-UY',{

      day:'2-digit',
      month:'2-digit',
      year:'numeric',
      hour:'2-digit',
      minute:'2-digit'
    })

    // MENSAJE
    const mensaje =
`Hola ${n} 👋

Tu ticket fue creado correctamente ✅

📅 Fecha solicitud: ${fecha}

🧾 Ticket: ${data.numero}

🔧 Problema:
${p}

El técnico se comunicará contigo.`

    const url =
    "https://api.whatsapp.com/send?phone="
    + tel +
    "&text=" +
    encodeURIComponent(mensaje)

    // LIMPIAR
    document.getElementById('nombre').value=''
    document.getElementById('telefono').value=''
    document.getElementById('problema').value=''

    // WHATSAPP
    window.location.href=url

  }catch(e){

    console.error(e)

    alert("Error al crear ticket")
  }
}

</script>

</body>
</html>
