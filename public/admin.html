<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Tickets PRO</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://ticket-pro-xmhs.onrender.com/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
  font-family: Arial;
  background:#eef2f7;
  padding:15px;
}

.nav-top {
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.header-pro {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  background:white;
  padding:12px;
  border-radius:14px;
  margin-bottom:20px;
  border-left:5px solid #003366;
}

input, select {
  padding:8px;
  border-radius:10px;
  border:1px solid #ccc;
}

button {
  padding:8px 10px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.btn { background:#003366; color:white }
.btn-success { background:#28a745; color:white }
.btn-danger { background:#dc3545; color:white }
.btn-secondary { background:#6c757d; color:white }

.panel {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.card {
  background:white;
  padding:10px;
  border-radius:10px;
  flex:1;
}

.ticket {
  background:white;
  padding:10px;
  margin:10px 0;
  border-radius:10px;
}

textarea {
  width:100%;
  min-height:60px;
  padding:8px;
  border-radius:10px;
  border:1px solid #ccc;
}
</style>
</head>

<body>

<div class="nav-top">
  <button class="btn-secondary" onclick="location.href='cotizaciones.html'">📊 Cotizaciones</button>
  <button class="btn-secondary" onclick="location.href='garantias.html'">🛡️ Garantías</button>
</div>

<div class="header-pro">
  <input id="busqueda" placeholder="🔍 Buscar..." oninput="cargar()">

  <select id="filtroMes" onchange="cargar()">
    <option value="todos">📅 Todos</option>
  </select>

  <button class="btn" onclick="modo='pendientes';cargar()">Pendientes</button>
  <button class="btn-success" onclick="modo='todos';cargar()">Todos</button>
  <button class="btn-danger" onclick="logout()">Salir</button>
</div>

<div id="resumen"></div>
<div id="lista"></div>

<script>
const API = 'https://ticket-pro-xmhs.onrender.com'
const TOKEN = localStorage.getItem('token')

if(!TOKEN){
  location.href = 'login.html'
}

const socket = io(API)
let modo = 'pendientes'

function logout(){
  localStorage.removeItem('token')
  location.href = 'login.html'
}

function fetchAuth(url, options = {}){
  return fetch(API + url, {
    ...options,
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer ' + TOKEN,
      ...(options.headers || {})
    }
  })
}

// 📅 MESES BONITO
function cargarMeses(tickets){
  const select = document.getElementById('filtroMes')
  const seleccionado = select.value

  const nombres = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']
  const meses = new Set()

  tickets.forEach(t=>{
    if(!t.fecha) return
    const d = new Date(t.fecha)
    const mes = String(d.getMonth()+1).padStart(2,'0')
    const anio = d.getFullYear()
    meses.add(`${anio}-${mes}`) // ✅ FIX
  })

  select.innerHTML = `<option value="todos">📅 Todos</option>` // ✅ FIX

  ;[...meses].sort().reverse().forEach(m=>{
    const [anio,mes] = m.split('-')
    const nombre = nombres[parseInt(mes)-1]
    select.innerHTML += `<option value="${m}">${nombre} ${anio}</option>`
  })

  select.value = seleccionado || 'todos'
}
// 📲 WHATSAPP
async function listoWhatsApp(id,nombre,telefono,precio){
  let tel = telefono.replace(/\D/g,'')
  if(tel.startsWith('0')) tel='598'+tel.substring(1)
  if(!tel.startsWith('598')) tel='598'+tel

  const msg = `Hola ${nombre} 👋
Tu equipo está listo ✅
🧾 ${id}
💲 ${precio||'A confirmar'}`

window.open(`https://api.whatsapp.com/send?phone=${tel}&text=${encodeURIComponent(msg)}`)
  await guardar(id,'estado','listo')
}

// CRUD
async function guardar(id,campo,valor){
  await fetchAuth('/ticket/'+id,{
    method:'PUT',
    body: JSON.stringify({[campo]:valor})
  })
}

async function marcarEntregado(id){
  await fetchAuth('/ticket/'+id,{
    method:'PUT',
    body: JSON.stringify({entregado:'si'})
  })
}

async function borrar(id,nombre){
  if(!confirm(`Eliminar ticket de ${nombre}`?)) return
  await fetchAuth('/ticket/'+id,{method:'DELETE'})
}

// LOAD
async function cargar(){

  try{
    const res = await fetchAuth('/tickets')
    const tickets = await res.json()

    if(!Array.isArray(tickets)) return

    cargarMeses(tickets)

    let filtrados = [...tickets]

    const mes = filtroMes.value
    if(mes !== 'todos'){
      filtrados = filtrados.filter(t=>{
        const d = new Date(t.fecha)
        const m = String(d.getMonth()+1).padStart(2,'0')
        const a = d.getFullYear()
        return `${a}-${m}` === mes
      })
    }

    if(modo === 'pendientes'){
      filtrados = filtrados.filter(t=>t.entregado !== 'si')
    }

    const texto = busqueda.value.toLowerCase()

    filtrados = filtrados.filter(t=>
      (t.nombre||'').toLowerCase().includes(texto) ||
      (t.telefono||'').includes(texto)
    )

    let total = 0
    filtrados.forEach(t=>{
      total += parseFloat(t.ganancia)||0
    })

    resumen.innerHTML = `
      <div class="panel">
        <div class="card">💰 Total: $${total}</div>
      </div>
    `
lista.innerHTML=''`

filtrados.reverse().forEach(t=>{

  // 🔒 FIX SEGURO (evita romper por comillas)
  const nombreSeguro = (t.nombre || '').replace(/'/g,"")

  lista.innerHTML+=`
  <div class="ticket">
    <b>${t.numero}</b><br>
    ${nombreSeguro} (${t.telefono || ''})<br>
    ${t.problema || ''}<br><br>

    💲 <input value="${t.precio || ''}" 
    onchange="guardar('${t.numero}','precio',this.value)">

    💰 <input value="${t.ganancia || ''}" 
    onchange="guardar('${t.numero}','ganancia',this.value)">

    <br><br>

    📝 Detalle:
    <textarea 
    onblur="guardar('${t.numero}','detalle',this.value)">
${t.detalle || ''}
    </textarea>

    <br><br>

    <button class="btn-success"
    onclick="listoWhatsApp('${t.numero}','${nombreSeguro}','${t.telefono}','${t.precio}')">
    WhatsApp</button>

    <button class="btn-secondary"
    onclick="marcarEntregado('${t.numero}')">
    Entregado</button>

    <button class="btn-danger"
    onclick="borrar('${t.numero}','${nombreSeguro}')">
    Eliminar</button>

  </div>
  `
})

  }catch(e){
    console.error(e)
    alert('Error de conexión')
  }
}

socket.on('actualizar',()=>cargar())

cargar()
</script>

</body>
</html>
