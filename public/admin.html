<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Tickets PRO</title>

<script src="/socket.io/socket.io.js"></script>

<style>
body {
  font-family: Arial;
  background:#eef2f7;
  padding:20px;
}

.topbar {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:15px;
  align-items:center;
}

input {
  padding:8px 10px;
  border-radius:10px;
  border:1px solid #ccc;
  max-width:240px;
}

select {
  padding:8px;
  border-radius:10px;
  border:1px solid #ccc;
}

button {
  padding:8px 12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.btn { background:#007bff; color:white; }
.btn-success { background:#28a745; color:white; }
.btn-danger { background:#dc3545; color:white; }
.btn-secondary { background:#6c757d; color:white; }

.ticket {
  background:white;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.resumen {
  background:#fff;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}
</style>
</head>

<body>

<div class="topbar">

  <button class="btn-secondary" onclick="location.href='cotizaciones.html'">📊 Cotizaciones</button>
  <button class="btn-secondary" onclick="location.href='garantias.html'">🛡️ Garantías</button>

  <input id="busqueda" placeholder="🔍 Buscar..." oninput="cargar()">

  <select id="filtroMes" onchange="cargar()">
    <option value="todos">📅 Reparaciones</option>
  </select>

  <select id="filtroMesVentas" onchange="cargar()">
    <option value="todos">🛒 Ventas</option>
  </select>

  <button class="btn" onclick="modo='pendientes';cargar()">📋 Pendientes</button>
  <button class="btn-success" onclick="modo='todos';cargar()">✅ Todos</button>

</div>

<h2>🧾 Sistema De Tickets</h2>

<div id="resumen"></div>
<div id="lista"></div>

<script>

let modo = 'pendientes'
const socket = io()

async function cargar() {

  const res = await fetch('/tickets')
  let tickets = await res.json()

  const resCot = await fetch('/cotizaciones')
  let cotizaciones = await resCot.json()

  // ===== MESES REPARACIONES =====
  let listaMeses = {}

  tickets.forEach(t => {
    if (!t.fecha) return
    const f = new Date(t.fecha)
    if (isNaN(f)) return

    const key = f.getFullYear() + '-' + (f.getMonth() + 1)
    listaMeses[key] = f.toLocaleString('es-UY', { month: 'long', year: 'numeric' })
  })

  const select = document.getElementById('filtroMes')

  if (select.options.length <= 1) {
    Object.entries(listaMeses).reverse().forEach(([k, txt]) => {
      const opt = document.createElement('option')
      opt.value = k
      opt.textContent = txt
      select.appendChild(opt)
    })
  }

  // ===== MESES VENTAS =====
  let listaMesesVentas = {}

  cotizaciones.forEach(c => {
    if (!c.fecha) return
    const f = new Date(c.fecha)
    if (isNaN(f)) return

    const key = f.getFullYear() + '-' + (f.getMonth() + 1)
    listaMesesVentas[key] = f.toLocaleString('es-UY', { month: 'long', year: 'numeric' })
  })

  const selectVentas = document.getElementById('filtroMesVentas')

  if (selectVentas.options.length <= 1) {
    Object.entries(listaMesesVentas).reverse().forEach(([k, txt]) => {
      const opt = document.createElement('option')
      opt.value = k
      opt.textContent = txt
      selectVentas.appendChild(opt)
    })
  }

  // ===== FILTROS =====
  const mes = select.value
  const mesVentas = selectVentas.value

  if (mes !== 'todos') {
    tickets = tickets.filter(t => {
      const f = new Date(t.fecha)
      const key = f.getFullYear() + '-' + (f.getMonth() + 1)
      return key === mes
    })
  }

  if (mesVentas !== 'todos') {
    cotizaciones = cotizaciones.filter(c => {
      const f = new Date(c.fecha)
      const key = f.getFullYear() + '-' + (f.getMonth() + 1)
      return key === mesVentas
    })
  }

  // ===== RESUMEN =====
  let totalReparaciones = 0
  let totalVentas = 0

  tickets.forEach(t => {
    if (t.entregado === 'si') {
      totalReparaciones += parseFloat(t.ganancia) || 0
    }
  })

  cotizaciones.forEach(c => {
    if (c.confirmada === 'si') {
      totalVentas += parseFloat(c.ganancia) || 0
    }
  })

  document.getElementById('resumen').innerHTML = `
    <div class="resumen">
      <b>💰 Panel de Ganancias</b><br><br>
      🔧 Reparaciones: $${totalReparaciones}<br>
      🛒 Ventas: $${totalVentas}<br><br>
      <b>🧮 TOTAL: $${totalReparaciones + totalVentas}</b>
    </div>
  `

  // ===== LISTA =====
  if (modo === 'pendientes') {
    tickets = tickets.filter(t => t.entregado !== 'si')
  }

  const filtro = document.getElementById('busqueda').value.toLowerCase()

  tickets = tickets.filter(t =>
    (t.nombre || '').toLowerCase().includes(filtro) ||
    (t.telefono || '').includes(filtro) ||
    (t.numero || '').toLowerCase().includes(filtro)
  )

  const lista = document.getElementById('lista')
  lista.innerHTML = ''

  tickets.reverse().forEach(t => {
    lista.innerHTML += `
      <div class="ticket">
        <b>${t.numero}</b><br>
        ${t.nombre} (${t.telefono})<br>
        ${t.problema}<br>
        📅 ${new Date(t.fecha).toLocaleString('es-UY')}<br><br>

        💲 Precio:
        <input value="${t.precio || ''}" onchange="guardar('${t.numero}','precio',this.value)">

        💰 Ganancia:
        <input value="${t.ganancia || ''}" onchange="guardar('${t.numero}','ganancia',this.value)">

        <br><br>

        <button class="btn-success" onclick="marcarEntregado('${t.numero}')">📦 Entregado</button>
        <button class="btn-danger" onclick="borrar('${t.numero}')">❌</button>
      </div>
    `
  })
}

async function guardar(id, campo, valor) {
  await fetch('/ticket/'+id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ [campo]: valor })
  })
}

async function marcarEntregado(id) {
  await fetch('/ticket/'+id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ entregado:'si' })
  })
}

async function borrar(id) {
  if (!confirm("Eliminar?")) return
  await fetch('/ticket/'+id,{method:'DELETE'})
}

socket.on('actualizar', cargar)

cargar()

</script>

</body>
</html>
