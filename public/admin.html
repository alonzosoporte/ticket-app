<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Tickets PRO</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://ticket-pro-xmhs.onrender.com/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
  font-family: Arial;
  background:#eef2f7;
  padding:15px;
}

.nav-top {
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.header-pro {
  display:flex;
  align-items:center;
  gap:10px;
  background:white;
  padding:12px;
  border-radius:14px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
  margin-bottom:15px;
  flex-wrap:wrap;
  border-left:5px solid #003366;
}

.titulo {
  font-size:18px;
  font-weight:bold;
}

.acciones {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}

select, input {
  padding:8px;
  border-radius:10px;
  border:1px solid #ccc;
}

button {
  padding:8px 10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.btn { background:#003366; color:white; }
.btn-success { background:#28a745; color:white }
.btn-danger { background:#dc3545; color:white }
.btn-secondary { background:#6c757d; color:white }

.panel {
  display:flex;
  gap:10px;
  margin-bottom:10px;
  flex-wrap:wrap;
}

.card {
  background:white;
  padding:12px;
  border-radius:12px;
  flex:1;
  text-align:center;
}

.monto {
  font-size:18px;
  font-weight:bold;
}

.ticket {
  background:white;
  padding:12px;
  margin:10px 0;
  border-radius:12px;
}
</style>
</head>

<body>

<div class="nav-top">
  <button class="btn-secondary" onclick="location.href='cotizaciones.html'">📊 Cotizaciones</button>
  <button class="btn-secondary" onclick="location.href='garantias.html'">🛡️ Garantías</button>
</div>

<div class="header-pro">
  <div class="titulo">🧾 Sistema De Tickets</div>

  <div class="acciones">
    <input id="busqueda" placeholder="🔍 Buscar..." oninput="cargar()">

    <select id="filtroMes" onchange="cargar()">
      <option value="todos">📅 Todos</option>
    </select>

    <button class="btn" onclick="modo='pendientes';cargar()">📋 Pendientes</button>
    <button class="btn-success" onclick="modo='todos';cargar()">✅ Todos</button>
    <button class="btn-danger" onclick="logout()">🚪 Salir</button>
  </div>
</div>

<div id="resumen"></div>
<div id="lista"></div>

<script>

const API = 'https://ticket-pro-xmhs.onrender.com'
const TOKEN = localStorage.getItem('token')

if(!TOKEN){
  location.href = 'login.html'
}

const socket = io(API)
let modo = 'pendientes'

function logout(){
  localStorage.removeItem('token')
  location.href = 'login.html'
}

function fetchAuth(url, options = {}){
  return fetch(API + url, {
    ...options,
    headers:{
      'Content-Type':'application/json',
      'Authorization': 'Bearer ' + TOKEN,
      ...(options.headers || {})
    }
  })
}

// ===== WHATSAPP =====
async function listoWhatsApp(id,nombre,telefono,precio){

  let tel=telefono.replace(/\D/g,'')

  if(tel.startsWith('0')) tel='598'+tel.substring(1)
  if(!tel.startsWith('598')) tel='598'+tel

  const msg=`Hola ${nombre} 👋

Tu equipo está listo ✅

🧾 ${id}
💲 ${precio||'A confirmar'}`

  window.open("https://api.whatsapp.com/send?phone="+tel+"&text="+encodeURIComponent(msg))

  await guardar(id,'estado','listo')
}

// ===== CRUD =====
async function guardar(id,campo,valor){
  await fetchAuth('/ticket/'+id,{
    method:'PUT',
    body: JSON.stringify({[campo]:valor})
  })
}

async function marcarEntregado(id){
  await fetchAuth('/ticket/'+id,{
    method:'PUT',
    body: JSON.stringify({entregado:'si'})
  })
}

async function borrar(id,nombre){
  if(!confirm("¿Eliminar ticket de " + nombre + "?")) return
  await fetchAuth('/ticket/'+id,{method:'DELETE'})
}

// ===== CARGAR =====
async function cargar(){

  const res = await fetchAuth('/tickets')
  let tickets = await res.json()

  const resCot = await fetchAuth('/cotizaciones')
  let cotizaciones = await resCot.json()

  // FILTRO MES
  const meses = {}
  tickets.forEach(t=>{
    const f=new Date(t.fecha)
    const key=f.getFullYear()+'-'+(f.getMonth()+1)
    meses[key]=f.toLocaleString('es-UY',{month:'long',year:'numeric'})
  })

  filtroMes.innerHTML='<option value="todos">📅 Todos</option>'
  for(let k in meses){
    filtroMes.innerHTML += `<option value="${k}">${meses[k]}</option>`
  }

  const mesSel = filtroMes.value

  if(mesSel !== 'todos'){
    tickets = tickets.filter(t=>{
      const f=new Date(t.fecha)
      return f.getFullYear()+'-'+(f.getMonth()+1)===mesSel
    })

    cotizaciones = cotizaciones.filter(c=>{
      const f=new Date(c.fecha)
      return f.getFullYear()+'-'+(f.getMonth()+1)===mesSel
    })
  }

  // GANANCIAS
  let rep=0, ven=0

  tickets.forEach(t=>{
    if(t.entregado==='si') rep+=parseFloat(t.ganancia)||0
  })

  cotizaciones.forEach(c=>{
    if(c.confirmada==='si'){
      ven += (parseFloat(c.precioCliente)||0) - (parseFloat(c.costoProveedor)||0)
    }
  })

  resumen.innerHTML = `
  <div class="panel">
    <div class="card">
      🔧 Reparaciones
      <div class="monto">$${rep}</div>
    </div>

    <div class="card">
      🛒 Ventas
      <div class="monto">$${ven}</div>
    </div>

    <div class="card">
      💰 Total
      <div class="monto">$${rep+ven}</div>
    </div>
  </div>
  `

  // FILTRO
  if(modo==='pendientes'){
    tickets = tickets.filter(t=>t.entregado!=='si')
  }

  const filtro = busqueda.value.toLowerCase()

  tickets = tickets.filter(t=>
    (t.nombre||'').toLowerCase().includes(filtro) ||
    (t.telefono||'').includes(filtro)
  )

  lista.innerHTML=''

  tickets.reverse().forEach(t=>{
    lista.innerHTML+=`
    <div class="ticket">
      <b>${t.numero}</b><br>
      ${t.nombre} (${t.telefono})<br>
      ${t.problema}<br>
      📅 ${new Date(t.fecha).toLocaleString('es-UY')}<br><br>

      💲 <input value="${t.precio||''}" onchange="guardar('${t.numero}','precio',this.value)">
      💰 <input value="${t.ganancia||''}" onchange="guardar('${t.numero}','ganancia',this.value)">

      <br><br>

      <button class="btn-success"
      onclick="listoWhatsApp('${t.numero}','${t.nombre}','${t.telefono}','${t.precio}')">
      ✔️ Listo + WhatsApp</button>

      <button class="btn-secondary"
      onclick="marcarEntregado('${t.numero}')">
      📦 Entregado</button>

      <button class="btn-danger"
      onclick="borrar('${t.numero}','${t.nombre}')">
      ❌</button>

    </div>
    `
  })
}

socket.on('actualizar',cargar)
cargar()

</script>

</body>
</html>
