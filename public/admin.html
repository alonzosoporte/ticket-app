<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Tickets PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://ticket-pro-xmhs.onrender.com/socket.io/socket.io.js"></script>

<style>
body{
  font-family:Arial;
  background:#eef2f7;
  padding:15px;
}

/* NAV */
.nav-top{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

/* HEADER */
.header-pro{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  background:white;
  padding:12px;
  border-radius:14px;
  margin-bottom:20px;
  border-left:5px solid #003366;
}

/* INPUTS */
input,select,textarea{
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
}

/* BOTONES */
button{
  padding:10px 12px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.btn{
  background:#003366;
  color:white;
}

.btn-success{
  background:#28a745;
  color:white;
}

.btn-danger{
  background:#dc3545;
  color:white;
}

.btn-secondary{
  background:#6c757d;
  color:white;
}

/* PANEL */
.panel{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.card{
  background:white;
  padding:12px;
  border-radius:12px;
  flex:1;
  font-weight:bold;
}

/* TICKETS */
.ticket{
  background:white;
  padding:15px;
  margin-bottom:15px;
  border-radius:12px;
}

.ticket-top{
  margin-bottom:10px;
  line-height:1.7;
}

textarea{
  width:100%;
  min-height:70px;
  resize:none;
  margin-top:10px;
}

.acciones-ticket{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:12px;
}
</style>
</head>

<body>

<script>
const TOKEN = localStorage.getItem('token')

if(!TOKEN){
  location.href='login.html'
}
</script>

<!-- NAV -->
<div class="nav-top">

  <button class="btn-secondary"
  onclick="location.href='cotizaciones.html'">
  📊 Cotizaciones
  </button>

  <button class="btn-secondary"
  onclick="location.href='garantias.html'">
  🛡️ Garantías
  </button>

</div>

<!-- HEADER -->
<div class="header-pro">

  <input id="busqueda"
  placeholder="🔍 Buscar..."
  oninput="cargar()">

  <select id="filtroMes" onchange="cargar()">
    <option value="todos">📅 Todos</option>
  </select>

  <button class="btn"
  onclick="modo='pendientes';cargar()">
  Pendientes
  </button>

  <button class="btn-success"
  onclick="modo='todos';cargar()">
  Todos
  </button>

  <button class="btn-danger"
  onclick="logout()">
  Salir
  </button>

</div>

<!-- RESUMEN -->
<div id="resumen"></div>

<!-- LISTA -->
<div id="lista"></div>

<script>

const API='https://ticket-pro-xmhs.onrender.com'

const socket =
io('https://ticket-pro-xmhs.onrender.com')

let modo='pendientes'

// LOGOUT
function logout(){

  localStorage.removeItem('token')

  location.href='login.html'
}

// FETCH AUTH
function fetchAuth(url,options={}){

  return fetch(API+url,{

    ...options,

    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer '+TOKEN
    }
  })
}

// MESES
function cargarMeses(tickets){

  const select =
  document.getElementById('filtroMes')

  const actual = select.value

  const nombres=[
    'Enero','Febrero','Marzo','Abril',
    'Mayo','Junio','Julio','Agosto',
    'Septiembre','Octubre','Noviembre','Diciembre'
  ]

  const meses=new Set()

  tickets.forEach(t=>{

    if(!t.fecha) return

    const d=new Date(t.fecha)

    const mes=
    String(d.getMonth()+1)
    .padStart(2,'0')

    const anio=d.getFullYear()

    meses.add(`${anio}-${mes}`)
  })

  select.innerHTML=
  `<option value="todos">📅 Todos</option>`

  ;[...meses]
  .sort()
  .reverse()
  .forEach(m=>{

    const partes=m.split('-')

    const anio=partes[0]
    const mes=partes[1]

    const nombre=
    nombres[parseInt(mes)-1]

    select.innerHTML += `
    <option value="${m}">
      ${nombre} ${anio}
    </option>`
  })

  const hoy=new Date()

  const actualMes=
  `${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}`

  select.value =
  actual !== 'todos'
  ? actual
  : actualMes
}

// CRUD
async function guardar(id,campo,valor){

  await fetchAuth('/ticket/'+id,{

    method:'PUT',

    body:JSON.stringify({
      [campo]:valor
    })
  })
}

async function marcarEntregado(id){

  await fetchAuth('/ticket/'+id,{

    method:'PUT',

    body:JSON.stringify({
      entregado:'si'
    })
  })

  cargar()
}

async function borrar(id,nombre){

  if(!confirm(`¿Eliminar ticket de ${nombre}?`)){
    return
  }

  await fetchAuth('/ticket/'+id,{
    method:'DELETE'
  })

  cargar()
}

// WHATSAPP
function listoWhatsApp(
  id,
  nombre,
  telefono,
  precio,
  detalle
){

  let tel=
  (telefono||'').replace(/\D/g,'')

  if(tel.startsWith('0')){
    tel='598'+tel.substring(1)
  }

  if(!tel.startsWith('598')){
    tel='598'+tel
  }

  const msg=`Hola ${nombre} 👋

El servicio con numero de 🧾 Ticket ${id} ha sido realizado ✅

📝 Detalle:
${detalle || 'Se realizó el servicio correctamente'}

📦 Podés pasar a retirarlo.

💲 Precio: ${precio || 'A confirmar'}

Se puede pagar al momento de retirar el equipo
o mediante depósito bancario.

🏦 BROU
CA 001120656-00002`

  window.open(
    `https://api.whatsapp.com/send?phone=${tel}&text=${encodeURIComponent(msg)}`
  )
}

// CARGAR
async function cargar(){

  try{

    // =========================
    // TICKETS
    // =========================
    const res =
    await fetchAuth('/tickets')

    const tickets =
    await res.json()

    // =========================
    // COTIZACIONES
    // =========================
    let cotizaciones=[]

    try{

      const resCot =
      await fetchAuth('/cotizaciones')

      cotizaciones =
      await resCot.json()

      if(!Array.isArray(cotizaciones)){
        cotizaciones=[]
      }

    }catch(err){

      console.log('Error ventas', err)
    }

    cargarMeses(tickets)

    const mesSel=
    document.getElementById('filtroMes').value

    const filtro=
    document.getElementById('busqueda')
    .value
    .toLowerCase()

    let rep=0
    let ven=0

    // =========================
    // REPARACIONES
    // =========================
    tickets.forEach(t=>{

      if(!t.fecha) return

      const d=new Date(t.fecha)

      const mes=
      String(d.getMonth()+1)
      .padStart(2,'0')

      const anio=d.getFullYear()

      const clave=`${anio}-${mes}`

      if(
        mesSel!=='todos' &&
        clave!==mesSel
      ){
        return
      }

      if(t.entregado==='si'){

        rep +=
        parseFloat(t.ganancia)||0
      }
    })

    // =========================
    // VENTAS
    // =========================
    cotizaciones.forEach(c=>{
    console.log('COTIZACION:', c)

      if(c.confirmada !== 'si') return

      if(!c.fecha) return

      const d=new Date(c.fecha)

      const mes=
      String(d.getMonth()+1)
      .padStart(2,'0')

      const anio=d.getFullYear()

      const clave=`${anio}-${mes}`

      if(
        mesSel!=='todos' &&
        clave!==mesSel
      ){
        return
      }

  console.log('SUMANDO:', c.ganancia)

  ven += Number(c.ganancia || 0)
    })

    // =========================
    // RESUMEN
    // =========================
    document.getElementById('resumen')
    .innerHTML=`

    <div class="panel">

      <div class="card">
      🔧 Reparaciones $${rep}
      </div>

      <div class="card">
      🛒 Ventas $${ven}
      </div>

      <div class="card">
      💰 Total $${rep+ven}
      </div>

    </div>
    `

    let filtrados=[...tickets]

    // SOLO PENDIENTES
    if(modo==='pendientes'){

      filtrados=
      filtrados.filter(
        t=>t.entregado!=='si'
      )
    }

    // FILTRO
    filtrados=filtrados.filter(t=>{

      const match=

      (t.nombre||'')
      .toLowerCase()
      .includes(filtro)

      ||

      (t.telefono||'')
      .includes(filtro)

      ||

      (t.numero||'')
      .toLowerCase()
      .includes(filtro)

      if(mesSel==='todos'){
        return match
      }

      const d=new Date(t.fecha)

      const mes=
      String(d.getMonth()+1)
      .padStart(2,'0')

      const anio=d.getFullYear()

      const clave=`${anio}-${mes}`

      return match && clave===mesSel
    })

    // MÁS NUEVOS ARRIBA
    filtrados.reverse()

    lista.innerHTML=''

    filtrados.forEach(t=>{

      const nombre=
      (t.nombre||'')
      .replace(/'/g,'')

      const detalle=
      (t.detalle||'')
      .replace(/'/g,"")
      .replace(/\n/g," ")
      .replace(/\r/g," ")

      const fecha=
      new Date(t.fecha)
      .toLocaleDateString('es-UY')

      lista.innerHTML += `

      <div class="ticket">

        <div class="ticket-top">

          📅 ${fecha}<br>

          🧾 <b>
          Ticket ${t.numero}
          </b><br>

          👤 ${nombre}<br>

          📱 ${t.telefono}<br><br>

          🔧 ${t.problema}

        </div>

        💲 Precio<br>

        <input
        class="precio"
        value="${t.precio||''}"
        onchange="guardar('${t.numero}','precio',this.value)">

        <br><br>

        💰 Ganancia<br>

        <input
        value="${t.ganancia||''}"
        onchange="guardar('${t.numero}','ganancia',this.value)">

        <br><br>

        📝 Detalle

        <textarea
        onblur="guardar('${t.numero}','detalle',this.value)">
${t.detalle||''}</textarea>

        <div class="acciones-ticket">

          <button class="btn-secondary"
          onclick="marcarEntregado('${t.numero}')">
          ✔ Entregado
          </button>

          <button class="btn-success"
          onclick="listoWhatsApp(
          '${t.numero}',
          '${nombre}',
          '${t.telefono}',
          this.closest('.ticket').querySelector('.precio').value,
          '${detalle}'
          )">
          📲 WhatsApp
          </button>

          <button class="btn-danger"
          onclick="borrar('${t.numero}','${nombre}')">
          ❌ Eliminar
          </button>

        </div>

      </div>
      `
    })

  }catch(e){

    console.error(e)

    alert('Error conexión')
  }
}

// SOCKET
socket.on('actualizar',()=>{

  cargar()
})

// INIT
cargar()

</script>

</body>
</html
