<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Panel Admin</title>

<!-- SOCKET OPCIONAL -->
<script src="/socket.io/socket.io.js"></script>

<style>
body {
  font-family: Arial;
  background: #eef2f7;
  padding: 20px;
}

.ticket {
  background: white;
  padding: 12px;
  margin: 10px 0;
  border-radius: 10px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

input, select, button, textarea {
  margin: 4px;
  padding: 6px;
  border-radius: 6px;
  border: 1px solid #ccc;
}

button { cursor: pointer }
</style>
</head>

<body>

<h1>🧑‍💻 Panel Admin</h1>

<button onclick="modo='pendientes'; cargar()">Pendientes</button>
<button onclick="modo='todos'; cargar()">Todos</button>

<br><br>

<input id="busqueda" placeholder="Buscar..." oninput="cargar()">

<select id="filtroMes" onchange="cargar()">
  <option value="todos">Todos los meses</option>
</select>

<br><br>

<div id="resumen"></div>
<div id="lista"></div>

<script>

let modo = 'todos' // 🔥 IMPORTANTE
let socket = null

// SOCKET SEGURO
if (typeof io !== 'undefined') {
  socket = io()
  socket.on('actualizar', cargar)
} else {
  console.warn('Socket no disponible')
}

// ================= CARGAR
async function cargar() {

  console.log('Cargando tickets...')

  const res = await fetch('/tickets')

  if (!res.ok) {
    console.error('Error server:', await res.text())
    return
  }

  let data = await res.json()

  console.log('Tickets:', data)

  const lista = document.getElementById('lista')
  const resumen = document.getElementById('resumen')
  const select = document.getElementById('filtroMes')

  if (!lista || !resumen || !select) {
    console.error('Faltan elementos HTML')
    return
  }

  // ================= MESES
  let listaMeses = {}

  data.forEach(t => {
    if (!t.fecha) return
    const f = new Date(t.fecha)
    if (isNaN(f)) return

    const key = f.getFullYear() + '-' + (f.getMonth()+1)
    listaMeses[key] = f.toLocaleString('es-UY',{month:'long',year:'numeric'})
  })

  if (select.options.length <= 1) {
    Object.entries(listaMeses).reverse().forEach(([k,v])=>{
      const opt = document.createElement('option')
      opt.value = k
      opt.textContent = v
      select.appendChild(opt)
    })
  }

  const mesSel = select.value

  if (mesSel !== 'todos') {
    data = data.filter(t=>{
      const f = new Date(t.fecha)
      const key = f.getFullYear() + '-' + (f.getMonth()+1)
      return key === mesSel
    })
  }

  // ================= GANANCIAS
  let total = 0

  data.forEach(t=>{
    if (t.entregado === 'si') {
      total += parseFloat(t.ganancia) || 0
    }
  })

  resumen.innerHTML = `
    <div style="background:#fff;padding:10px;border-radius:10px">
      💰 Total ganado: <b>$${total}</b>
    </div>
  `

  // ================= FILTROS
  if (modo === 'pendientes') {
    data = data.filter(t => t.entregado !== 'si')
  }

  const filtro = (busqueda.value || '').toLowerCase()

  data = data.filter(t =>
    (t.nombre || '').toLowerCase().includes(filtro) ||
    (t.telefono || '').includes(filtro) ||
    (t.numero || '').toLowerCase().includes(filtro)
  )

  // ================= VACÍO
  if (data.length === 0) {
    lista.innerHTML = '<div>No hay tickets</div>'
    return
  }

  // ================= RENDER
  lista.innerHTML = ''

  data.reverse().forEach(t=>{
    lista.innerHTML += `
      <div class="ticket">
        <b>${t.numero}</b><br>
        ${t.nombre} (${t.telefono})<br>
        ${t.problema}<br>
        📅 ${formatearFecha(t.fecha)}<br><br>

        💲 Precio:
        <input value="${t.precio || ''}" onchange="guardar('${t.numero}','precio',this.value)">

        💰 Ganancia:
        <input value="${t.ganancia || ''}" onchange="guardar('${t.numero}','ganancia',this.value)">

        <br><br>

        📝 Detalle del trabajo :<br>
        <textarea onchange="guardar('${t.numero}','detalle',this.value)">${t.detalle || ''}</textarea>

        <br><br>

        Estado: ${t.estado}<br>
        Entregado: ${t.entregado}<br>

        ${t.garantiaFecha ? `
          <br>🛡️ Garantía: ${new Date(t.garantiaFecha).toLocaleDateString()}
          
        ` : ''}

        <br><br>

       <button onclick="estado('${t.numero}','proceso')">Proceso</button>

      <button onclick="listoWhatsApp('${t.numero}','${t.nombre}','${t.telefono}','${t.precio}')">
      ✔️ Listo + WhatsApp
      </button>

      <button onclick="marcarEntregado('${t.numero}')">📦 Entregado</button>
      <button onclick="borrar('${t.numero}')">❌</button>
      </div>
    `
  })
}
async function listoWhatsApp(id, nombre, telefono, precio) {

  let tel = (telefono || '').replace(/\D/g, '')

  if (tel.startsWith('0')) tel = '598' + tel.substring(1)
  if (!tel.startsWith('598')) tel = '598' + tel

  const mensaje =
`Hola ${nombre} 👋

Tu equipo ya está listo para retirar ✅

🧾 Ticket: ${id}
💲 Precio: ${precio || 'A confirmar'}

Favor coordinar retiro.`

  const url = "https://api.whatsapp.com/send?phone=" + tel + "&text=" + encodeURIComponent(mensaje)

  window.open(url, '_blank')

  await fetch('/ticket/'+id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ estado: 'listo' })
  })
}
// ================= FUNCIONES
async function listoWhatsApp(id, nombre, telefono, precio) {

  let tel = (telefono || '').replace(/\D/g, '')

  if (tel.startsWith('0')) tel = '598' + tel.substring(1)
  if (!tel.startsWith('598')) tel = '598' + tel

  const mensaje =
`Hola ${nombre} 👋

Tu equipo ya está listo para retirar ✅

🧾 Ticket: ${id}
💲 Precio: ${precio || 'A confirmar'}

Favor coordinar retiro.`

  const url = "https://api.whatsapp.com/send?phone=" + tel + "&text=" + encodeURIComponent(mensaje)

  window.open(url, '_blank')

  await fetch('/ticket/'+id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ estado: 'listo' })
  })
}

function formatearFecha(f) {
  const d = new Date(f)
  if (isNaN(d)) return 'Sin fecha'

  return d.toLocaleString('es-UY', {
    day: '2-digit',
    month: '2-digit',
    year: 'numeric',
    hour: '2-digit',
    minute: '2-digit'
  })
}

async function guardar(id,campo,valor){
  await fetch('/ticket/'+id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({[campo]:valor})
  })
}

async function estado(id,estado){
  await fetch('/ticket/'+id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({estado})
  })
}

async function marcarEntregado(id){
  await fetch('/ticket/'+id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({entregado:'si'})
  })
}

async function borrar(id){
  if (!confirm('Eliminar?')) return
  await fetch('/ticket/'+id,{method:'DELETE'})
}

// INIT
cargar()

</script>

</body>
</html>
