<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Tickets PRO</title>

<script src="/socket.io/socket.io.js"></script>

<style>
body {
  font-family: Arial;
  background:#eef2f7;
  padding:20px;
}

/* ===== TOPBAR ===== */
.topbar {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:15px;
  align-items:center;
}

input {
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
  max-width:240px;
}

button {
  padding:10px 14px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
}

.btn { background:#007bff; color:white; }
.btn-success { background:#28a745; color:white; }
.btn-danger { background:#dc3545; color:white; }
.btn-secondary { background:#6c757d; color:white; }

/* ===== PANEL PREMIUM ===== */
.panel {
  display:flex;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.card {
  background:white;
  padding:15px;
  border-radius:14px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
  flex:1;
  min-width:220px;
}

.card h4 {
  margin:0 0 10px 0;
}

.fila {
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.monto {
  font-size:22px;
  font-weight:bold;
}

.total {
  background:#f1f3f5;
  font-size:18px;
  text-align:center;
}

/* ===== TICKETS ===== */
.ticket {
  background:white;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

textarea {
  width:100%;
  padding:8px;
  border-radius:10px;
  border:1px solid #ccc;
  resize:none;
  overflow:hidden;
}

.estado-guardado {
  font-size:12px;
  color:#888;
}
</style>
</head>

<body>

<div class="topbar">
  <button class="btn-secondary" onclick="location.href='cotizaciones.html'">📊 Cotizaciones</button>
  <button class="btn-secondary" onclick="location.href='garantias.html'">🛡️ Garantías</button>

  <input id="busqueda" placeholder="🔍 Buscar..." oninput="cargar()">

  <button class="btn" onclick="modo='pendientes';cargar()">📋 Pendientes</button>
  <button class="btn-success" onclick="modo='todos';cargar()">✅ Todos</button>
</div>

<h2>🧾 Sistema De Tickets</h2>

<div id="resumen"></div>
<div id="lista"></div>

<script>

let modo = 'pendientes'
const socket = io()

let timerGuardar = {}
let escribiendo = false

function autoResize(el){
  el.style.height="auto"
  el.style.height=el.scrollHeight+"px"
}

function guardarDelay(id, el){
  escribiendo = true
  autoResize(el)

  const estado = document.getElementById("estado-"+id)
  if(estado) estado.innerText = "💾 Guardando..."

  clearTimeout(timerGuardar[id])

  timerGuardar[id] = setTimeout(async () => {
    await guardar(id,'detalle',el.value)
    if(estado) estado.innerText = "✅ Guardado"
    escribiendo = false
  }, 800)
}

async function cargar(){

  const res = await fetch('/tickets')
  let tickets = await res.json()

  const resCot = await fetch('/cotizaciones')
  let cotizaciones = await resCot.json()

  // ===== MESES =====
  let meses = {}
  tickets.forEach(t=>{
    if(!t.fecha)return
    const f=new Date(t.fecha)
    const key=f.getFullYear()+'-'+(f.getMonth()+1)
    meses[key]=f.toLocaleString('es-UY',{month:'long',year:'numeric'})
  })

  let mesesV={}
  cotizaciones.forEach(c=>{
    if(!c.fecha)return
    const f=new Date(c.fecha)
    const key=f.getFullYear()+'-'+(f.getMonth()+1)
    mesesV[key]=f.toLocaleString('es-UY',{month:'long',year:'numeric'})
  })

  let rep=0, ven=0

  tickets.forEach(t=>{
    if(t.entregado==='si') rep+=parseFloat(t.ganancia)||0
  })

  cotizaciones.forEach(c=>{
    if(c.confirmada==='si') ven+=parseFloat(c.ganancia)||0
  })

  // ===== PANEL PREMIUM =====
  document.getElementById('resumen').innerHTML = `
  <div class="panel">

    <div class="card">
      <h4>🔧 Reparaciones</h4>
      <div class="fila">
        <select id="filtroMes" onchange="cargar()">
          <option value="todos">Todos</option>
          ${Object.entries(meses).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}
        </select>
        <span class="monto">$${rep}</span>
      </div>
    </div>

    <div class="card">
      <h4>🛒 Ventas</h4>
      <div class="fila">
        <select id="filtroMesVentas" onchange="cargar()">
          <option value="todos">Todos</option>
          ${Object.entries(mesesV).map(([k,v])=>`<option value="${k}">${v}</option>`).join('')}
        </select>
        <span class="monto">$${ven}</span>
      </div>
    </div>

    <div class="card total">
      🧮 Total: $${rep + ven}
    </div>

  </div>
  `

  if(modo==='pendientes'){
    tickets=tickets.filter(t=>t.entregado!=='si')
  }

  const filtro=busqueda.value.toLowerCase()

  tickets=tickets.filter(t=>
    (t.nombre||'').toLowerCase().includes(filtro) ||
    (t.telefono||'').includes(filtro) ||
    (t.numero||'').toLowerCase().includes(filtro)
  )

  lista.innerHTML=''

  tickets.reverse().forEach(t=>{
    lista.innerHTML+=`
    <div class="ticket">
      <b>${t.numero}</b><br>
      ${t.nombre} (${t.telefono})<br>
      ${t.problema}<br>
      📅 ${new Date(t.fecha).toLocaleString('es-UY')}<br><br>

      💲 Precio:
      <input value="${t.precio||''}" onchange="guardar('${t.numero}','precio',this.value)">

      💰 Ganancia:
      <input value="${t.ganancia||''}" onchange="guardar('${t.numero}','ganancia',this.value)">

      <br><br>

      📝 Detalle:
      <textarea oninput="guardarDelay('${t.numero}',this)">${(t.detalle||'').trim()}</textarea>

      <div class="estado-guardado" id="estado-${t.numero}"></div>

      <br>

      <button class="btn-success"
      onclick="listoWhatsApp('${t.numero}','${t.nombre}','${t.telefono}','${t.precio}')">
      ✔️ Listo + WhatsApp</button>

      <button class="btn-secondary"
      onclick="marcarEntregado('${t.numero}')">📦 Entregado</button>

      <button class="btn-danger"
      onclick="borrar('${t.numero}')">❌</button>
    </div>
    `
  })
}

async function guardar(id,campo,valor){
  await fetch('/ticket/'+id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({[campo]:valor})
  })
}

async function marcarEntregado(id){
  await fetch('/ticket/'+id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({entregado:'si'})
  })
}

async function borrar(id){
  if(!confirm("Eliminar?"))return
  await fetch('/ticket/'+id,{method:'DELETE'})
}

async function listoWhatsApp(id,nombre,telefono,precio){

  let tel=telefono.replace(/\D/g,'')

  if(tel.startsWith('0')) tel='598'+tel.substring(1)
  if(!tel.startsWith('598')) tel='598'+tel

  const res=await fetch('/tickets')
  const data=await res.json()
  const t=data.find(x=>x.numero===id)

  const fecha=new Date(t.fecha).toLocaleString('es-UY')

  const msg=`Hola ${nombre} 👋

Tu equipo está listo ✅

📅 ${fecha}
🧾 ${id}
💲 ${precio||'A confirmar'}`

  window.location.href="https://api.whatsapp.com/send?phone="+tel+"&text="+encodeURIComponent(msg)

  await guardar(id,'estado','listo')
}

socket.on('actualizar',()=>{
  if(!escribiendo) cargar()
})

cargar()

</script>

</body>
</html>
