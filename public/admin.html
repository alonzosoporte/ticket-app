<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Tickets PRO</title>

<script src="/socket.io/socket.io.js"></script>

<style>
body {
  font-family: Arial;
  background:#eef2f7;
  padding:20px;
}

/* 🔥 TOPBAR */
.topbar {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:15px;
  align-items:center;
}

/* 🔍 BUSCADOR */
input {
  padding:8px 10px;
  border-radius:10px;
  border:1px solid #ccc;
  width:100%;
  max-width:240px;
  outline:none;
  transition:0.2s;
}

input:focus {
  border-color:#007bff;
  box-shadow:0 0 0 2px rgba(0,123,255,0.2);
}

/* 🎛️ SELECT */
select {
  padding:8px;
  border-radius:10px;
  border:1px solid #ccc;
}

/* 🔥 BOTONES */
button {
  padding:8px 12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
  transition:0.2s;
}

.btn { background:#007bff; color:white; }
.btn:hover { background:#0056b3; }

.btn-success { background:#28a745; color:white; }
.btn-success:hover { background:#1e7e34; }

.btn-danger { background:#dc3545; color:white; }
.btn-danger:hover { background:#b02a37; }

.btn-secondary { background:#6c757d; color:white; }
.btn-secondary:hover { background:#545b62; }

/* 🧾 CARDS */
.ticket {
  background:white;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
  transition:0.2s;
}

.ticket:hover {
  transform:scale(1.01);
}

.ticket input, .ticket textarea {
  width:100%;
}

/* 📊 RESUMEN */
.resumen {
  background:#fff;
  padding:15px;
  border-radius:12px;
  margin-bottom:15px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}
</style>
</head>

<body>


<!-- 🔥 TOPBAR -->
<div class="topbar">

  <button class="btn-secondary" onclick="irCotizaciones()">📊 Cotizaciones</button>
  <button class="btn-secondary" onclick="irGarantias()">🛡️ Garantías</button>

  <input id="busqueda" placeholder="🔍 Buscar cliente, teléfono o ticket..." oninput="cargar()">

  <select id="filtroMes" onchange="cargar()">
    <option value="todos">📅 Todos</option>
  </select>

  <button class="btn" onclick="modo='pendientes';cargar()">📋 Pendientes</button>
  <button class="btn-success" onclick="modo='todos';cargar()">✅ Todos</button>

</div>
<h2>🧾 Sistema De Tickets</h2>
<div id="resumen"></div>
<div id="lista"></div>

<script>

let modo = 'pendientes'
const socket = io()

function irGarantias() {
  window.location.href = 'garantias.html'
}

function irCotizaciones() {
  window.location.href = 'cotizaciones.html'
}

// ================= CARGAR =================
async function cargar() {

  const res = await fetch('/tickets')
  let data = await res.json()

  // ================= FILTRO MES =================
  let listaMeses = {}

  data.forEach(t => {
    if (!t.fecha) return

    const fecha = new Date(t.fecha)
    if (isNaN(fecha)) return

    const key = fecha.getFullYear() + '-' + (fecha.getMonth() + 1)
    listaMeses[key] = fecha.toLocaleString('es-UY', { month: 'long', year: 'numeric' })
  })

  const select = document.getElementById('filtroMes')

  if (select.options.length <= 1) {
    Object.entries(listaMeses).reverse().forEach(([key, texto]) => {
      const opt = document.createElement('option')
      opt.value = key
      opt.textContent = texto
      select.appendChild(opt)
    })
  }

  const hoy = new Date()
  const mesActualKey = hoy.getFullYear() + '-' + (hoy.getMonth() + 1)

  if (select.value === 'todos') {
    select.value = mesActualKey
  }

  const mesSeleccionado = select.value

  if (mesSeleccionado !== 'todos') {
    data = data.filter(t => {
      const fecha = new Date(t.fecha)
      if (isNaN(fecha)) return false

      const key = fecha.getFullYear() + '-' + (fecha.getMonth() + 1)
      return key === mesSeleccionado
    })
  }

  // ================= RESUMEN =================
  let meses = {}
  let totalGeneral = 0

  data.forEach(t => {
    if (!t.fecha) return

    const fecha = new Date(t.fecha)
    const mes = fecha.toLocaleString('es-UY', { month: 'long', year: 'numeric' })

    const gan = t.entregado === 'si' ? (parseFloat(t.ganancia) || 0) : 0

    if (!meses[mes]) meses[mes] = 0

    meses[mes] += gan
    totalGeneral += gan
  })

  let htmlResumen = `<div class="resumen"><b>💰 Resumen de Ganancias</b><br><br>`

  Object.entries(meses).reverse().forEach(([mes, total]) => {
    htmlResumen += `📅 ${mes}: $${total}<br>`
  })

  htmlResumen += `<br><b>🧮 TOTAL GENERAL: $${totalGeneral}</b></div>`

  document.getElementById('resumen').innerHTML = htmlResumen

  // ================= FILTRO =================
  if (modo === 'pendientes') {
    data = data.filter(t => t.entregado !== 'si')
  }

  const filtro = document.getElementById('busqueda').value.toLowerCase()

  data = data.filter(t =>
    (t.nombre || '').toLowerCase().includes(filtro) ||
    (t.telefono || '').includes(filtro) ||
    (t.numero || '').toLowerCase().includes(filtro)
  )

  const lista = document.getElementById('lista')
  lista.innerHTML = ''

  data.reverse().forEach(t => {

    const garantiaVencida = t.garantiaFecha && new Date(t.garantiaFecha) < new Date()

    lista.innerHTML += `
      <div class="ticket">

        <b>${t.numero}</b><br>
        ${t.nombre} (${t.telefono})<br>
        ${t.problema}<br>
        📅 ${formatearFecha(t.fecha)}<br>

        ${t.garantiaFecha ? `
          🛡️ Garantía:
          <span style="color:${garantiaVencida ? 'red' : 'green'}">
            ${formatearFecha(t.garantiaFecha)}
            ${garantiaVencida ? ' (VENCIDA)' : ''}
          </span><br>
        ` : ''}

        <br>

        💲 Precio:
        <input value="${t.precio || ''}" onchange="guardar('${t.numero}','precio',this.value)">

        💰 Ganancia:
        <input value="${t.ganancia || ''}" onchange="guardar('${t.numero}','ganancia',this.value)">

        <br><br>

        📝 Detalle:<br>
        <textarea style="height:60px"
        onchange="guardar('${t.numero}','detalle',this.value)">${t.detalle || ''}</textarea>

        <br><br>

        Estado: ${t.estado}<br>
        Entregado: ${t.entregado}<br><br>

        <button class="btn" onclick="estado('${t.numero}','proceso')">🔄 Proceso</button>

        <button class="btn-success"
        onclick="listoWhatsApp('${t.numero}','${t.nombre}','${t.telefono}','${t.precio}')">
        ✔ Listo + WhatsApp</button>

        <button class="btn-secondary" onclick="marcarEntregado('${t.numero}')">📦 Entregado</button>

        <button class="btn-danger" onclick="borrar('${t.numero}')">❌</button>

      </div>
    `
  })
}

// ================= FUNCIONES =================

function formatearFecha(f) {
  const fecha = new Date(f)
  if (isNaN(fecha)) return f || 'Sin fecha'
  return fecha.toLocaleString('es-UY')
}

async function guardar(id, campo, valor) {
  await fetch('/ticket/'+id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ [campo]: valor })
  })
}

async function estado(id, estado) {
  await fetch('/ticket/'+id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ estado })
  })
}

async function marcarEntregado(id) {
  await fetch('/ticket/'+id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ entregado: 'si' })
  })
}

async function borrar(id) {
  if (!confirm("¿Seguro que querés borrar este ticket?")) return
  await fetch('/ticket/'+id,{method:'DELETE'})
}

async function listoWhatsApp(id, nombre, telefono, precio){

  let tel = telefono.replace(/\D/g,'')

  if(tel.startsWith('0')) tel='598'+tel.substring(1)
  if(!tel.startsWith('598')) tel='598'+tel

  // 🔥 TRAER DATOS DEL TICKET
  const res = await fetch('/tickets')
  const data = await res.json()

  const t = data.find(x => x.numero === id)

  // 🔥 FORMATEAR FECHA
  const fecha = new Date(t.fecha).toLocaleString('es-UY')

  const mensaje =
`Hola ${nombre} 👋

Tu equipo ya está listo para retirar ✅

📅 Fecha solicitud: ${fecha}

🧾 Ticket: ${id}
💲 Precio: ${precio || 'A confirmar'}

Favor coordinar para retirarlo.`

  const url="https://api.whatsapp.com/send?phone="+tel+"&text="+encodeURIComponent(mensaje)

  window.location.href=url

  await fetch('/ticket/'+id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({estado:'listo'})
  })
}

// ================= SOCKET =================
socket.on('actualizar', cargar)

cargar()

</script>

</body>
</html>
