<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Tickets PRO</title>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
  font-family: Arial;
  background:#eef2f7;
  padding:20px;
}

.topbar {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  margin-bottom:15px;
  align-items:center;
}

input {
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
}

button {
  padding:10px 14px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
}

.btn { background:#007bff; color:white; }
.btn-success { background:#28a745; color:white; }
.btn-danger { background:#dc3545; color:white; }
.btn-secondary { background:#6c757d; color:white; }

.panel {
  display:flex;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.card {
  background:white;
  padding:15px;
  border-radius:14px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
  flex:1;
  min-width:220px;
}

.monto {
  font-size:22px;
  font-weight:bold;
}

.total {
  background:#f1f3f5;
  text-align:center;
  font-size:18px;
}

.ticket {
  background:white;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

textarea {
  width:100%;
  padding:8px;
  border-radius:10px;
  border:1px solid #ccc;
  resize:none;
}

.estado-guardado {
  font-size:12px;
  color:#888;
}
</style>
</head>

<body>

<div class="topbar">
  <button class="btn-secondary" onclick="location.href='cotizaciones.html'">📊 Cotizaciones</button>
  <button class="btn-secondary" onclick="location.href='garantias.html'">🛡️ Garantías</button>

  <input id="busqueda" placeholder="🔍 Buscar..." oninput="cargar()">

  <button class="btn" onclick="modo='pendientes';cargar()">📋 Pendientes</button>
  <button class="btn-success" onclick="modo='todos';cargar()">✅ Todos</button>
</div>

<h2>🧾 Sistema De Tickets</h2>

<div id="resumen"></div>
<div id="lista"></div>

<script>

let modo = 'pendientes'
const socket = io()

let timerGuardar = {}
let escribiendo = false

// ===== PDF PRO =====
async function descargarPDF(numero){

  const res = await fetch('/tickets')
  const data = await res.json()

  const t = data.find(x => x.numero === numero)
  if(!t) return alert('No encontrado')

  const { jsPDF } = window.jspdf
  const doc = new jsPDF()

  const img = new Image()
  img.src = '/logo.png'

  img.onload = () => {

    // 🔵 HEADER
    doc.setFillColor(0,123,255)
    doc.rect(0,0,210,30,'F')

    doc.addImage(img,'PNG',10,5,30,20)

    doc.setTextColor(255,255,255)
    doc.setFontSize(16)
    doc.text("FACTURA", 160, 18)

    doc.setTextColor(0,0,0)

    let y = 45

    // 📄 INFO
    doc.setFontSize(12)
    doc.text("N°: " + t.numero, 10, y)
    doc.text("Fecha: " + new Date().toLocaleDateString(), 140, y)

    y+=10

    doc.text("Cliente: " + (t.nombre||''), 10, y)
    y+=8

    doc.text("Teléfono: " + (t.telefono||''), 10, y)
    y+=15

    // 🔧 PROBLEMA
    doc.setFontSize(13)
    doc.text("Problema:",10,y)
    y+=8
    doc.setFontSize(11)
    doc.text(t.problema||'',10,y,{maxWidth:180})
    y+=15

    // 📝 DESCRIPCIÓN
    doc.setFontSize(13)
    doc.text("Detalle técnico:",10,y)
    y+=8
    doc.setFontSize(11)
    doc.text(t.detalle||'',10,y,{maxWidth:180})
    y+=20

    // 💰 TOTAL
    doc.setFillColor(240,240,240)
    doc.rect(10,y,190,15,'F')

    doc.setFontSize(14)
    doc.text("TOTAL: $" + (t.precio||0), 140, y+10)

    doc.save("Factura_"+t.numero+".pdf")
  }
}

// ===== GUARDAR =====
async function guardar(id,campo,valor){
  await fetch('/ticket/'+id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({[campo]:valor})
  })
}

async function marcarEntregado(id){
  await fetch('/ticket/'+id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({entregado:'si'})
  })
}

async function borrar(id){
  if(!confirm("Eliminar?"))return
  await fetch('/ticket/'+id,{method:'DELETE'})
}

// ===== WHATSAPP =====
async function listoWhatsApp(id,nombre,telefono,precio){

  let tel=telefono.replace(/\D/g,'')

  if(tel.startsWith('0')) tel='598'+tel.substring(1)
  if(!tel.startsWith('598')) tel='598'+tel

  const msg=`Hola ${nombre} 👋

Tu equipo está listo ✅

🧾 ${id}
💲 ${precio||'A confirmar'}`

  window.location.href="https://api.whatsapp.com/send?phone="+tel+"&text="+encodeURIComponent(msg)

  await guardar(id,'estado','listo')
}

// ===== CARGAR =====
async function cargar(){

  const res = await fetch('/tickets')
  let tickets = await res.json()

  const resCot = await fetch('/cotizaciones')
  let cotizaciones = await resCot.json()

  const hoy = new Date()
  const mesActualKey = hoy.getFullYear() + '-' + (hoy.getMonth() + 1)
  const nombreMesActual = hoy.toLocaleString('es-UY',{month:'long',year:'numeric'})

  let meses = {}
  tickets.forEach(t=>{
    if(!t.fecha) return
    const f=new Date(t.fecha)
    const key=f.getFullYear()+'-'+(f.getMonth()+1)
    meses[key]=f.toLocaleString('es-UY',{month:'long',year:'numeric'})
  })

  let mesesV={}
  cotizaciones.forEach(c=>{
    if(!c.fecha) return
    const f=new Date(c.fecha)
    const key=f.getFullYear()+'-'+(f.getMonth()+1)
    mesesV[key]=f.toLocaleString('es-UY',{month:'long',year:'numeric'})
  })

  const mesSeleccionado = document.getElementById('filtroMes')?.value || mesActualKey
  const mesVentasSeleccionado = document.getElementById('filtroMesVentas')?.value || mesActualKey

  if(mesSeleccionado !== 'todos'){
    tickets = tickets.filter(t=>{
      const f=new Date(t.fecha)
      return f.getFullYear()+'-'+(f.getMonth()+1)===mesSeleccionado
    })
  }

  if(mesVentasSeleccionado !== 'todos'){
    cotizaciones = cotizaciones.filter(c=>{
      const f=new Date(c.fecha)
      return f.getFullYear()+'-'+(f.getMonth()+1)===mesVentasSeleccionado
    })
  }

  let rep=0, ven=0

  tickets.forEach(t=>{
    if(t.entregado==='si') rep+=parseFloat(t.ganancia)||0
  })

  cotizaciones.forEach(c=>{
    if(c.confirmada === 'si'){
      const costo = parseFloat(c.costoProveedor) || 0
      const precio = parseFloat(c.precioCliente) || 0
      ven += (precio - costo)
    }
  })

  // 🔥 RESUMEN (LO QUE TE FALTABA)
  document.getElementById('resumen').innerHTML = `
  <div class="panel">

    <div class="card">
      <b>🔧 Reparaciones</b><br><br>
      <select id="filtroMes" onchange="cargar()">
        <option value="todos">Todos</option>
        ${Object.entries(meses).map(([k,v])=>`
          <option value="${k}" ${k===mesSeleccionado?'selected':''}>${v}</option>
        `).join('')}
      </select>
      <div class="monto">$${rep}</div>
    </div>

    <div class="card">
      <b>🛒 Ventas</b><br><br>
      <select id="filtroMesVentas" onchange="cargar()">
        <option value="${mesActualKey}">🛒 ${nombreMesActual}</option>
        <option value="todos">📋 Todas</option>
        ${Object.entries(mesesV).map(([k,v])=>`
          <option value="${k}" ${k===mesVentasSeleccionado?'selected':''}>${v}</option>
        `).join('')}
      </select>
      <div class="monto">$${ven}</div>
    </div>

    <div class="card total">
      <b>Total: $${rep+ven}</b>
    </div>

  </div>
  `

  // 🔽 FILTROS
  if(modo==='pendientes'){
    tickets=tickets.filter(t=>t.entregado!=='si')
  }

  const filtro=busqueda.value.toLowerCase()

  tickets=tickets.filter(t=>
    (t.nombre||'').toLowerCase().includes(filtro) ||
    (t.telefono||'').includes(filtro)
  )

  // 🔽 LISTA
  lista.innerHTML=''

  tickets.reverse().forEach(t=>{
    lista.innerHTML+=`
    <div class="ticket">

      <b>${t.numero}</b><br>
      ${t.nombre} (${t.telefono})<br>
      ${t.problema}<br>
      📅 ${new Date(t.fecha).toLocaleString('es-UY')}<br><br>

      💲 Precio:
      <input value="${t.precio||''}" onchange="guardar('${t.numero}','precio',this.value)">

      💰 Ganancia:
      <input value="${t.ganancia||''}" onchange="guardar('${t.numero}','ganancia',this.value)">

      <br><br>

      📝 Detalle:
      <textarea oninput="guardar('${t.numero}','detalle',this.value)">${(t.detalle||'')}</textarea>

      <br><br>

      <button class="btn-success"
      onclick="listoWhatsApp('${t.numero}','${t.nombre}','${t.telefono}','${t.precio}')">
      ✔️ Listo + WhatsApp</button>

      <button class="btn-secondary"
      onclick="marcarEntregado('${t.numero}')">📦 Entregado</button>

      <button class="btn"
      onclick="descargarPDF('${t.numero}')">📄 PDF</button>

      <button class="btn-danger"
      onclick="borrar('${t.numero}')">❌</button>

    </div>
    `
  })
}

// SOCKET
socket.on('actualizar',()=>{
  if(!escribiendo) cargar()
})

// INIT
cargar()

</script>

</body>
</html>
