<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Tickets</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://ticket-pro-xmhs.onrender.com/socket.io/socket.io.js"></script>

<style>
body { font-family: Arial; background:#eef2f7; padding:15px; }
button {
  padding:8px 10px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.btn { background:#003366; color:white }
.btn-success { background:#28a745; color:white }
.btn-danger { background:#dc3545; color:white }
.btn-secondary { background:#6c757d; color:white }

.ticket {
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

.ticket {
  background:white;
  padding:10px;
  margin:10px 0;
  border-radius:10px;
}

button {
  padding:8px;
  margin:5px;
}
</style>
</head>

<body>

<h2>Admin Tickets</h2>

<input id="busqueda" placeholder="Buscar..." oninput="cargar()">
<button onclick="modo='pendientes';cargar()">Pendientes</button>
<button onclick="modo='todos';cargar()">Todos</button>

<div id="lista"></div>

<script>
const API = 'https://ticket-pro-xmhs.onrender.com'
const TOKEN = localStorage.getItem('token')

if(!TOKEN){
  location.href = 'login.html'
}

const socket = io(API)
let modo = 'pendientes'

// FETCH OK
function fetchAuth(url, options = {}){
  return fetch(API + url, {
    ...options,
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer ' + TOKEN,
      ...(options.headers || {})
    }
  })
}

// CRUD
async function guardar(id,campo,valor){
  await fetchAuth('/ticket/'+id,{
    method:'PUT',
    body: JSON.stringify({[campo]:valor})
  })
}

async function borrar(id){
  if(!confirm("Eliminar?")) return
  await fetchAuth('/ticket/'+id,{method:'DELETE'})
}
async function marcarEntregado(id){
  await fetchAuth('/ticket/'+id,{
    method:'PUT',
    body: JSON.stringify({entregado:'si'})
  })
}

async function listoWhatsApp(id,nombre,telefono,precio){

  let tel = (telefono||'').replace(/\D/g,'')

  if(tel.startsWith('0')) tel='598'+tel.substring(1)
  if(!tel.startsWith('598')) tel='598'+tel

  const msg = `Hola ${nombre} 👋
Tu equipo está listo ✅
🧾 ${id}
💲 ${precio||'A confirmar'}`

  window.open(`https://api.whatsapp.com/send?phone=${tel}&text=${encodeURIComponent(msg)}`)
}
// CARGAR
async function cargar(){

  try{

    const res = await fetchAuth('/tickets')
    const tickets = await res.json()

    let filtrados = tickets

    if(modo==='pendientes'){
      filtrados = tickets.filter(t=>t.entregado!=='si')
    }

    const filtro = document.getElementById('busqueda').value.toLowerCase()

    filtrados = filtrados.filter(t=>
      (t.nombre||'').toLowerCase().includes(filtro)
    )

    lista.innerHTML=''

    filtrados.forEach(t=>{

      const nombre = (t.nombre || '').replace(/'/g,"")

      lista.innerHTML += `
      <div class="ticket">
        <b>${t.numero}</b><br>
        ${nombre}<br>

        <input value="${t.precio||''}" 
        onchange="guardar('${t.numero}','precio',this.value)">

        <textarea 
        onblur="guardar('${t.numero}','detalle',this.value)">
${t.detalle||''}</textarea>

        <br>

      <button class="btn-secondary" onclick="marcarEntregado('${t.numero}')">
      Entregado
      </button>

      <button class="btn-success"
      onclick="listoWhatsApp('${t.numero}','${nombre}','${t.telefono}','${t.precio}')">
      WhatsApp
      </button>

      <button class="btn-danger" onclick="borrar('${t.numero}')">
      Eliminar
      </button>
      </div>
      `
    })

  }catch(e){
    console.error(e)
    alert('Error conexión')
  }
}

// SOCKET
socket.on('actualizar', cargar)

// INIT
cargar()

</script>

</body>
</html>
