<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Tickets PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://ticket-pro-xmhs.onrender.com/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
  font-family:Arial;
  background:#eef2f7;
  padding:15px;
}

.nav-top{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.header-pro{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  background:white;
  padding:12px;
  border-radius:14px;
  margin-bottom:20px;
  border-left:5px solid #003366;
}

input,select,textarea{
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
  box-sizing:border-box;
}

button{
  padding:10px 12px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.btn{
  background:#003366;
  color:white;
}

.btn-success{
  background:#28a745;
  color:white;
}

.btn-danger{
  background:#dc3545;
  color:white;
}

.btn-secondary{
  background:#6c757d;
  color:white;
}

.btn-pdf{
  background:#7688A1;
  color:white;
}

.panel{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.card{
  background:white;
  padding:12px;
  border-radius:12px;
  flex:1;
  font-weight:bold;
  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.ticket{
  background:white;
  padding:15px;
  margin-bottom:15px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.ticket-top{
  margin-bottom:10px;
  line-height:1.7;
}

textarea{
  width:100%;
  min-height:100px;
  resize:vertical;
  margin-top:10px;
}

.acciones-ticket{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

.datos-ticket{
  margin-top:15px;
}

.fila-superior,
.fila-inferior{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

.fila-superior{
  margin-bottom:15px;
  align-items:flex-end;
}

.campo-box{
  min-width:180px;
}

.campo-box select,
.campo-box input{
  width:100%;
}

.toggle-detalle{
  margin-top:10px;
  background:#f1f1f1;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.detalle-box{
  display:none;
  margin-top:10px;
}

.mostrar{
  display:block;
}

@media(max-width:700px){

  .fila-superior,
  .fila-inferior{
    flex-direction:column;
  }

  .campo-box{
    width:100%;
  }

  .acciones-ticket{
    flex-direction:column;
  }

  button{
    width:100%;
  }
}

</style>
</head>

<body>

<div class="nav-top">

  <button class="btn-secondary"
  onclick="location.href='cotizaciones.html'">
  📊 Cotizaciones
  </button>

  <button class="btn-secondary"
  onclick="location.href='garantias.html'">
  🛡️ Garantías
  </button>

</div>

<div class="header-pro">

  <input 
  id="busqueda"
  placeholder="🔍 Buscar..."
  onblur="cargar()">

  <button class="btn"
  onclick="modo='pendientes';cargar()">
  Pendientes
  </button>

  <button class="btn-success"
  onclick="modo='todos';cargar()">
  Todos
  </button>

  <button class="btn-danger"
  onclick="logout()">
  Salir
  </button>

</div>

<div id="resumen">

  <div class="panel">

    <div class="card">

      🔧 Reparaciones<br><br>

      <select id="mesRep" onchange="cargar()">
        <option value="todos">Todos los meses</option>
      </select>

      <div id="totalRep" style="margin-top:10px">
      $0
      </div>

    </div>

    <div class="card">

      🛒 Ventas<br><br>

      <select id="mesVen" onchange="cargar()">
        <option value="todos">Todos los meses</option>
      </select>

      <div id="totalVen" style="margin-top:10px">
      $0
      </div>

    </div>

    <div class="card">

      💰 TOTAL GENERAL<br><br>

      <div id="totalGeneral"
      style="font-size:22px">
      $0
      </div>

    </div>

  </div>

</div>

<div id="lista"></div>

<script>

const TOKEN = localStorage.getItem('token')

if(!TOKEN){
  location.href='login.html'
}

const API='https://ticket-pro-xmhs.onrender.com'

const socket = io(API,{
  transports:['websocket','polling']
})

socket.off('actualizar')

let timeoutRecarga
let ultimaEdicion = 0

socket.on('actualizar',()=>{

  clearTimeout(timeoutRecarga)

  timeoutRecarga = setTimeout(()=>{

    const activo = document.activeElement

    const escribiendoAhora =
      activo &&
      (
        activo.tagName === 'INPUT' ||
        activo.tagName === 'TEXTAREA' ||
        activo.tagName === 'SELECT'
      )

    const hacePocoEdito =
      Date.now() - ultimaEdicion < 3000

    if(escribiendoAhora || hacePocoEdito){
      return
    }

    cargar()

  },2500)
})

let modo='pendientes'

function logout(){

  localStorage.removeItem('token')

  location.href='login.html'
}

function fetchAuth(url,options={}){

  return fetch(API+url,{

    ...options,

    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer '+TOKEN
    }
  })
}

function toggleDetalle(id){

  const box =
  document.getElementById('detalle-'+id)

  box.classList.toggle('mostrar')
}

let timeoutGuardar = {}

async function guardar(id,campo,valor){

  ultimaEdicion = Date.now()

  clearTimeout(timeoutGuardar[id+campo])

  timeoutGuardar[id+campo] = setTimeout(async()=>{

    try{

      await fetchAuth('/ticket/'+id,{

        method:'PUT',

        body:JSON.stringify({
          [campo]:valor
        })
      })

    }catch(err){

      console.log(err)
    }

  },1200)
}

async function marcarEntregado(id){

  await fetchAuth('/ticket/'+id,{

    method:'PUT',

    body:JSON.stringify({
      entregado:'si'
    })
  })

  cargar()
}

async function borrar(id,nombre){

  if(!confirm(`¿Eliminar ticket de ${nombre}?`)){
    return
  }

  await fetchAuth('/ticket/'+id,{
    method:'DELETE'
  })

  cargar()
}

function listoWhatsApp(
  id,
  nombre,
  telefono,
  precio,
  detalle
){

  let tel=
  (telefono||'').replace(/\D/g,'')

  if(tel.startsWith('0')){
    tel='598'+tel.substring(1)
  }

  if(!tel.startsWith('598')){
    tel='598'+tel
  }

const msg=`Hola ${nombre} 👋

El servicio con número de Ticket ${id} ha sido realizado ✅

📝 Detalle:
${detalle || 'Servicio realizado correctamente'}

💲 Precio: ${precio || 'A confirmar'}

🏦 Transferencia bancaria BROU:
CA 001120656-00002

También podés pagar al momento de retirar el equipo.

Gracias por confiar en nuestro servicio.`

  window.open(
    `https://api.whatsapp.com/send?phone=${tel}&text=${encodeURIComponent(msg)}`
  )
}

async function generarGarantia(
  numero,
  nombre,
  telefono,
  garantia
){

  const { jsPDF } = window.jspdf

  const doc = new jsPDF('p','mm','a4')

  doc.setFillColor(245,247,250)
  doc.rect(0,0,210,297,'F')

  doc.setFillColor(118,136,161)
  doc.rect(0,0,210,18,'F')

  doc.setTextColor(255,255,255)
  doc.setFontSize(17)
  doc.setFont('helvetica','bold')

  doc.text(
    'GARANTÍA ELECTRÓNICA',
    105,
    11,
    { align:'center' }
  )

  const logo = new Image()

  logo.src = 'logo.png'

  logo.onload = () => {

    doc.addImage(
      logo,
      'PNG',
      55,
      22,
      100,
      45
    )

    doc.setTextColor(15,25,45)

    doc.setFontSize(28)

    doc.setFont(
      'helvetica',
      'bold'
    )

    doc.text(
      'GARANTÍA ELECTRÓNICA',
      105,
      92,
      { align:'center' }
    )

    doc.save(
      `garantia-${nombre}.pdf`
    )
  }
}

async function cargar(){

  try{

    const res =
    await fetchAuth('/tickets')

    const tickets =
    await res.json()

    let cotizaciones=[]

    try{

      const resCot =
      await fetchAuth('/cotizaciones')

      cotizaciones =
      await resCot.json()

      if(!Array.isArray(cotizaciones)){
        cotizaciones=[]
      }

    }catch(err){

      console.log(err)
    }

    const mesesTexto = [
      'Enero','Febrero','Marzo','Abril',
      'Mayo','Junio','Julio','Agosto',
      'Septiembre','Octubre','Noviembre','Diciembre'
    ]

    const ahora = new Date()

    const mesActual =
    `${ahora.getFullYear()}-${ahora.getMonth()}`

    const selectRep =
    document.getElementById('mesRep')

    const selectVen =
    document.getElementById('mesVen')

    if(selectRep.options.length <= 1){

      const meses = new Set()

      tickets.forEach(t=>{

        if(!t.fecha) return

        const f = new Date(t.fecha)

        meses.add(
          `${f.getFullYear()}-${f.getMonth()}`
        )
      })

      cotizaciones.forEach(c=>{

        if(!c.fecha) return

        const f = new Date(c.fecha)

        meses.add(
          `${f.getFullYear()}-${f.getMonth()}`
        )
      })

      const ordenados =
      [...meses].sort().reverse()

      ordenados.forEach(valor=>{

        const [anio,mes] =
        valor.split('-')

        const texto =
        `${mesesTexto[mes]} ${anio}`

        selectRep.innerHTML +=
        `<option value="${valor}">
        ${texto}
        </option>`

        selectVen.innerHTML +=
        `<option value="${valor}">
        ${texto}
        </option>`
      })

      selectRep.value = mesActual
      selectVen.value = mesActual
    }

    let rep = 0
    let ven = 0

    tickets.forEach(t=>{

      if(t.entregado==='si'){
        rep += parseFloat(t.ganancia)||0
      }
    })

    cotizaciones.forEach(c=>{

      if(c.confirmada==='si'){
        ven += Number(c.ganancia||0)
      }
    })

    document.getElementById('totalRep')
    .innerHTML = `$${rep}`

    document.getElementById('totalVen')
    .innerHTML = `$${ven}`

    document.getElementById('totalGeneral')
    .innerHTML = `$${rep + ven}`

    let filtrados=[...tickets]

    if(modo==='pendientes'){

      filtrados=
      filtrados.filter(
        t=>t.entregado!=='si'
      )
    }

    const htmlTickets = filtrados.map(t=>{

      const nombre=
      (t.nombre||'')
      .replace(/'/g,'')

      const fecha=
      new Date(t.fecha)
      .toLocaleDateString('es-UY')

      return `

      <div class="ticket">

        <div class="ticket-top">

          📅 ${fecha}<br>

          🧾 <b>
          Ticket ${t.numero}
          </b><br>

          👤 ${nombre}<br>

          📱 ${t.telefono}<br><br>

          🔧 ${t.problema}

        </div>

        <div class="datos-ticket">

          <div class="fila-superior">

            <div class="campo-box">
              👨 Técnico<br>

              <select
              onchange="guardar('${t.numero}','tecnico',this.value)">

                <option value="">Sin seleccionar</option>

                <option value="PCR"
                ${t.tecnico==='PCR'?'selected':''}>
                PCR
                </option>

                <option value="Javier"
                ${t.tecnico==='Javier'?'selected':''}>
                Javier
                </option>

                <option value="Mauricio"
                ${t.tecnico==='Mauricio'?'selected':''}>
                Mauricio
                </option>

                <option value="Electroshop"
                ${t.tecnico==='Electroshop'?'selected':''}>
                Electroshop
                </option>

              </select>
            </div>

            <div class="campo-box">
              🛡️ Garantía<br>

              <select
              onchange="guardar('${t.numero}','garantiaServicio',this.value)">

                <option value="">Sin garantía</option>

                <option value="3 meses"
                ${t.garantiaServicio==='3 meses'?'selected':''}>
                3 meses
                </option>

                <option value="6 meses"
                ${t.garantiaServicio==='6 meses'?'selected':''}>
                6 meses
                </option>

              </select>
            </div>

            <div class="campo-box">

              <button
              class="btn-pdf"
              onclick="generarGarantia(
              '${t.numero}',
              '${nombre}',
              '${t.telefono}',
              '${t.garantiaServicio || ''}'
              )">

              📄 Garantía electrónica

              </button>

            </div>

          </div>

        </div>

      </div>
      `
    }).join('')

    if(lista.innerHTML !== htmlTickets){

      lista.innerHTML = htmlTickets
    }

  }catch(e){

    console.error(e)

    alert('Error conexión')
  }
}

cargar()

</script>

</body>
</html>
