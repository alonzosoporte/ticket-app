<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Tickets PRO</title>

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
  font-family: Arial;
  background:#eef2f7;
  padding:20px;
}

/* NAV */
.nav-top {
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

/* HEADER */
.header-pro {
  display:flex;
  align-items:center;
  gap:15px;
  background:white;
  padding:15px 20px;
  border-radius:14px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
  margin-bottom:20px;
  flex-wrap:wrap;
  border-left:5px solid #003366;
}

.titulo {
  font-size:20px;
  font-weight:bold;
}

.acciones {
  display:flex;
  gap:10px;
  align-items:center;
}

input {
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
}

/* BOTONES PRO */
button {
  padding:10px 14px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:bold;
}

.btn {
  background:#003366;
  color:white;
  transition:0.2s;
}
.btn:hover {
  background:#002244;
  transform:scale(1.03);
}

.btn-success { background:#28a745; color:white }
.btn-danger { background:#dc3545; color:white }
.btn-secondary { background:#6c757d; color:white }

/* RESUMEN */
.panel {
  display:flex;
  gap:15px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.card {
  background:white;
  padding:15px;
  border-radius:14px;
  box-shadow:0 8px 20px rgba(0,0,0,0.06);
  flex:1;
  min-width:220px;
  border-top:3px solid #003366;
}

.monto {
  font-size:22px;
  font-weight:bold;
}

.total {
  background:#f1f3f5;
  text-align:center;
  font-size:18px;
}

/* TICKETS */
.ticket {
  background:white;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
}

textarea {
  width:100%;
  padding:8px;
  border-radius:10px;
  border:1px solid #ccc;
  resize:none;
  overflow:hidden;
  box-sizing:border-box;
}
</style>
</head>

<body>

<!-- NAV -->
<div class="nav-top">
  <button class="btn-secondary" onclick="location.href='cotizaciones.html'">📊 Cotizaciones</button>
  <button class="btn-secondary" onclick="location.href='garantias.html'">🛡️ Garantías</button>
</div>

<!-- HEADER -->
<div class="header-pro">
  <div class="titulo">🧾 Sistema De Tickets</div>

  <div class="acciones">
    <input id="busqueda" placeholder="🔍 Buscar..." oninput="cargar()">
    <button class="btn" onclick="modo='pendientes';cargar()">📋 Pendientes</button>
    <button class="btn-success" onclick="modo='todos';cargar()">✅ Todos</button>
  </div>
</div>

<div id="resumen"></div>
<div id="lista"></div>

<script>

const API = ''
let modo = 'pendientes'
const socket = io()

// ===== PDF EMPRESA =====
async function descargarPDF(numero){

  const res = await fetch(API + '/tickets')
  const data = await res.json()

  const t = data.find(x => x.numero === numero)
  if(!t) return alert('No encontrado')

  const { jsPDF } = window.jspdf
  const doc = new jsPDF()

  const img = new Image()
  img.src = '/logo.png'

  img.onload = () => {

    // HEADER
    doc.setFillColor(0, 51, 102)
    doc.rect(0,0,210,35,'F')

    doc.addImage(img,'PNG',10,5,30,25)

    doc.setTextColor(255,255,255)
    doc.setFontSize(18)
    doc.text("ALONZO", 50, 18)

    doc.setFontSize(11)
    doc.text("Servicio Técnico Profesional", 50, 25)

    doc.setFontSize(16)
    doc.text("FACTURA", 160, 20)

    doc.setDrawColor(200)
    doc.line(10, 40, 200, 40)

    doc.setTextColor(0,0,0)

    let y = 50

    doc.setFontSize(11)
    doc.text("Factura N°: " + t.numero, 10, y)
    doc.text("Fecha: " + new Date().toLocaleDateString(), 140, y)

    y += 12

    doc.text("Cliente: " + (t.nombre||''), 10, y)
    y += 8

    doc.text("Teléfono: " + (t.telefono||''), 10, y)
    y += 15

    doc.text("Problema:", 10, y)
    y += 7
    doc.text(t.problema || '', 10, y, { maxWidth:180 })

    y += 15

    doc.text("Detalle técnico:", 10, y)
    y += 7
    doc.text(t.detalle || '', 10, y, { maxWidth:180 })

    y += 20

    // TOTAL
    doc.setFillColor(0,51,102)
    doc.rect(120, y, 80, 18, 'F')

    doc.setTextColor(255,255,255)
    doc.setFontSize(14)
    doc.text("TOTAL: $" + (t.precio || 0), 125, y + 12)

    doc.setTextColor(0,0,0)

    y += 30

    // DATOS BANCARIOS
    doc.setDrawColor(200)
    doc.line(10, y-10, 200, y-10)

    doc.setFontSize(10)
    doc.setTextColor(80,80,80)

    doc.text("Para transferencias bancarias:", 10, y)
    y += 6
    doc.text("BROU CA 001120656-00002", 10, y)
    y += 5
    doc.text("Julian Alonzo Guerra", 10, y)

    y += 15

    doc.setFontSize(9)
    doc.setTextColor(120,120,120)
    doc.text("ALONZO Servicio Técnico", 10, y)
    y += 5
    doc.text("Gracias por su confianza", 10, y)

    doc.save("Factura_"+t.numero+".pdf")
  }
}

// ===== CRUD =====
async function guardar(id,campo,valor){
  await fetch(API + '/ticket/'+id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({[campo]:valor})
  })
}

async function marcarEntregado(id){
  await fetch(API + '/ticket/'+id,{
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({entregado:'si'})
  })
}

async function borrar(id){
  if(!confirm("Eliminar?"))return
  await fetch(API + '/ticket/'+id,{method:'DELETE'})
}

// ===== WHATSAPP =====
async function listoWhatsApp(id,nombre,telefono,precio){

  let tel=telefono.replace(/\D/g,'')

  if(tel.startsWith('0')) tel='598'+tel.substring(1)
  if(!tel.startsWith('598')) tel='598'+tel

  const msg=`Hola ${nombre} 👋

Tu equipo está listo ✅

🧾 ${id}
💲 ${precio||'A confirmar'}`

  window.location.href="https://api.whatsapp.com/send?phone="+tel+"&text="+encodeURIComponent(msg)

  await guardar(id,'estado','listo')
}

// ===== CARGAR =====
async function cargar(){

  const res = await fetch(API + '/tickets')
  let tickets = await res.json()

  const resCot = await fetch(API + '/cotizaciones')
  let cotizaciones = await resCot.json()

  let rep=0, ven=0

  tickets.forEach(t=>{
    if(t.entregado==='si') rep+=parseFloat(t.ganancia)||0
  })

  cotizaciones.forEach(c=>{
    if(c.confirmada === 'si'){
      const costo = parseFloat(c.costoProveedor) || 0
      const precio = parseFloat(c.precioCliente) || 0
      ven += (precio - costo)
    }
  })

  document.getElementById('resumen').innerHTML = `
  <div class="panel">
    <div class="card"><b>🔧 Reparaciones</b><div class="monto">$${rep}</div></div>
    <div class="card"><b>🛒 Ventas</b><div class="monto">$${ven}</div></div>
    <div class="card total"><b>Total: $${rep+ven}</b></div>
  </div>
  `

  if(modo==='pendientes'){
    tickets=tickets.filter(t=>t.entregado!=='si')
  }

  const filtro=busqueda.value.toLowerCase()

  tickets=tickets.filter(t=>
    (t.nombre||'').toLowerCase().includes(filtro) ||
    (t.telefono||'').includes(filtro)
  )

  lista.innerHTML=''

  tickets.reverse().forEach(t=>{
    lista.innerHTML+=`
    <div class="ticket">
      <b>${t.numero}</b><br>
      ${t.nombre} (${t.telefono})<br>
      ${t.problema}<br>
      📅 ${new Date(t.fecha).toLocaleString('es-UY')}<br><br>

      💲 Precio:
      <input value="${t.precio||''}" onchange="guardar('${t.numero}','precio',this.value)">

      💰 Ganancia:
      <input value="${t.ganancia||''}" onchange="guardar('${t.numero}','ganancia',this.value)">

      <br><br>

      📝 Detalle:
      <textarea 
      oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"
      onblur="guardar('${t.numero}','detalle',this.value)">${(t.detalle||'').trim()}</textarea>

      <br><br>

      <button class="btn-success"
      onclick="listoWhatsApp('${t.numero}','${t.nombre}','${t.telefono}','${t.precio}')">
      ✔️ Listo + WhatsApp</button>

      <button class="btn-secondary"
      onclick="marcarEntregado('${t.numero}')">📦 Entregado</button>

      <button class="btn"
      onclick="descargarPDF('${t.numero}')">📄 PDF</button>

      <button class="btn-danger"
      onclick="borrar('${t.numero}')">❌</button>

    </div>
    `
  })
}

socket.on('actualizar',()=>cargar())

cargar()

</script>

</body>
</html>
