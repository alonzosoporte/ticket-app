<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Tickets PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://ticket-pro-xmhs.onrender.com/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
  font-family:Arial;
  background:#eef2f7;
  padding:15px;
}

.nav-top{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.header-pro{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  background:white;
  padding:12px;
  border-radius:14px;
  margin-bottom:20px;
  border-left:5px solid #003366;
}

input,select,textarea{
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
  box-sizing:border-box;
}

button{
  padding:10px 12px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.btn{background:#003366;color:white;}
.btn-success{background:#28a745;color:white;}
.btn-danger{background:#dc3545;color:white;}
.btn-secondary{background:#6c757d;color:white;}
.btn-pdf{background:#7688A1;color:white;}

.ticket{
  background:white;
  padding:15px;
  margin-bottom:15px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.fila-superior,
.fila-inferior{
  display:flex;
  gap:15px;
  flex-wrap:wrap;
}

.campo-box{
  min-width:180px;
}

.campo-box select,
.campo-box input{
  width:100%;
}

.acciones-ticket{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

@media(max-width:700px){
  .fila-superior,
  .fila-inferior{
    flex-direction:column;
  }
}

</style>
</head>

<body>

<div class="nav-top">
  <button class="btn-secondary" onclick="location.href='cotizaciones.html'">Cotizaciones</button>
  <button class="btn-secondary" onclick="location.href='garantias.html'">Garantías</button>
</div>

<div id="lista"></div>

<script>

const API='https://ticket-pro-xmhs.onrender.com'
const TOKEN=localStorage.getItem('token')

if(!TOKEN) location.href='login.html'

function fetchAuth(url,options={}){
  return fetch(API+url,{
    ...options,
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer '+TOKEN
    }
  })
}

/* =========================
   PDF GARANTIA
========================= */

function generarGarantia(id,nombre,telefono,garantia){

  const { jsPDF } = window.jspdf
  const doc = new jsPDF()

  const logo = new Image()
  logo.src = 'logo.png'

  logo.onload = function(){

    doc.addImage(logo,'PNG',65,10,80,40)

    doc.setFont('helvetica','bold')
    doc.setFontSize(18)
    doc.text('GARANTIA ELECTRONICA',105,60,{align:'center'})

    doc.setFontSize(12)

    doc.text('TICKET: '+id,20,85)
    doc.text('CLIENTE: '+nombre,20,100)
    doc.text('CELULAR: '+telefono,20,115)
    doc.text('GARANTIA: '+garantia,20,130)

    doc.setFontSize(10)
    doc.text('Esta garantia cubre fallas tecnicas relacionadas con el servicio brindado.',20,155)
    doc.text('Valido a partir de la fecha de entrega.',20,165)

    doc.text('Gracias por confiar en nuestro servicio.',20,185)

    doc.save(`garantia_${nombre}.pdf`)
  }
}

/* =========================
   CARGAR TICKETS
========================= */

async function cargar(){

  const res = await fetchAuth('/tickets')
  const tickets = await res.json()

  const lista = document.getElementById('lista')
  lista.innerHTML=''

  tickets.forEach(t=>{

    lista.innerHTML += `
    <div class="ticket">

      <div class="fila-superior">

        <div class="campo-box">
          Técnico<br>
          <select onchange="guardar('${t.numero}','tecnico',this.value)">
            <option value="">Sin seleccionar</option>
            <option value="Javier" ${t.tecnico==='Javier'?'selected':''}>Javier</option>
          </select>
        </div>

        <div class="campo-box">
          Garantía<br>
          <select onchange="guardar('${t.numero}','garantiaServicio',this.value)">
            <option value="">Sin garantía</option>
            <option value="3 meses" ${t.garantiaServicio==='3 meses'?'selected':''}>3 meses</option>
            <option value="6 meses" ${t.garantiaServicio==='6 meses'?'selected':''}>6 meses</option>
          </select>
        </div>

        <div class="campo-box">
          <button class="btn-pdf"
          onclick="generarGarantia(
            '${t.numero}',
            '${t.nombre}',
            '${t.telefono}',
            '${t.garantiaServicio||''}'
          )">
          Garantía electrónica
          </button>
        </div>

      </div>

      <div class="fila-inferior">

        <div class="campo-box">
          Precio<br>
          <input type="number" value="${t.precio||''}">
        </div>

        <div class="campo-box">
          Ganancia<br>
          <input type="number" value="${t.ganancia||''}">
        </div>

      </div>

    </div>
    `
  })
}

cargar()

</script>

</body>
</html>
