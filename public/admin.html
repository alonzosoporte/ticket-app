<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Tickets PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://ticket-pro-xmhs.onrender.com/socket.io/socket.io.js"></script>

<style>

body{
  font-family:Arial;
  background:#eef2f7;
  padding:15px;
}

/* NAV */
.nav-top{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

/* HEADER */
.header-pro{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  background:white;
  padding:12px;
  border-radius:14px;
  margin-bottom:20px;
  border-left:5px solid #003366;
}

/* INPUTS */
input,select,textarea{
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
  box-sizing:border-box;
}

/* BOTONES */
button{
  padding:10px 12px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.btn{
  background:#003366;
  color:white;
}

.btn-success{
  background:#28a745;
  color:white;
}

.btn-danger{
  background:#dc3545;
  color:white;
}

.btn-secondary{
  background:#6c757d;
  color:white;
}

/* PANEL */
.panel{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.card{
  background:white;
  padding:12px;
  border-radius:12px;
  flex:1;
  font-weight:bold;
}

/* TICKETS */
.ticket{
  background:white;
  padding:15px;
  margin-bottom:15px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.ticket-top{
  margin-bottom:10px;
  line-height:1.7;
}

textarea{
  width:100%;
  min-height:100px;
  resize:vertical;
  margin-top:10px;
}

.acciones-ticket{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

/* NUEVO LAYOUT */
.datos-ticket{
  margin-top:15px;
}

.fila-superior,
.fila-inferior{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

.fila-superior{
  margin-bottom:15px;
}

.campo-box{
  min-width:180px;
}

.campo-box select,
.campo-box input{
  width:100%;
}

.toggle-detalle{
  margin-top:10px;
  background:#f1f1f1;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.detalle-box{
  display:none;
  margin-top:10px;
}

.mostrar{
  display:block;
}

/* MOBILE */
@media(max-width:700px){

  .fila-superior,
  .fila-inferior{
    flex-direction:column;
  }

  .campo-box{
    width:100%;
  }

  .acciones-ticket{
    flex-direction:column;
  }

  button{
    width:100%;
  }
}

</style>
</head>

<body>

<!-- NAV -->
<div class="nav-top">

  <button class="btn-secondary"
  onclick="location.href='cotizaciones.html'">
  📊 Cotizaciones
  </button>

  <button class="btn-secondary"
  onclick="location.href='garantias.html'">
  🛡️ Garantías
  </button>

</div>

<!-- HEADER -->
<div class="header-pro">

  <input 
  id="busqueda"
  placeholder="🔍 Buscar..."
  oninput="cargar()">

  <select id="filtroMes" onchange="cargar()">
    <option value="todos">📅 Todos</option>
  </select>

  <button class="btn"
  onclick="modo='pendientes';cargar()">
  Pendientes
  </button>

  <button class="btn-success"
  onclick="modo='todos';cargar()">
  Todos
  </button>

  <button class="btn-danger"
  onclick="logout()">
  Salir
  </button>

</div>

<!-- RESUMEN -->
<div id="resumen"></div>

<!-- LISTA -->
<div id="lista"></div>

<script>

const TOKEN = localStorage.getItem('token')

if(!TOKEN){
  location.href='login.html'
}

const API='https://ticket-pro-xmhs.onrender.com'

// SOCKET
const socket = io(API,{
  transports:['websocket','polling']
})

socket.off('actualizar')

socket.on('actualizar',()=>{

  console.log('ACTUALIZAR RECIBIDO')

  cargar()
})

let modo='pendientes'

// LOGOUT
function logout(){

  localStorage.removeItem('token')

  location.href='login.html'
}

// FETCH AUTH
function fetchAuth(url,options={}){

  return fetch(API+url,{

    ...options,

    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer '+TOKEN
    }
  })
}

// TOGGLE
function toggleDetalle(id){

  const box =
  document.getElementById('detalle-'+id)

  box.classList.toggle('mostrar')
}

// MESES
function cargarMeses(tickets){

  const select =
  document.getElementById('filtroMes')

  const actual = select.value

  const nombres=[
    'Enero','Febrero','Marzo','Abril',
    'Mayo','Junio','Julio','Agosto',
    'Septiembre','Octubre','Noviembre','Diciembre'
  ]

  const meses=new Set()

  tickets.forEach(t=>{

    if(!t.fecha) return

    const d=new Date(t.fecha)

    const mes=
    String(d.getMonth()+1).padStart(2,'0')

    const anio=d.getFullYear()

    meses.add(`${anio}-${mes}`)
  })

  select.innerHTML=
  `<option value="todos">📅 Todos</option>`

  ;[...meses]
  .sort()
  .reverse()
  .forEach(m=>{

    const partes=m.split('-')

    const anio=partes[0]
    const mes=partes[1]

    const nombre=
    nombres[parseInt(mes)-1]

    select.innerHTML += `
    <option value="${m}">
      ${nombre} ${anio}
    </option>`
  })

  const hoy=new Date()

  const actualMes=
  `${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}`

  select.value =
  actual !== 'todos'
  ? actual
  : actualMes
}

// GUARDAR
async function guardar(id,campo,valor){

  await fetchAuth('/ticket/'+id,{

    method:'PUT',

    body:JSON.stringify({
      [campo]:valor
    })
  })
}

// ENTREGADO
async function marcarEntregado(id){

  await fetchAuth('/ticket/'+id,{

    method:'PUT',

    body:JSON.stringify({
      entregado:'si'
    })
  })

  cargar()
}

// BORRAR
async function borrar(id,nombre){

  if(!confirm(`¿Eliminar ticket de ${nombre}?`)){
    return
  }

  await fetchAuth('/ticket/'+id,{
    method:'DELETE'
  })

  cargar()
}

// WHATSAPP
function listoWhatsApp(
  id,
  nombre,
  telefono,
  precio,
  detalle
){

  let tel=
  (telefono||'').replace(/\D/g,'')

  if(tel.startsWith('0')){
    tel='598'+tel.substring(1)
  }

  if(!tel.startsWith('598')){
    tel='598'+tel
  }

  const msg=`Hola ${nombre} 👋

El servicio con numero de 🧾 Ticket ${id} ha sido realizado ✅

📝 Detalle:
${detalle || 'Se realizó el servicio correctamente'}

📦 Podés pasar a retirarlo.

💲 Precio: ${precio || 'A confirmar'}

🏦 BROU
CA 001120656-00002`

  window.open(
    `https://api.whatsapp.com/send?phone=${tel}&text=${encodeURIComponent(msg)}`
  )
}

// CARGAR
async function cargar(){

  try{

    const res =
    await fetchAuth('/tickets')

    const tickets =
    await res.json()

    let cotizaciones=[]

    try{

      const resCot =
      await fetchAuth('/cotizaciones')

      cotizaciones =
      await resCot.json()

      if(!Array.isArray(cotizaciones)){
        cotizaciones=[]
      }

    }catch(err){

      console.log(err)
    }

    cargarMeses(tickets)

    const mesSel=
    document.getElementById('filtroMes').value

    const filtro=
    document.getElementById('busqueda')
    .value
    .toLowerCase()

    let rep=0
    let ven=0

    // REPARACIONES
    tickets.forEach(t=>{

      if(t.entregado==='si'){

        rep +=
        parseFloat(t.ganancia)||0
      }
    })

    // VENTAS
    cotizaciones.forEach(c=>{

      if(c.confirmada==='si'){

        ven += Number(c.ganancia||0)
      }
    })

    // RESUMEN
    document.getElementById('resumen')
    .innerHTML=`

    <div class="panel">

      <div class="card">
      🔧 Reparaciones $${rep}
      </div>

      <div class="card">
      🛒 Ventas $${ven}
      </div>

      <div class="card">
      💰 Total $${rep+ven}
      </div>

    </div>
    `

    let filtrados=[...tickets]

    // SOLO PENDIENTES
    if(modo==='pendientes'){

      filtrados=
      filtrados.filter(
        t=>t.entregado!=='si'
      )
    }

    // FILTRO
    filtrados=filtrados.filter(t=>{

      const match=

      (t.nombre||'')
      .toLowerCase()
      .includes(filtro)

      ||

      (t.telefono||'')
      .includes(filtro)

      ||

      (t.numero||'')
      .toLowerCase()
      .includes(filtro)

      if(mesSel==='todos'){
        return match
      }

      const d=new Date(t.fecha)

      const mes=
      String(d.getMonth()+1).padStart(2,'0')

      const anio=d.getFullYear()

      const clave=`${anio}-${mes}`

      return match && clave===mesSel
    })

    // NUEVOS ARRIBA
    filtrados.sort((a,b)=>{

      return new Date(b.fecha) - new Date(a.fecha)
    })

    lista.innerHTML=''

    filtrados.forEach(t=>{

      const nombre=
      (t.nombre||'')
      .replace(/'/g,'')

      const detalle=
      (t.detalle||'')
      .replace(/'/g,"")
      .replace(/\n/g," ")
      .replace(/\r/g," ")

      const fecha=
      new Date(t.fecha)
      .toLocaleDateString('es-UY')

      lista.innerHTML += `

      <div class="ticket">

        <div class="ticket-top">

          📅 ${fecha}<br>

          🧾 <b>
          Ticket ${t.numero}
          </b><br>

          👤 ${nombre}<br>

          📱 ${t.telefono}<br><br>

          🔧 ${t.problema}

        </div>

        <div class="datos-ticket">

          <!-- FILA SUPERIOR -->
          <div class="fila-superior">

            <div class="campo-box">
              👨 Técnico<br>

              <select
              onchange="guardar('${t.numero}','tecnico',this.value)">

                <option value="">Sin seleccionar</option>

                <option value="PCR"
                ${t.tecnico==='PCR'?'selected':''}>
                PCR
                </option>

                <option value="Javier"
                ${t.tecnico==='Javier'?'selected':''}>
                Javier
                </option>

                <option value="Mauricio"
                ${t.tecnico==='Mauricio'?'selected':''}>
                Mauricio
                </option>

                <option value="Electroshop"
                ${t.tecnico==='Electroshop'?'selected':''}>
                Electroshop
                </option>

              </select>
            </div>

            <div class="campo-box">
              🛡️ Garantía<br>

              <select
              onchange="guardar('${t.numero}','garantiaServicio',this.value)">

                <option value="">Sin garantía</option>

                <option value="3 meses"
                ${t.garantiaServicio==='3 meses'?'selected':''}>
                3 meses
                </option>

                <option value="6 meses"
                ${t.garantiaServicio==='6 meses'?'selected':''}>
                6 meses
                </option>

              </select>
            </div>

          </div>

          <!-- FILA INFERIOR -->
          <div class="fila-inferior">

            <div class="campo-box">
              💲 Precio<br>

              <input
              class="precio"
              type="number"
              value="${t.precio||''}"
              onchange="guardar('${t.numero}','precio',this.value)">
            </div>

            <div class="campo-box">
              💰 Ganancia<br>

              <input
              type="number"
              value="${t.ganancia||''}"
              onchange="guardar('${t.numero}','ganancia',this.value)">
            </div>

          </div>

        </div>

        <div
        class="toggle-detalle"
        onclick="toggleDetalle('${t.numero}')">

        📝 Detalle (click para abrir/cerrar)

        </div>

        <div
        class="detalle-box"
        id="detalle-${t.numero}">

          <textarea
          onblur="guardar('${t.numero}','detalle',this.value)">
${t.detalle||''}</textarea>

        </div>

        <div class="acciones-ticket">

          <button class="btn-secondary"
          onclick="marcarEntregado('${t.numero}')">
          ✔ Entregado
          </button>

          <button class="btn-success"
          onclick="listoWhatsApp(
          '${t.numero}',
          '${nombre}',
          '${t.telefono}',
          this.closest('.ticket').querySelector('.precio').value,
          '${detalle}'
          )">
          📲 WhatsApp
          </button>

          <button class="btn-danger"
          onclick="borrar('${t.numero}','${nombre}')">
          ❌ Eliminar
          </button>

        </div>

      </div>
      `
    })

  }catch(e){

    console.error(e)

    alert('Error conexión')
  }
}

// INIT
cargar()

</script>

</body>
</html>
