<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Tickets PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://ticket-pro-xmhs.onrender.com/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
  font-family:Arial;
  background:#eef2f7;
  padding:15px;
}

.nav-top{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.header-pro{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  background:white;
  padding:12px;
  border-radius:14px;
  margin-bottom:20px;
  border-left:5px solid #003366;
}

input,select,textarea{
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
  box-sizing:border-box;
}

button{
  padding:10px 12px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.btn{
  background:#003366;
  color:white;
}

.btn-success{
  background:#28a745;
  color:white;
}

.btn-danger{
  background:#dc3545;
  color:white;
}

.btn-secondary{
  background:#6c757d;
  color:white;
}

.btn-pdf{
  background:#7688A1;
  color:white;
}

.ticket{
  background:white;
  padding:15px;
  margin-bottom:15px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.ticket-top{
  margin-bottom:10px;
  line-height:1.7;
}

textarea{
  width:100%;
  min-height:100px;
  resize:vertical;
  margin-top:10px;
}

.acciones-ticket{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

.datos-ticket{
  margin-top:15px;
}

.fila-superior,
.fila-inferior{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

.fila-superior{
  margin-bottom:15px;
  align-items:flex-end;
}

.campo-box{
  min-width:180px;
}

.campo-box select,
.campo-box input{
  width:100%;
}

.toggle-detalle{
  margin-top:10px;
  background:#f1f1f1;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.detalle-box{
  display:none;
  margin-top:10px;
}

.mostrar{
  display:block;
}

@media(max-width:700px){

  .fila-superior,
  .fila-inferior{
    flex-direction:column;
  }

  .campo-box{
    width:100%;
  }

  .acciones-ticket{
    flex-direction:column;
  }

  button{
    width:100%;
  }
}

</style>
</head>

<body>

<div class="nav-top">

  <button class="btn-secondary"
  onclick="location.href='cotizaciones.html'">
  📊 Cotizaciones
  </button>

  <button class="btn-secondary"
  onclick="location.href='garantias.html'">
  🛡️ Garantías
  </button>

</div>

<div class="header-pro">

  <input 
  id="busqueda"
  placeholder="🔍 Buscar..."
  oninput="cargar()">

  <button class="btn"
  onclick="modo='pendientes';cargar()">
  Pendientes
  </button>

  <button class="btn-success"
  onclick="modo='todos';cargar()">
  Todos
  </button>

  <button class="btn-danger"
  onclick="logout()">
  Salir
  </button>

</div>

<div id="lista"></div>

<script>

const TOKEN = localStorage.getItem('token')

if(!TOKEN){
  location.href='login.html'
}

const API='https://ticket-pro-xmhs.onrender.com'

const socket = io(API,{
  transports:['websocket','polling']
})

socket.off('actualizar')

socket.on('actualizar',()=>{
  cargar()
})

let modo='pendientes'

function logout(){

  localStorage.removeItem('token')

  location.href='login.html'
}

function fetchAuth(url,options={}){

  return fetch(API+url,{

    ...options,

    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer '+TOKEN
    }
  })
}

function toggleDetalle(id){

  const box =
  document.getElementById('detalle-'+id)

  box.classList.toggle('mostrar')
}

async function guardar(id,campo,valor){

  await fetchAuth('/ticket/'+id,{

    method:'PUT',

    body:JSON.stringify({
      [campo]:valor
    })
  })
}

async function marcarEntregado(id){

  await fetchAuth('/ticket/'+id,{

    method:'PUT',

    body:JSON.stringify({
      entregado:'si'
    })
  })

  cargar()
}

async function borrar(id,nombre){

  if(!confirm(`¿Eliminar ticket de ${nombre}?`)){
    return
  }

  await fetchAuth('/ticket/'+id,{
    method:'DELETE'
  })

  cargar()
}

async function generarGarantia(
  numero,
  nombre,
  telefono,
  garantia
){

  const { jsPDF } = window.jspdf

  const doc = new jsPDF('p','mm','a4')

  const logo = new Image()

  logo.src='/logo.png'

  logo.onload = function(){

    // =========================
    // FONDO
    // =========================
    doc.setFillColor(245,245,245)

    doc.rect(
      0,
      0,
      210,
      297,
      'F'
    )

    // =========================
    // HEADER
    // =========================
    doc.setFillColor(118,136,161)

    doc.rect(
      0,
      0,
      210,
      18,
      'F'
    )

    // LINEA BLANCA
    doc.setDrawColor(255,255,255)

    doc.setLineWidth(2)

    doc.line(
      78,
      0,
      92,
      18
    )

    // TITULO HEADER
    doc.setTextColor(255,255,255)

    doc.setFontSize(18)

    doc.setFont(
      'helvetica',
      'bold'
    )

    doc.text(
      'GARANTÍA ELECTRÓNICA',
      125,
      11
    )

    // =========================
    // LOGO
    // =========================
    doc.addImage(
      logo,
      'PNG',
      62,
      20,
      82,
      45
    )

    // =========================
    // TITULO CENTRAL
    // =========================
    doc.setTextColor(20,30,45)

    doc.setFontSize(24)

    doc.setFont(
      'helvetica',
      'bold'
    )

    doc.text(
      'GARANTÍA ELECTRÓNICA',
      105,
      88,
      { align:'center' }
    )

    // =========================
    // LINEAS DECORATIVAS
    // =========================
    doc.setDrawColor(140,155,175)

    doc.setLineWidth(0.5)

    doc.line(
      22,
      95,
      88,
      95
    )

    doc.line(
      122,
      95,
      188,
      95
    )

    // CENTRO
    doc.setFillColor(230,235,242)

    doc.roundedRect(
      100,
      89,
      10,
      10,
      3,
      3,
      'F'
    )

    // =========================
    // CAJA PRINCIPAL
    // =========================
    doc.setFillColor(255,255,255)

    doc.roundedRect(
      20,
      108,
      170,
      78,
      5,
      5,
      'F'
    )

    doc.setDrawColor(220,220,220)

    doc.roundedRect(
      20,
      108,
      170,
      78,
      5,
      5
    )

    // =========================
    // DATOS
    // =========================
    const filas = [

      ['TICKET', numero],
      ['CLIENTE', nombre],
      ['CELULAR', telefono],
      ['GARANTÍA', garantia || 'Sin garantía']

    ]

    let y = 122

    filas.forEach((f,index)=>{

      // LABEL
      doc.setTextColor(40,40,40)

      doc.setFontSize(13)

      doc.setFont(
        'helvetica',
        'bold'
      )

      doc.text(
        f[0],
        40,
        y
      )

      // VALOR
      doc.setFontSize(18)

      doc.setFont(
        'helvetica',
        'bold'
      )

      doc.setTextColor(15,25,40)

      doc.text(
        String(f[1]),
        95,
        y
      )

      // LINEAS
      if(index < 3){

        doc.setDrawColor(230,230,230)

        doc.line(
          30,
          y+10,
          180,
          y+10
        )
      }

      y += 20
    })

    // =========================
    // CAJA DESCRIPCION
    // =========================
    doc.setFillColor(248,249,252)

    doc.roundedRect(
      20,
      198,
      170,
      32,
      4,
      4,
      'F'
    )

    doc.setDrawColor(160,175,195)

    doc.roundedRect(
      20,
      198,
      170,
      32,
      4,
      4
    )

    // TEXTO
    doc.setTextColor(60,60,60)

    doc.setFontSize(11)

    doc.setFont(
      'helvetica',
      'normal'
    )

    doc.text(
      'Esta garantía cubre fallas técnicas relacionadas',
      35,
      212
    )

    doc.text(
      'con el servicio brindado, durante el período',
      35,
      220
    )

    doc.text(
      'indicado a partir de la fecha de entrega.',
      35,
      228
    )

    // =========================
    // FOOTER INFO
    // =========================
    doc.setDrawColor(140,155,175)

    doc.line(
      15,
      238,
      195,
      238
    )

    const fecha =
    new Date().toLocaleDateString('es-UY')

    // FECHA
    doc.setTextColor(60,60,60)

    doc.setFontSize(10)

    doc.setFont(
      'helvetica',
      'bold'
    )

    doc.text(
      'FECHA DE EMISIÓN',
      50,
      250
    )

    doc.setFont(
      'helvetica',
      'normal'
    )

    doc.text(
      fecha,
      50,
      258
    )

    // SOPORTE
    doc.setFont(
      'helvetica',
      'bold'
    )

    doc.text(
      'SOPORTE TÉCNICO',
      135,
      250
    )

    doc.setFont(
      'helvetica',
      'normal'
    )

    doc.text(
      '098555861',
      135,
      258
    )

    // DIVISOR
    doc.setDrawColor(210,210,210)

    doc.line(
      105,
      244,
      105,
      264
    )

    // =========================
    // FOOTER FINAL
    // =========================
    doc.setFillColor(118,136,161)

    doc.rect(
      0,
      286,
      210,
      11,
      'F'
    )

    doc.setTextColor(255,255,255)

    doc.setFontSize(12)

    doc.setFont(
      'helvetica',
      'normal'
    )

    doc.text(
      'Gracias por confiar en nuestro servicio.',
      105,
      293,
      { align:'center' }
    )

    // =========================
    // DESCARGAR
    // =========================
    doc.save(
      `garantia-${nombre}.pdf`
    )
  }
}

async function cargar(){

  try{

    const res =
    await fetchAuth('/tickets')

    const tickets =
    await res.json()

    let filtrados=[...tickets]

    if(modo==='pendientes'){

      filtrados=
      filtrados.filter(
        t=>t.entregado!=='si'
      )
    }

    lista.innerHTML=''

    filtrados.forEach(t=>{

      const nombre=
      (t.nombre||'')
      .replace(/'/g,'')

      const detalle=
      (t.detalle||'')
      .replace(/'/g,"")
      .replace(/\n/g," ")

      const fecha=
      new Date(t.fecha)
      .toLocaleDateString('es-UY')

      lista.innerHTML += `

      <div class="ticket">

        <div class="ticket-top">

          📅 ${fecha}<br>

          🧾 <b>
          Ticket ${t.numero}
          </b><br>

          👤 ${nombre}<br>

          📱 ${t.telefono}<br><br>

          🔧 ${t.problema}

        </div>

        <div class="datos-ticket">

          <div class="fila-superior">

            <div class="campo-box">
              👨 Técnico<br>

              <select
              onchange="guardar('${t.numero}','tecnico',this.value)">

                <option value="">Sin seleccionar</option>

                <option value="PCR"
                ${t.tecnico==='PCR'?'selected':''}>
                PCR
                </option>

                <option value="Javier"
                ${t.tecnico==='Javier'?'selected':''}>
                Javier
                </option>

                <option value="Mauricio"
                ${t.tecnico==='Mauricio'?'selected':''}>
                Mauricio
                </option>

                <option value="Electroshop"
                ${t.tecnico==='Electroshop'?'selected':''}>
                Electroshop
                </option>

              </select>
            </div>

            <div class="campo-box">
              🛡️ Garantía<br>

              <select
              onchange="guardar('${t.numero}','garantiaServicio',this.value)">

                <option value="">Sin garantía</option>

                <option value="3 meses"
                ${t.garantiaServicio==='3 meses'?'selected':''}>
                3 meses
                </option>

                <option value="6 meses"
                ${t.garantiaServicio==='6 meses'?'selected':''}>
                6 meses
                </option>

              </select>
            </div>

            <div class="campo-box">

              <button
              class="btn-pdf"
              onclick="generarGarantia(
              '${t.numero}',
              '${nombre}',
              '${t.telefono}',
              '${t.garantiaServicio || ''}'
              )">

              📄 Garantía electrónica

              </button>

            </div>

          </div>

          <div class="fila-inferior">

            <div class="campo-box">
              💲 Precio<br>

              <input
              class="precio"
              type="number"
              value="${t.precio||''}"
              onchange="guardar('${t.numero}','precio',this.value)">
            </div>

            <div class="campo-box">
              💰 Ganancia<br>

              <input
              type="number"
              value="${t.ganancia||''}"
              onchange="guardar('${t.numero}','ganancia',this.value)">
            </div>

          </div>

        </div>

        <div
        class="toggle-detalle"
        onclick="toggleDetalle('${t.numero}')">

        📝 Detalle

        </div>

        <div
        class="detalle-box"
        id="detalle-${t.numero}">

          <textarea
          onblur="guardar('${t.numero}','detalle',this.value)">
${t.detalle||''}</textarea>

        </div>

        <div class="acciones-ticket">

          <button class="btn-secondary"
          onclick="marcarEntregado('${t.numero}')">
          ✔ Entregado
          </button>

          <button class="btn-danger"
          onclick="borrar('${t.numero}','${nombre}')">
          ❌ Eliminar
          </button>

        </div>

      </div>
      `
    })

  }catch(e){

    console.error(e)

    alert('Error conexión')
  }
}

cargar()

</script>

</body>
</html>
