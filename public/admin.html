<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Tickets PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://ticket-pro-xmhs.onrender.com/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>

body{
  font-family:Arial;
  background:#eef2f7;
  padding:15px;
}

.nav-top{
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

.header-pro{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  align-items:center;
  background:white;
  padding:12px;
  border-radius:14px;
  margin-bottom:20px;
  border-left:5px solid #003366;
}

input,select,textarea{
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
  box-sizing:border-box;
}

button{
  padding:10px 12px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.btn{
  background:#003366;
  color:white;
}

.btn-success{
  background:#28a745;
  color:white;
}

.btn-danger{
  background:#dc3545;
  color:white;
}

.btn-secondary{
  background:#6c757d;
  color:white;
}

.btn-pdf{
  background:#7688A1;
  color:white;
}

.ticket{
  background:white;
  padding:15px;
  margin-bottom:15px;
  border-radius:12px;
  box-shadow:0 5px 15px rgba(0,0,0,0.05);
}

.ticket-top{
  margin-bottom:10px;
  line-height:1.7;
}

textarea{
  width:100%;
  min-height:100px;
  resize:vertical;
  margin-top:10px;
}

.acciones-ticket{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-top:15px;
}

.datos-ticket{
  margin-top:15px;
}

.fila-superior,
.fila-inferior{
  display:flex;
  gap:20px;
  flex-wrap:wrap;
}

.fila-superior{
  margin-bottom:15px;
  align-items:flex-end;
}

.campo-box{
  min-width:180px;
}

.campo-box select,
.campo-box input{
  width:100%;
}

.toggle-detalle{
  margin-top:10px;
  background:#f1f1f1;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.detalle-box{
  display:none;
  margin-top:10px;
}

.mostrar{
  display:block;
}

@media(max-width:700px){

  .fila-superior,
  .fila-inferior{
    flex-direction:column;
  }

  .campo-box{
    width:100%;
  }

  .acciones-ticket{
    flex-direction:column;
  }

  button{
    width:100%;
  }
}

</style>
</head>

<body>

<div class="nav-top">

  <button class="btn-secondary"
  onclick="location.href='cotizaciones.html'">
  📊 Cotizaciones
  </button>

  <button class="btn-secondary"
  onclick="location.href='garantias.html'">
  🛡️ Garantías
  </button>

</div>

<div class="header-pro">

  <input 
  id="busqueda"
  placeholder="🔍 Buscar..."
  oninput="cargar()">

  <button class="btn"
  onclick="modo='pendientes';cargar()">
  Pendientes
  </button>

  <button class="btn-success"
  onclick="modo='todos';cargar()">
  Todos
  </button>

  <button class="btn-danger"
  onclick="logout()">
  Salir
  </button>

</div>

<div id="lista"></div>

<script>

const TOKEN = localStorage.getItem('token')

if(!TOKEN){
  location.href='login.html'
}

const API='https://ticket-pro-xmhs.onrender.com'

const socket = io(API,{
  transports:['websocket','polling']
})

socket.off('actualizar')

socket.on('actualizar',()=>{
  cargar()
})

let modo='pendientes'

function logout(){

  localStorage.removeItem('token')

  location.href='login.html'
}

function fetchAuth(url,options={}){

  return fetch(API+url,{

    ...options,

    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer '+TOKEN
    }
  })
}

function toggleDetalle(id){

  const box =
  document.getElementById('detalle-'+id)

  box.classList.toggle('mostrar')
}

async function guardar(id,campo,valor){

  await fetchAuth('/ticket/'+id,{

    method:'PUT',

    body:JSON.stringify({
      [campo]:valor
    })
  })
}

async function marcarEntregado(id){

  await fetchAuth('/ticket/'+id,{

    method:'PUT',

    body:JSON.stringify({
      entregado:'si'
    })
  })

  cargar()
}

async function borrar(id,nombre){

  if(!confirm(`¿Eliminar ticket de ${nombre}?`)){
    return
  }

  await fetchAuth('/ticket/'+id,{
    method:'DELETE'
  })

  cargar()
}

async function generarGarantia(
  numero,
  nombre,
  telefono,
  garantia
){

  const { jsPDF } = window.jspdf

  const doc = new jsPDF()

  // ===== LOGO =====
  const logo = new Image()

  logo.src='/logo.png'

  logo.onload = function(){

    // =========================
    // FONDO GENERAL
    // =========================
    doc.setFillColor(245,247,250)

    doc.rect(
      0,
      0,
      210,
      297,
      'F'
    )

    // =========================
    // HEADER
    // =========================
    doc.setFillColor(118,136,161)

    doc.roundedRect(
      10,
      10,
      190,
      42,
      6,
      6,
      'F'
    )

    // LOGO
    doc.addImage(
      logo,
      'PNG',
      18,
      16,
      24,
      24
    )

    // TITULO
    doc.setFont(
      'helvetica',
      'bold'
    )

    doc.setFontSize(23)

    doc.setTextColor(255,255,255)

    doc.text(
      'GARANTÍA ELECTRÓNICA',
      52,
      28
    )

    // SUB
    doc.setFontSize(10)

    doc.setFont(
      'helvetica',
      'normal'
    )

    doc.text(
      'Documento de servicio técnico',
      52,
      36
    )

    // =========================
    // CAJA PRINCIPAL
    // =========================
    doc.setFillColor(255,255,255)

    doc.roundedRect(
      15,
      65,
      180,
      120,
      6,
      6,
      'F'
    )

    // BORDE SUAVE
    doc.setDrawColor(220,220,220)

    doc.roundedRect(
      15,
      65,
      180,
      120,
      6,
      6
    )

    // =========================
    // TITULO DATOS
    // =========================
    doc.setFont(
      'helvetica',
      'bold'
    )

    doc.setTextColor(70,70,70)

    doc.setFontSize(14)

    doc.text(
      'DATOS DEL CLIENTE',
      25,
      82
    )

    // LINEA
    doc.setDrawColor(118,136,161)

    doc.setLineWidth(0.8)

    doc.line(
      25,
      86,
      185,
      86
    )

    // =========================
    // TABLA
    // =========================
    const datos = [

      ['Ticket', numero],
      ['Cliente', nombre],
      ['Celular', telefono],
      ['Garantía', garantia || 'Sin garantía']

    ]

    let y = 102

    datos.forEach(item=>{

      // LABEL
      doc.setFillColor(238,242,247)

      doc.roundedRect(
        25,
        y-7,
        45,
        12,
        2,
        2,
        'F'
      )

      doc.setFontSize(11)

      doc.setFont(
        'helvetica',
        'bold'
      )

      doc.setTextColor(80,80,80)

      doc.text(
        item[0],
        30,
        y
      )

      // VALOR
      doc.setFillColor(255,255,255)

      doc.roundedRect(
        73,
        y-7,
        100,
        12,
        2,
        2
      )

      doc.setFont(
        'helvetica',
        'normal'
      )

      doc.setTextColor(30,30,30)

      doc.text(
        String(item[1]),
        78,
        y
      )

      y += 22
    })

    // =========================
    // CAJA GARANTIA
    // =========================
    doc.setFillColor(248,249,252)

    doc.roundedRect(
      25,
      165,
      160,
      28,
      4,
      4,
      'F'
    )

    doc.setFontSize(10)

    doc.setTextColor(90,90,90)

    doc.text(
      'La garantía cubre únicamente fallas',
      32,
      177
    )

    doc.text(
      'relacionadas con el servicio realizado.',
      32,
      184
    )

    // =========================
    // FOOTER
    // =========================
    doc.setFillColor(118,136,161)

    doc.roundedRect(
      10,
      260,
      190,
      22,
      5,
      5,
      'F'
    )

    doc.setFontSize(11)

    doc.setTextColor(255,255,255)

    doc.text(
      'Celular: 098555861',
      20,
      274
    )

    // =========================
    // DESCARGAR
    // =========================
    const archivo =
    `garantia-${nombre}.pdf`

    doc.save(archivo)
  }
}

async function cargar(){

  try{

    const res =
    await fetchAuth('/tickets')

    const tickets =
    await res.json()

    let filtrados=[...tickets]

    if(modo==='pendientes'){

      filtrados=
      filtrados.filter(
        t=>t.entregado!=='si'
      )
    }

    lista.innerHTML=''

    filtrados.forEach(t=>{

      const nombre=
      (t.nombre||'')
      .replace(/'/g,'')

      const detalle=
      (t.detalle||'')
      .replace(/'/g,"")
      .replace(/\n/g," ")

      const fecha=
      new Date(t.fecha)
      .toLocaleDateString('es-UY')

      lista.innerHTML += `

      <div class="ticket">

        <div class="ticket-top">

          📅 ${fecha}<br>

          🧾 <b>
          Ticket ${t.numero}
          </b><br>

          👤 ${nombre}<br>

          📱 ${t.telefono}<br><br>

          🔧 ${t.problema}

        </div>

        <div class="datos-ticket">

          <div class="fila-superior">

            <div class="campo-box">
              👨 Técnico<br>

              <select
              onchange="guardar('${t.numero}','tecnico',this.value)">

                <option value="">Sin seleccionar</option>

                <option value="PCR"
                ${t.tecnico==='PCR'?'selected':''}>
                PCR
                </option>

                <option value="Javier"
                ${t.tecnico==='Javier'?'selected':''}>
                Javier
                </option>

                <option value="Mauricio"
                ${t.tecnico==='Mauricio'?'selected':''}>
                Mauricio
                </option>

                <option value="Electroshop"
                ${t.tecnico==='Electroshop'?'selected':''}>
                Electroshop
                </option>

              </select>
            </div>

            <div class="campo-box">
              🛡️ Garantía<br>

              <select
              onchange="guardar('${t.numero}','garantiaServicio',this.value)">

                <option value="">Sin garantía</option>

                <option value="3 meses"
                ${t.garantiaServicio==='3 meses'?'selected':''}>
                3 meses
                </option>

                <option value="6 meses"
                ${t.garantiaServicio==='6 meses'?'selected':''}>
                6 meses
                </option>

              </select>
            </div>

            <div class="campo-box">

              <button
              class="btn-pdf"
              onclick="generarGarantia(
              '${t.numero}',
              '${nombre}',
              '${t.telefono}',
              '${t.garantiaServicio || ''}'
              )">

              📄 Garantía electrónica

              </button>

            </div>

          </div>

          <div class="fila-inferior">

            <div class="campo-box">
              💲 Precio<br>

              <input
              class="precio"
              type="number"
              value="${t.precio||''}"
              onchange="guardar('${t.numero}','precio',this.value)">
            </div>

            <div class="campo-box">
              💰 Ganancia<br>

              <input
              type="number"
              value="${t.ganancia||''}"
              onchange="guardar('${t.numero}','ganancia',this.value)">
            </div>

          </div>

        </div>

        <div
        class="toggle-detalle"
        onclick="toggleDetalle('${t.numero}')">

        📝 Detalle

        </div>

        <div
        class="detalle-box"
        id="detalle-${t.numero}">

          <textarea
          onblur="guardar('${t.numero}','detalle',this.value)">
${t.detalle||''}</textarea>

        </div>

        <div class="acciones-ticket">

          <button class="btn-secondary"
          onclick="marcarEntregado('${t.numero}')">
          ✔ Entregado
          </button>

          <button class="btn-danger"
          onclick="borrar('${t.numero}','${nombre}')">
          ❌ Eliminar
          </button>

        </div>

      </div>
      `
    })

  }catch(e){

    console.error(e)

    alert('Error conexión')
  }
}

cargar()

</script>

</body>
</html>
