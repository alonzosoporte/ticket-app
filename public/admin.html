<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Tickets PRO</title>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://ticket-pro-xmhs.onrender.com/socket.io/socket.io.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
body {
  font-family: Arial;
  background:#eef2f7;
  padding:15px;
}

/* NAV */
.nav-top {
  display:flex;
  gap:10px;
  margin-bottom:15px;
}

/* HEADER */
.header-pro {
  display:flex;
  align-items:center;
  gap:10px;
  background:white;
  padding:12px;
  border-radius:14px;
  box-shadow:0 5px 15px rgba(0,0,0,0.08);
  margin-bottom:20px;
  flex-wrap:wrap;
  border-left:5px solid #003366;
}

.titulo {
  font-size:18px;
  font-weight:bold;
}

.acciones {
  display:flex;
  gap:8px;
  align-items:center;
  flex-wrap:wrap;
}

input {
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
}

/* BOTONES */
button {
  padding:10px 12px;
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

.btn { background:#003366; color:white; }
.btn-success { background:#28a745; color:white }
.btn-danger { background:#dc3545; color:white }
.btn-secondary { background:#6c757d; color:white }

/* PANEL */
.panel {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
}

.card {
  background:white;
  padding:12px;
  border-radius:12px;
  flex:1;
}

.monto {
  font-size:18px;
  font-weight:bold;
}

/* TICKETS */
.ticket {
  background:white;
  padding:12px;
  margin:10px 0;
  border-radius:12px;
}

textarea {
  width:100%;
  padding:8px;
  border-radius:10px;
  border:1px solid #ccc;
  resize:none;
  overflow:hidden;
  box-sizing:border-box;
}
</style>
</head>

<body>

<div class="nav-top">
  <button class="btn-secondary" onclick="location.href='cotizaciones.html'">📊 Cotizaciones</button>
  <button class="btn-secondary" onclick="location.href='garantias.html'">🛡️ Garantías</button>
</div>

<div class="header-pro">
  <div class="titulo">🧾 Sistema De Tickets</div>

  <div class="acciones">
    <input id="busqueda" placeholder="🔍 Buscar..." oninput="cargar()">
    <button class="btn" onclick="modo='pendientes';cargar()">📋 Pendientes</button>
    <button class="btn-success" onclick="modo='todos';cargar()">✅ Todos</button>
    <button class="btn-danger" onclick="logout()">🚪 Salir</button>
  </div>
</div>

<div id="resumen"></div>
<div id="lista"></div>

<script>

// ===== CONFIG =====
const API = 'https://ticket-pro-xmhs.onrender.com'
const TOKEN = localStorage.getItem('token')

// 🔐 PROTECCIÓN
if(!TOKEN){
  location.href = 'login.html'
}

const socket = io(API)

let modo = 'pendientes'

// ===== LOGOUT =====
function logout(){
  localStorage.removeItem('token')
  location.href = 'login.html'
}

// ===== FETCH BASE =====
function fetchAuth(url, options = {}){
  return fetch(API + url, {
    ...options,
    headers:{
      'Content-Type':'application/json',
      'Authorization': 'Bearer ' + TOKEN,
      ...(options.headers || {})
    }
  })
}

// ===== PDF =====
async function descargarPDF(numero){

  const res = await fetchAuth('/tickets')
  const data = await res.json()

  const t = data.find(x => x.numero === numero)
  if(!t) return

  const { jsPDF } = window.jspdf
  const doc = new jsPDF()

  doc.text("ALONZO",10,10)
  doc.text("Ticket: "+t.numero,10,20)
  doc.text("Cliente: "+t.nombre,10,30)
  doc.text("Total: $"+(t.precio||0),10,40)

  doc.save("ticket.pdf")
}

// ===== CRUD =====
async function guardar(id,campo,valor){
  await fetchAuth('/ticket/'+id,{
    method:'PUT',
    body: JSON.stringify({[campo]:valor})
  })
}

async function marcarEntregado(id){
  await fetchAuth('/ticket/'+id,{
    method:'PUT',
    body: JSON.stringify({entregado:'si'})
  })
}

async function borrar(id){
  if(!confirm("Eliminar?"))return
  await fetchAuth('/ticket/'+id,{method:'DELETE'})
}

// ===== LOAD =====
async function cargar(){

  try{

    const res = await fetchAuth('/tickets')
    const tickets = await res.json()

    const resCot = await fetchAuth('/cotizaciones')
    const cotizaciones = await resCot.json()

    let rep=0, ven=0

    tickets.forEach(t=>{
      if(t.entregado==='si') rep+=parseFloat(t.ganancia)||0
    })

    cotizaciones.forEach(c=>{
      if(c.confirmada === 'si'){
        ven += (c.precioCliente - c.costoProveedor)
      }
    })

    document.getElementById('resumen').innerHTML = `
      <div class="panel">
        <div class="card">🔧 $${rep}</div>
        <div class="card">🛒 $${ven}</div>
        <div class="card">💰 $${rep+ven}</div>
      </div>
    `

    let filtrados = tickets

    if(modo==='pendientes'){
      filtrados = tickets.filter(t=>t.entregado!=='si')
    }

    const filtro = document.getElementById('busqueda').value.toLowerCase()

    filtrados = filtrados.filter(t=>
      (t.nombre||'').toLowerCase().includes(filtro) ||
      (t.telefono||'').includes(filtro)
    )

    lista.innerHTML=''

    filtrados.reverse().forEach(t=>{
      lista.innerHTML+=`
      <div class="ticket">
        <b>${t.numero}</b><br>
        ${t.nombre} (${t.telefono})<br>
        ${t.problema}<br><br>

        💲 <input value="${t.precio||''}" onchange="guardar('${t.numero}','precio',this.value)">
        💰 <input value="${t.ganancia||''}" onchange="guardar('${t.numero}','ganancia',this.value)">

        <textarea onblur="guardar('${t.numero}','detalle',this.value)">
${(t.detalle||'')}
        </textarea>

        <br><br>

        <button class="btn-success" onclick="marcarEntregado('${t.numero}')">✔️</button>
        <button class="btn" onclick="descargarPDF('${t.numero}')">PDF</button>
        <button class="btn-danger" onclick="borrar('${t.numero}')">X</button>
      </div>
      `
    })

  }catch(e){
    console.error(e)
    alert('Error de conexión o token inválido')
  }
}

// SOCKET
socket.on('actualizar',cargar)

// INIT
cargar()

</script>

</body>
</html>
