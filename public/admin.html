<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin Tickets PRO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script src="https://ticket-pro-xmhs.onrender.com/socket.io/socket.io.js"></script>

<style>
body { font-family: Arial; background:#eef2f7; padding:15px; }

.header-pro {
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  background:white;
  padding:12px;
  border-radius:14px;
  margin-bottom:20px;
  border-left:5px solid #003366;
}

input, select {
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
}

button {
  padding:10px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
}

.btn { background:#003366; color:white }
.btn-success { background:#28a745; color:white }
.btn-danger { background:#dc3545; color:white }
.btn-secondary { background:#6c757d; color:white }

.panel {
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  margin-bottom:15px;
}

.card {
  background:white;
  padding:12px;
  border-radius:12px;
  flex:1;
  font-weight:bold;
}

.ticket {
  background:white;
  padding:14px;
  margin:10px 0;
  border-radius:12px;
}

textarea {
  width:100%;
  border-radius:10px;
  border:1px solid #ccc;
}

.acciones-ticket {
  display:flex;
  gap:8px;
  margin-top:10px;
}
</style>
</head>

<body>

<script>
// 🔐 PROTECCIÓN
const TOKEN = localStorage.getItem('token')
if(!TOKEN){
  location.href = 'login.html'
}
</script>

<div class="header-pro">
  <input id="busqueda" placeholder="🔍 Buscar..." oninput="cargar()">

  <select id="filtroMes" onchange="cargar()">
    <option value="todos">📅 Todos</option>
  </select>

  <button class="btn" onclick="modo='pendientes';cargar()">Pendientes</button>
  <button class="btn-success" onclick="modo='todos';cargar()">Todos</button>
  <button class="btn-danger" onclick="logout()">Salir</button>
</div>

<div id="resumen"></div>
<div id="lista"></div>

<script>
const API = 'https://ticket-pro-xmhs.onrender.com'
const socket = io(API)
let modo = 'pendientes'

// LOGOUT
function logout(){
  localStorage.removeItem('token')
  location.href = 'login.html'
}

// FETCH AUTH
function fetchAuth(url, options = {}){
  return fetch(API + url, {
    ...options,
    headers:{
      'Content-Type':'application/json',
      'Authorization':'Bearer ' + TOKEN
    }
  })
}

// MESES BONITO
function cargarMeses(tickets){
  const select = document.getElementById('filtroMes')
  const actual = select.value

  const nombres = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre']
  const meses = new Set()

  tickets.forEach(t=>{
    if(!t.fecha) return
    const d = new Date(t.fecha)
    const mes = String(d.getMonth()+1).padStart(2,'0')
    const anio = d.getFullYear()
    meses.add(`${anio}-${mes}`)
  })

  select.innerHTML = `<option value="todos">📅 Todos</option>`

  ;[...meses].sort().reverse().forEach(m=>{
    const [anio,mes] = m.split('-')
    const nombre = nombres[parseInt(mes)-1]
    select.innerHTML += `<option value="${m}">${nombre} ${anio}</option>`
  })

  const hoy = new Date()
  const actualMes = `${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}`

  select.value = actual !== 'todos' ? actual : actualMes
}

// CRUD
async function guardar(id,campo,valor){
  await fetchAuth('/ticket/'+id,{
    method:'PUT',
    body: JSON.stringify({[campo]:valor})
  })
}

async function marcarEntregado(id){
  await fetchAuth('/ticket/'+id,{
    method:'PUT',
    body: JSON.stringify({entregado:'si'})
  })
  cargar()
}

async function borrar(id,nombre){
  if(!confirm(`¿Eliminar ticket de ${nombre}?`)) return
  await fetchAuth('/ticket/'+id,{method:'DELETE'})
}

// WHATSAPP
function listoWhatsApp(id,nombre,telefono,precio){
  let tel = (telefono||'').replace(/\D/g,'')
  if(tel.startsWith('0')) tel='598'+tel.substring(1)
  if(!tel.startsWith('598')) tel='598'+tel

  const msg = `Hola ${nombre} 👋
Tu equipo está listo ✅
🧾 ${id}
💲 ${precio||'A confirmar'}`

  window.open(`https://api.whatsapp.com/send?phone=${tel}&text=${encodeURIComponent(msg)}`)
}

// CARGAR
async function cargar(){

  try{

    const res = await fetchAuth('/tickets')
const text = await res.text()

console.log('RESPUESTA SERVER:', text)

const tickets = JSON.parse(text)

    let cotizaciones = []

try{
 

  console.log('COTIZACIONES:', text)

  cotizaciones = JSON.parse(text)
}catch(e){
  console.warn('Sin cotizaciones o error')
}

    cargarMeses(tickets)

    const mesSel = document.getElementById('filtroMes').value
    const filtro = document.getElementById('busqueda').value.toLowerCase()

    let rep = 0
    let ven = 0 // ventas desactivadas por ahora

    // REPARACIONES
    tickets.forEach(t=>{
      if(!t.fecha) return

      const d = new Date(t.fecha)
      const mes = String(d.getMonth()+1).padStart(2,'0')
      const anio = d.getFullYear()
      const clave = `${anio}-${mes}`

      if(mesSel !== 'todos' && clave !== mesSel) return

      if(t.entregado === 'si'){
        rep += parseFloat(t.ganancia) || 0
      }
    })

    // VENTAS
    

    document.getElementById('resumen').innerHTML = `
    <div class="panel">
      <div class="card">🔧 Reparaciones $${rep}</div>
      <div class="card">🛒 Ventas $${ven}</div>
      <div class="card">💰 Total $${rep+ven}</div>
    </div>
    `

    let filtrados = tickets

    if(modo==='pendientes'){
      filtrados = tickets.filter(t=>t.entregado!=='si')
    }

    filtrados = filtrados.filter(t=>{
      const match =
        (t.nombre||'').toLowerCase().includes(filtro) ||
        (t.telefono||'').includes(filtro)

      if(mesSel === 'todos') return match

      const d = new Date(t.fecha)
      const mes = String(d.getMonth()+1).padStart(2,'0')
      const anio = d.getFullYear()
      const clave = `${anio}-${mes}`

      return match && clave === mesSel
    })

    lista.innerHTML=''

    filtrados.reverse().forEach(t=>{

      const nombre = (t.nombre || '').replace(/'/g,"")

      lista.innerHTML += `
      <div class="ticket">

        <b>${t.numero}</b><br>
        ${nombre} (${t.telefono})<br>
        ${t.problema}<br><br>

        💲 <input class="precio" value="${t.precio||''}" 
        onchange="guardar('${t.numero}','precio',this.value)">

        💰 <input value="${t.ganancia||''}" 
        onchange="guardar('${t.numero}','ganancia',this.value)">

        <br><br>

        <textarea onblur="guardar('${t.numero}','detalle',this.value)">
${t.detalle||''}</textarea>

        <div class="acciones-ticket">

          <button class="btn-secondary"
          onclick="marcarEntregado('${t.numero}')">
          ✔ Entregado
          </button>

          <button class="btn-success"
          onclick="listoWhatsApp('${t.numero}','${nombre}','${t.telefono}', this.closest('.ticket').querySelector('.precio').value)">
          📲 WhatsApp
          </button>

          <button class="btn-danger"
          onclick="borrar('${t.numero}','${nombre}')">
          ❌ Eliminar
          </button>

        </div>

      </div>
      `
    })

  }catch(e){
    console.error(e)
    alert('Error conexión')
  }
}

// SOCKET (TIEMPO REAL)
socket.on('actualizar',()=>cargar())

// INIT
cargar()
</script>

</body>
</html>
